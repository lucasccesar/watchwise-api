<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Watchwise — Modelo Lógico do Banco de Dados</title>
<style>
  body { font-family: sans-serif; background: #fff; padding: 24px; }
  h1 { font-size: 20px; font-weight: 500; margin-bottom: 16px; }
  #erd { overflow-x: auto; }
</style>
</head>
<body>
<h1>Watchwise — Modelo lógico do banco de dados (v4)</h1>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
mermaid.initialize({ startOnLoad: false, theme: 'default', fontFamily: 'sans-serif', fontSize: '14px' });
const def = `erDiagram
  USUARIO ||--o{ COMENTARIO : escreve
  USUARIO ||--o{ AVALIACAO : avalia
  USUARIO ||--o{ LISTA : cria
  USUARIO ||--o{ LOG : registra
  USUARIO ||--o{ CURTIDA : curte
  USUARIO ||--o{ SEGUIDOR : segue
  USUARIO ||--o{ TOP5 : escolhe
  USUARIO ||--o{ SEGUE_PESSOA : segue
  USUARIO ||--o{ NOTIFICACAO : recebe
  CONTEUDO ||--o{ COMENTARIO : recebe
  CONTEUDO ||--o{ AVALIACAO : recebe
  CONTEUDO ||--o{ LOG : registrado_em
  CONTEUDO ||--o{ ITEM_LISTA : aparece_em
  CONTEUDO ||--o{ TOP5 : e_escolhido
  CONTEUDO ||--o{ NOTIFICACAO : gera
  LISTA ||--o{ ITEM_LISTA : contem
  COMENTARIO ||--o{ CURTIDA : recebe
  LOG }o--o| COMENTARIO : possui
  LOG }o--o| AVALIACAO : possui
  LOG ||--o{ CURTIDA : recebe

  USUARIO {
    int id PK
    string nome
    string email
    string senha
    string descricao
    string foto_perfil
    boolean conta_publica
    timestamp created_at
    timestamp updated_at
  }
  SEGUIDOR {
    int seguidor_id FK
    int seguido_id FK
    timestamp created_at
  }
  TOP5 {
    int usuario_id FK
    int conteudo_id FK
    int posicao
    timestamp created_at
    timestamp updated_at
  }
  SEGUE_PESSOA {
    int usuario_id FK
    string pessoa_tmdb_id
    timestamp created_at
  }
  CONTEUDO {
    int id PK
    string tmdb_id
    string tipo
    string serie_tmdb_id
    int numero_temporada
    int numero_episodio
    timestamp created_at
    timestamp updated_at
  }
  COMENTARIO {
    int id PK
    int usuario_id FK
    int conteudo_id FK
    string texto
    int upvotes
    int downvotes
    timestamp created_at
    timestamp updated_at
  }
  AVALIACAO {
    int id PK
    int usuario_id FK
    int conteudo_id FK
    int nota
    timestamp created_at
    timestamp updated_at
  }
  LISTA {
    int id PK
    int usuario_id FK
    string nome
    string descricao
    boolean publica
    timestamp created_at
    timestamp updated_at
  }
  ITEM_LISTA {
    int id PK
    int lista_id FK
    int conteudo_id FK
    int posicao
    int nota
    string descricao
    timestamp created_at
    timestamp updated_at
  }
  LOG {
    int id PK
    int usuario_id FK
    int conteudo_id FK
    int comentario_id FK
    int avaliacao_id FK
    date data_assistido
    boolean assistido_cinema
    string poster_personalizado
    timestamp created_at
    timestamp updated_at
  }
  CURTIDA {
    int id PK
    int usuario_id FK
    int comentario_id FK
    int log_id FK
    timestamp created_at
  }
  NOTIFICACAO {
    int id PK
    int usuario_id FK
    int conteudo_id FK
    string tipo
    string mensagem
    boolean lida
    timestamp created_at
    timestamp updated_at
  }`;
const { svg } = await mermaid.render('erd-svg', def);
document.getElementById('erd').innerHTML = svg;
</script>
</body>
</html>
