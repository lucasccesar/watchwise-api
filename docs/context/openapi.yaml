        "400": { description: Parent comment belongs to another target }
        "401": { description: Não autenticado }
        "403": { description: Pick privado para o viewer }
        "404": { description: Pick ou comentário-pai não encontrado }

  /picks/{pickId}/like:
    post:
      tags: [Likes]
      summary: Curtir um Pick
      parameters:
        - { name: pickId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Curtido }
