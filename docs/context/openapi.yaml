              schema: { $ref: "#/components/schemas/ApiError" }
        "404": { description: Template, categoria ou opção não encontrado }
        "409": { description: Opção já usada por selection não pode ser excluída }

  # ---------- PICKS ----------
  /picks-templates/{templateId}/picks:
    get:
      tags: [Picks]
      summary: Listar Picks visíveis de um template
      description: >
        Retorna uma `PageResponse<PickPreview>` filtrada pela visibilidade do viewer: o proprietário
        vê os próprios Picks, e terceiros veem Picks `PUBLIC` ou `FOLLOWERS` quando existe relação
        `ACCEPTED`. O sort padrão é `RECENT`; `POPULAR` ordena por likes e `RECENT` por data de criação.
        A resposta é `PickPreviewPage`, com até cinco categorias respondidas por preview.
      parameters:
        - { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sort, in: query, description: Ordenação dos Picks; o padrão é `RECENT`., schema: { type: string, enum: [POPULAR, RECENT], default: RECENT } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Página de previews de Picks visíveis, content: { application/json: { schema: { $ref: "#/components/schemas/PickPreviewPage" } } } }
        "400": { description: Paginação inválida ou falha de binding do enum sort; retorna ApiError }
        "401": { description: Não autenticado }
        "404": { description: Template não encontrado }
    post:
      tags: [Picks]
      summary: Criar Pick em um template
      description: Cada usuário pode criar Picks independentes no mesmo template. A requisição precisa conter pelo menos uma selection válida; o limite é de duas tentativas por minuto por usuário autenticado e é consumido antes de CSRF e binding MVC.
      parameters:
        - { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PickCreation" }
      responses:
        "201": { description: Pick criado, content: { application/json: { schema: { $ref: "#/components/schemas/Pick" } } } }
        "400": { description: Corpo, categoria, alvo ou elegibilidade inválido }
        "401": { description: Não autenticado }
        "403":
          description: Cookie CSRF ausente ou inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404": { description: Template ou alvo não encontrado }
        "429": { description: Mais de duas tentativas de criação no minuto }
        "502": { description: TMDB indisponível }

  /picks-templates/{templateId}/my-picks:
    get:
      tags: [Picks]
      summary: Listar meus Picks em um template
      parameters:
