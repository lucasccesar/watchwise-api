  /users/{userId}/picks:
    get:
      tags: [Picks]
      summary: Listar Picks visíveis de um usuário
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: templateId, in: query, schema: { type: string, format: uuid }, description: Filtro opcional pelo template. }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
