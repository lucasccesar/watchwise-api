        "502": { description: TMDB indisponível ao validar as selections atuais }

  /picks/{pickId}/categories/{categoryId}/selection:
    parameters:
      - { name: pickId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Picks]
      summary: Criar ou substituir selection de um Pick próprio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PickTarget" }
      responses:
        "200": { description: Pick com selection atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/Pick" } } } }
        "400": { description: Corpo, alvo ou pertencimento da categoria inválido }
        "401": { description: Não autenticado }
        "403":
          description: Cookie CSRF ausente ou inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404": { description: Pick ou categoria não encontrado }
        "502": { description: TMDB indisponível }
    delete:
      tags: [Picks]
      summary: Excluir selection de um Pick próprio
      responses:
        "204": { description: Selection excluída }
        "401": { description: Não autenticado }
        "403":
          description: Cookie CSRF ausente ou inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404": { description: Pick ou selection não encontrado }
        "409": { description: A última selection não pode ser removida }

  /contents/reference:
    post:
      tags: [Content]
      summary: >
        Obter ou criar a referência local de um conteúdo do TMDB
        (identificado por tmdbId + type, mais seriesTmdbId/seasonNumber/
        episodeNumber quando type é SEASON ou EPISODE). Chamado
        internamente sempre que o usuário interage pela primeira vez
        com um filme, série, temporada ou episódio (comentar, avaliar,
        logar, adicionar a lista, etc). Idempotente. Na primeira vez que
        um tmdbId/seriesTmdbId é referenciado (nenhum Content local ainda
        existe pra ele), o backend verifica a existência no TMDB antes de
        criar a linha (MOVIE/SERIES via tmdbId; SEASON/EPISODE via
        seriesTmdbId) — se a referência já existe localmente, essa
        verificação é pulada (nunca chama o TMDB de novo pra algo que já
        foi confirmado real antes, por qualquer usuário). Nessa mesma
        checagem, pra MOVIE/SERIES, o backend também deriva
        genres/releaseYear/countries (e runtimeMinutes, só pra MOVIE) da
        resposta do TMDB já obtida — sem custo de chamada extra — e
        preenche automaticamente numa referência já existente que ainda
        não os tenha (best-effort, nunca bloqueia a requisição). Pra
        EPISODE fora de um /diary/bulk (que já deriva runtimeMinutes por
        conta própria), o backend faz uma chamada adicional ao TMDB pra
        aquele episódio específico pra derivar runtimeMinutes — o que
        também verifica, pela primeira vez, que aquele número de episódio
        realmente existe (SEASON continua verificando só a série-mãe, não
        o número da temporada em si). Ver ContentRefCreation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentRefCreation" }
      responses:
        "200":
          description: Referência obtida ou criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentRef" }
        "400":
          description: >
            Combinação de campos inválida para o type informado (ex:
            tmdbId ausente para MOVIE/SERIES, ou seriesTmdbId/seasonNumber
            ausente para SEASON/EPISODE), ou runtimeMinutes/genres/releaseYear/
            countries informados por um cliente — todos são sempre derivados
            do TMDB pelo backend, nunca aceitos na requisição (ver
            ContentRefCreation).
        "404":
          description: >
            O tmdbId (MOVIE/SERIES) ou seriesTmdbId (SEASON) não corresponde
            a nenhum título real no TMDB — só verificado na primeira vez que
            essa referência é criada, nunca para uma já existente. Pra
            EPISODE, também cobre o número do episódio específico não
            corresponder a nenhum episódio real da temporada (verificado ao
            derivar runtimeMinutes).
        "409":
          description: >
            Outro episódio já está marcado como finale desta temporada, ou
            outra temporada já está marcada como finale desta série (ver
            isSeasonFinale/isSeriesFinale em ContentRefCreation).
        "401":
          description: Não autenticado
        "403":
          description: Cookie CSRF ausente ou inválido
        "429":
          description: >
            Muitas chamadas vindas desse usuário. Tente novamente após o
            período configurado.
        "502":
          description: >
            TMDB indisponível após uma tentativa extra de retry, ao
            verificar a existência do tmdbId/seriesTmdbId — só na primeira
            vez que essa referência é criada (inclui a chamada extra pra
            derivar runtimeMinutes de um EPISODE novo).

  /contents/{contentId}/comments:
    get:
      tags: [Comments]
      summary: Listar comentários de um conteúdo
      description: Exige autenticação, como qualquer outra rota fora da discover (ver Access policy no CLAUDE.md).
      parameters:
        - $ref: "#/components/parameters/contentId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/Comment" }
        "401": { description: Não autenticado }
    post:
      tags: [Comments]
      summary: Comentar em um conteúdo
      parameters:
        - $ref: "#/components/parameters/contentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 280 }
                parentCommentId: { type: string, format: uuid, nullable: true }
                containsSpoiler: { type: boolean, default: false }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { description: "parentCommentId aponta para um comentário que não pertence a esse conteúdo" }
        "401": { description: Não autenticado }
        "404": { description: "Conteúdo não encontrado, ou parentCommentId não encontrado" }

  /contents/{contentId}/stats:
    get:
      tags: [Content]
      summary: Estatísticas agregadas de um conteúdo entre todos os usuários
      description: >
        Sem entidade própria — agregação de DiaryEntry/Comment por contentId. Um contentId sem
        nenhuma interação ainda devolve averageScore null e os três contadores em 0, nunca 404.
      parameters:
        - $ref: "#/components/parameters/contentId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentStats" }
        "401": { description: Não autenticado }

  /contents/stats:
    get:
      tags: [Content]
      summary: Estatísticas agregadas de vários conteúdos de uma vez (batch)
      description: >
        Mesma agregação de GET /contents/{contentId}/stats, evitando N chamadas — usado pela lista
        de episódios de uma temporada. Devolve um item por id pedido, na mesma ordem, com stats
        zeradas para qualquer id sem interação ainda.
      parameters:
        - name: ids
          in: query
          required: true
          schema: { type: array, items: { type: string, format: uuid }, maxItems: 100 }
          style: form
          explode: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ContentStats" } }
        "400": { description: "ids ausente/vazio, ou mais de 100 ids" }
        "401": { description: Não autenticado }

  /contents/{contentId}/details:
    get:
      tags: [Content]
      summary: Detalhe de um conteúdo, resolvido pelo backend via proxy do TMDB
      description: >
        O backend resolve tmdbId (MOVIE/SERIES) ou seriesTmdbId+seasonNumber(+episodeNumber)
        (SEASON/EPISODE) do Content, chama o TMDB com preferredLanguage do usuário autenticado
        (ver UserResponseDTO), cacheia a resposta (chave inclui o idioma, não a região — Caffeine,
        TTL configurável) e devolve já com o título resolvido (tradução → título alternativo da
        preferredRegion do usuário → título original) e watchProviders já filtrado pra
        preferredRegion. SEASON/EPISODE reaproveitam gêneros/países/elenco regular/criadores da
        SERIES do mesmo seriesTmdbId (mesma resposta cacheada), igual à regra que Content.genres/
        countries já usa. Nenhuma chamada ao TMDB é feita pelo cliente.
      parameters:
        - $ref: "#/components/parameters/contentId"
        - name: posterUserId
          in: query
          required: false
          description: >
            Usuario cujo poster customizado deve ser resolvido. Se omitido, usa o poster do viewer
            autenticado. Quando informado, o viewer precisa ter acesso ao perfil desse usuario;
            em uma pagina direta de conteudo, omita este parametro mesmo que a navegacao tenha vindo
            de um perfil.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentDetailsDTO" }
        "401": { description: Não autenticado }
        "403": { description: Perfil do posterUserId privado e nao visivel ao viewer }
        "404": { description: Content, posterUserId ou usuário autenticado não encontrado }
        "502": { description: TMDB indisponível após uma tentativa extra de retry }

  /contents/details:
    get:
      tags: [Content]
      summary: Detalhe de vários conteúdos de uma vez (batch), mesma resolução de GET /contents/{contentId}/details
      description: >
        Mesma resolução de GET /contents/{contentId}/details, evitando N chamadas — usado por toda
        tela que lista Content (diário, listas, Top5, watchlist, feed, rankings de summary). Devolve
        um item por id pedido, na mesma ordem.
      parameters:
        - name: ids
          in: query
          required: true
          schema: { type: array, items: { type: string, format: uuid }, maxItems: 100 }
          style: form
          explode: true
        - name: posterUserId
          in: query
          required: false
          description: >
            Usuario cujos posters customizados devem ser resolvidos para todos os ids. Se omitido,
            usa o poster do viewer autenticado. Quando informado, o viewer precisa ter acesso ao
            perfil desse usuario; em uma pagina direta de conteudo, omita este parametro.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ContentDetailsDTO" } }
        "400": { description: "ids ausente/vazio, ou mais de 100 ids" }
        "401": { description: Não autenticado }
        "403": { description: Perfil do posterUserId privado e nao visivel ao viewer }
        "404": { description: Algum content, posterUserId ou o usuário autenticado não encontrado }
        "502": { description: TMDB indisponível após uma tentativa extra de retry }

  /contents/{contentId}/reviews:
    get:
      tags: [Diary]
      summary: Listar reviews de um conteúdo entre todos os usuários
      description: >
        DiaryEntry com comment preenchido, de qualquer usuário, escopado por contentId — diferente
        de hasReview=true em GET /users/{userId}/diary (escopado por um único usuário). Cada review
        segue a mesma regra de visibilidade de perfil privado já usada em curtidas/comentários de
        diário (dono, perfil público, ou perfil privado que o viewer segue com status aceito).
      parameters:
        - $ref: "#/components/parameters/contentId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/ContentReview" }
        "401": { description: Não autenticado }
        "404": { description: Conteúdo não encontrado }

  # ---------- COMMENTS (por id) ----------
  /comments/{commentId}:
    delete:
      tags: [Comments]
      summary: Remover um comentário próprio
      parameters:
        - $ref: "#/components/parameters/commentId"
      responses:
        "204": { description: Removido }
        "401": { description: Não autenticado }
        "404": { description: "Comentário não encontrado, ou não pertence ao usuário autenticado" }

  /comments/{commentId}/like:
    post:
      tags: [Likes]
      summary: Curtir um comentário
      parameters:
        - $ref: "#/components/parameters/commentId"
      responses:
        "204": { description: Curtido }
        "401": { description: Não autenticado }
        "403": { description: "O comentário está em uma lista ou registro de diário privado que o viewer não pode ver" }
        "404": { description: Comentário não encontrado }
    delete:
      tags: [Likes]
      summary: Remover curtida de um comentário
      parameters:
        - $ref: "#/components/parameters/commentId"
      responses:
        "204": { description: Curtida removida }
        "401": { description: Não autenticado }

  # ---------- LISTS ----------
  /users/{userId}/lists:
    get:
      tags: [Lists]
      summary: Listar as listas de um usuário
      description: >
        Duas camadas de visibilidade combinadas. Primeiro, a mesma regra padrão usada em
        Top5/Watchlist/Dropped/DiaryEntry: se o perfil do dono for privado e o viewer não for o
        próprio dono nem seguir o dono com status aceito, a requisição inteira é bloqueada com 403,
        antes de sequer olhar as listas. Passada essa barreira (perfil público, ou viewer é o dono,
        ou viewer segue o dono), cada lista tem sua própria visibilidade (PUBLIC/FOLLOWERS/PRIVATE —
        ver UserListCreation): o dono sempre vê todas as suas listas; qualquer outro viewer só vê as
        PUBLIC, mais as FOLLOWERS se de fato seguir o dono com status aceito — nunca vê PRIVATE.
        Paginado, igual às demais listagens sem teto por usuário. Cada lista no array content já vem
        com previewItems (até 5 primeiros itens de conteúdo) e nestedListsCount (ver schema UserList),
        pensado pra renderizar a listagem sem precisar de uma chamada extra por lista.
      parameters:
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/page"
        - name: size
          in: query
          description: Itens por pagina; assume 10 se omitido. O minimo e o maximo sao 10; valores acima de 10 sao limitados a 10.
          schema: { type: integer, minimum: 10, maximum: 10, default: 10 }
        - name: sortBy
          in: query
          description: >
            rank, updatedAt, name e likesCount ordenam por coluna real de UserList (mais recente/
            maior primeiro por padrão — ver sortDirection). itemsCount e commentsCount agregam
            (JOIN + COUNT) numa query nativa própria, não pela coluna. Valor desconhecido é 400.
          schema: { type: string, enum: [rank, updatedAt, name, likesCount, itemsCount, commentsCount] }
        - name: sortDirection
          in: query
          description: "asc ou desc (default varia pelo campo — ver sortBy). Valor desconhecido é 400."
          schema: { type: string, enum: [asc, desc] }
        - name: contentId
          in: query
          description: >
            Quando informado, cada lista no array content vem com containsContent preenchido
            (true/false) em vez de null, indicando se esse content já está na lista — pensado pra
            tela de "adicionar a uma lista" a partir da tela de um content marcar as listas que já
            o contêm. Um contentId que não existe simplesmente resolve containsContent=false pra
            todas as listas, sem erro.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/UserList" }
        "400": { description: "Número/tamanho de página inválido, sortBy desconhecido, ou userId não é um UUID válido" }
        "403": { description: "Perfil do dono é privado e o viewer não é o dono nem o segue com status aceito" }
        "404": { description: Usuário não encontrado }

  /users/me/liked-lists:
    get:
      tags: [Lists]
      summary: Listar as listas que o usuário autenticado curtiu
      description: >
        Sempre auto-visão (não existe GET /users/{userId}/liked-lists) — não precisa resolver
        visibilidade de terceiro, já que o viewer só pode estar vendo as próprias curtidas.
        Paginado, ordenado pela curtida mais recente primeiro. Cada lista no array content vem
        no mesmo formato de GET /users/{userId}/lists (previewItems, nestedListsCount,
        itemsCount, commentsCount etc.).
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/UserList" }
        "400": { description: Número/tamanho de página inválido }

  /users/me/lists:
    post:
      tags: [Lists]
      summary: Criar uma nova lista para o usuário autenticado
      description: >
        Sempre em nome do usuário autenticado — diferente de GET /users/{userId}/lists (que aceita
        qualquer userId pra ver listas de terceiros), não existe POST /users/{userId}/lists,
        seguindo o mesmo padrão de /users/me/top5/{type}, /users/me/watchlist/{type} e
        /users/me/dropped/{type}/{tmdbId}: a posse nunca depende de um userId vindo do cliente.
        visibility omitido tem default PUBLIC.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserListCreation" }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "400": { description: name ausente/vazio }
        "403": { description: Cookie CSRF ausente ou inválido }

  /users/me/lists/bulk:
    post:
      tags: [Lists]
      summary: Criar uma lista já populada com vários itens de conteúdo (filmes e/ou séries)
      description: >
        Atalho para não precisar chamar POST /users/me/lists seguido de N chamadas a
        POST /lists/{listId}/items: cria a lista e insere todo o array items, na ordem enviada,
        na mesma transação — tudo ou nada, um item inválido ou duplicado (dentro do próprio
        payload ou já existente na lista, o que é impossível numa lista recém-criada) reverte a
        lista inteira, não só o item que falhou. Cada item é resolvido pelo mesmo caminho
        get-or-create idempotente usado por POST /contents/reference, e cai nas mesmas regras de
        item único usadas por POST /lists/{listId}/items. Só aceita content (Conteudo) por item —
        para adicionar uma lista aninhada como item, crie a lista aqui (sem itens ou com outros
        filmes/séries) e use POST /lists/{listId}/items depois. items exige entre 1 e 100
        entradas. visibility omitido tem default PUBLIC, igual a POST /users/me/lists. Na resposta
        201, items é o conjunto completo de itens criados, na ordem enviada — não uma página;
        itemsSize e itemsTotalElements são iguais à quantidade de itens criados, itemsTotalPages é
        0 quando o conjunto está vazio e 1 caso contrário, e itemsHasNext é sempre false.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserListBulkCreation" }
      responses:
        "201":
          description: Criada com os itens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserListDetailed" }
        "400": { description: "name ausente/vazio, items ausente/vazio/maior que 100, ou algum item de content inválido" }
        "403": { description: Cookie CSRF ausente ou inválido }
        "404":
          description: >
            Algum tmdbId/seriesTmdbId dos items não corresponde a nenhum título real no TMDB —
            só verificado na primeira vez que essa referência é criada (ver POST /contents/reference);
            reverte a lista inteira, igual a qualquer outra falha do bulk.
        "409": { description: "Dois itens do payload apontam para o mesmo conteúdo (duplicata dentro do próprio bulk)" }
        "502":
          description: >
            TMDB indisponível ao verificar a existência de algum tmdbId/seriesTmdbId — só na
            primeira vez que essa referência é criada (ver POST /contents/reference).

  /lists/discover:
    get:
      tags: [Lists]
      summary: Descobrir listas públicas
      description: >
        Endpoint autenticado para descobrir listas públicas. Retorna somente listas com
        visibility=PUBLIC, independentemente da visibilidade do perfil do dono. A ordenação é fixa:
        likesCount decrescente, createdAt decrescente e UUID decrescente como desempate determinístico.
      parameters:
        - $ref: "#/components/parameters/page"
        - name: size
          in: query
          description: Itens por página; assume 10 se omitido. O mínimo e o máximo são 10; valores acima de 10 são limitados a 10.
          schema: { type: integer, minimum: 10, maximum: 10, default: 10 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/UserList" }
        "400": { description: "Número/tamanho de página inválido" }
        "401": { description: Não autenticado }

  /lists/{listId}:
    get:
      tags: [Lists]
      summary: Obter uma lista com seus itens
      description: >
        Visibilidade checada só pela própria lista (PUBLIC/FOLLOWERS/PRIVATE — ver
        UserListCreation), nunca pelo perfil do dono estar público ou privado: diferente de
        GET /users/{userId}/lists (que bloqueia a listagem inteira se o perfil do dono for privado
        e o viewer não o seguir), aqui uma lista PUBLIC é acessível diretamente por qualquer
        usuário autenticado mesmo que o perfil do dono seja privado. FOLLOWERS exige que o viewer
        siga o dono com status aceito (ou seja o próprio dono); PRIVATE só o próprio dono.
        Os filtros type/genre e a ordenação são aplicados ao conjunto completo de itens antes do
        recorte da página. page e size são opcionais: a API usa páginas 1-based, com page=1 e
        size=20 quando omitidos. O tamanho efetivo é limitado a 24 para listas com itemScope
        EPISODE e a 30 para todos os demais escopos; valores acima do limite são reduzidos ao
        limite correspondente.
      parameters:
        - $ref: "#/components/parameters/listId"
        - name: type
          in: query
          description: Filtra os itens por tipo de conteúdo (só aplicável a listas de conteúdo, não de listas aninhadas).
          schema: { type: string, enum: [MOVIE, SERIES, SEASON, EPISODE] }
        - name: genre
          in: query
          description: Filtra os itens cujo Content.genres (ver ContentRefCreation) contém esse gênero.
          schema: { type: string }
        - name: sortBy
          in: query
          description: >
            Aplicado em memória sobre a lista de itens já carregada, antes do recorte da página.
            alfabética e data de lançamento não são suportadas — Content nunca guarda título nem
            data de lançamento (dados só do TMDB); isso é sempre responsabilidade do cliente.
            episodeAvgRating ordena por DiaryEntry.score médio dos episódios (EPISODE) do dono da
            lista — nunca do viewer — calculado por série (item SERIES), por temporada (item
            SEASON) ou pelo próprio episódio (item EPISODE); item MOVIE ou de lista aninhada não
            tem esse valor. Esse sort só pode ser usado pelo dono, por quem pode ver o perfil
            público do dono ou por um seguidor aceito; caso contrário retorna 403. globalEpisodeAvgRating
            usa notas de episódios dadas por usuários com perfil público e calcula a média no escopo
            do item SERIES, SEASON ou EPISODE; MOVIE e listas aninhadas não têm esse valor.
            contentAvgRating usa notas dadas diretamente ao próprio Content por usuários com perfil
            público, para MOVIE, SERIES, SEASON ou EPISODE; listas aninhadas não têm esse valor.
            Os três sorts deixam itens sem média por último em ambas as direções. As médias globais
            permanecem disponíveis quando a lista está visível, mesmo que o perfil do dono seja privado.
          schema: { type: string, enum: [position, dateAdded, duration, episodeAvgRating, globalEpisodeAvgRating, contentAvgRating] }
        - name: sortDirection
          in: query
          description: "asc ou desc. Valor desconhecido é 400."
          schema: { type: string, enum: [asc, desc] }
        - name: page
          in: query
          description: Número da página dos itens, com semântica 1-based. Assume 1 quando omitido; valores menores que 1 retornam 400.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          description: >
            Itens por página; assume 20 quando omitido. O máximo efetivo é 24 para listas cujo
            itemScope é EPISODE e 30 para todos os outros escopos. Valores acima do máximo são
            limitados ao teto correspondente; valores menores que 1 retornam 400.
          schema: { type: integer, minimum: 1, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserListDetailed" }
        "400": { description: "listId não é um UUID válido, sortBy desconhecido, page menor que 1 ou size menor que 1" }
        "403": { description: "Lista é FOLLOWERS e o viewer não segue o dono, lista é PRIVATE e o viewer não é o dono, ou sortBy=episodeAvgRating não é permitido para o viewer pela privacidade do perfil do dono" }
        "404": { description: Lista não encontrada }
    patch:
      tags: [Lists]
      summary: Atualizar dados de uma lista
      description: >
        Patch parcial de verdade: name, description, visibility e rank são todos opcionais, e só o
        campo enviado como não-null é alterado — o restante permanece como estava. Omitir ou mandar
        null em qualquer um deles significa "não mexer nesse campo", igual ao PatchUserDTO de
        PATCH /users/me. Não existe forma de limpar description para null via este endpoint depois
        de definida (mesma limitação de PatchUserDTO). name, se enviado, não pode ser
        vazio/só-espaço. rank reordena a lista entre as demais do mesmo dono (1 a N, N = quantidade
        de listas já rankeadas) — uma lista sem rank ainda é adotada no fim da sequência antes de
        mover. Só o dono da lista pode atualizar.
      parameters:
        - $ref: "#/components/parameters/listId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserListPatch" }
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "400": { description: "name enviado vazio/só-espaço, rank maior que a quantidade de listas rankeadas, ou listId não é um UUID válido" }
        "403": { description: Cookie CSRF ausente ou inválido }
        "404": { description: "Lista não encontrada, ou não pertence ao usuário autenticado" }
        "409": { description: "rank reordenado concorrentemente por outra requisição" }
    delete:
      tags: [Lists]
      summary: Remover uma lista
      description: Só o dono da lista pode remover.
      parameters:
        - $ref: "#/components/parameters/listId"
      responses:
        "204": { description: Removida }
        "400": { description: listId não é um UUID válido }
        "403": { description: Cookie CSRF ausente ou inválido }
        "404": { description: "Lista não encontrada, ou não pertence ao usuário autenticado" }

  /lists/{listId}/progress:
    get:
      tags: [Lists]
      summary: Obter o progresso dos itens de uma lista
      description: >
        Usa a mesma visibilidade de GET /lists/{listId}. O progresso é sempre calculado para o usuário
        autenticado que visualiza a lista, nunca para o dono dela. Todos os itens de uma lista de conteúdo
        são retornados na ordem da lista. Filmes e episódios não expõem estado individual de assistência:
        a resposta informa somente watchedItems, totalItems e watchedPercentage. Séries e temporadas incluem
        progresso detalhado, inclusive itens com 0%, progresso parcial e 100%. Listas de listas retornam 400.
        A leitura de séries usa snapshots compartilhados de progresso e deduplica seriesTmdbId.
      description: Returns a paginated mix of DiaryEntry and DroppedEntry reviews. Each item exposes
        source=DIARY or source=DROPPED so the client can target the correct social endpoints.
      parameters:
        - $ref: "#/components/parameters/listId"
      responses:
        "200":
          description: Progresso da lista
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserListProgress" }
        "400": { description: "listId não é um UUID válido ou a lista é de listas aninhadas" }
        "401": { description: Não autenticado }
        "403": { description: "Lista FOLLOWERS sem seguimento aceito ou lista PRIVATE de outro usuário" }
        "404": { description: Lista não encontrada }
        "502": { description: TMDB indisponível ao hidratar um snapshot frio de progresso }

  /lists/{listId}/items:
    post:
      tags: [Lists]
      summary: Adicionar um item (conteúdo ou lista aninhada) à lista
      description: >
        Exatamente um entre content e childListId deve ser informado, nunca os dois nem nenhum (400).
        Sem score neste endpoint — a nota de um conteúdo é sempre a de DiaryEntry, não uma por item de
        lista; description é a única anotação livre aceita, para os dois formatos de item. childListId
        pode apontar para uma lista do próprio usuário, ou para uma lista de outro usuário desde que
        visível a quem está adicionando (PUBLIC sempre, FOLLOWERS só se seguir o dono com status
        aceito — 403 caso contrário, mesma regra de visibilidade de GET /lists/{listId}); a lista
        referenciada não pode já conter outras listas como item (profundidade máxima de um nível) nem
        pode ser a própria lista (400 nos dois casos). Uma lista trava como "de conteúdo" ou "de listas"
        a partir do seu primeiro item — tentar misturar os dois tipos na mesma lista devolve 400.
        position é opcional: se omitido, o item entra na última posição; se informado, os itens a
        partir dali deslocam +1 (400 se maior que a próxima posição livre). customPosterUrl só é
        aceito quando content é informado — 400 se vier junto com childListId.
      parameters:
        - $ref: "#/components/parameters/listId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { $ref: "#/components/schemas/ContentRefCreation" }
                childListId: { type: string, format: uuid }
                position: { type: integer, minimum: 1 }
                description: { type: string, maxLength: 400 }
                customPosterUrl: { type: string, format: uri, maxLength: 2048, pattern: '^https://image\.tmdb\.org/t/p/w342/.+$', nullable: true }
      responses:
        "201":
          description: Adicionado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserListItem" }
        "400":
          description: >
            Nem content nem childListId informado (ou os dois), position maior que a próxima posição
            livre, childListId igual ao próprio listId, childListId aponta para uma lista que já
            contém outras listas como item, a lista já está travada no tipo oposto (conteúdo x
            lista aninhada), ou customPosterUrl informado junto com childListId.
        "403": { description: "Cookie CSRF ausente ou inválido, ou childListId aponta para uma lista FOLLOWERS/PRIVATE não visível a quem está adicionando" }
        "404":
          description: >
            Lista não encontrada (ou não pertence ao usuário autenticado), childListId não
            encontrado, ou o tmdbId/seriesTmdbId de content não corresponde a nenhum título real
            no TMDB (só verificado na primeira vez que essa referência é criada — ver
            POST /contents/reference).
        "409": { description: "Esse content (ou childListId) já está nessa lista, ou a posição foi ocupada por uma inserção concorrente" }
        "502":
          description: >
            TMDB indisponível ao verificar a existência do tmdbId/seriesTmdbId de content — só na
            primeira vez que essa referência é criada (ver POST /contents/reference).

  /lists/{listId}/items/bulk:
    post:
      tags: [Lists]
      summary: Adicionar vários itens de conteúdo a uma lista existente
      description: >
        Atalho para não precisar chamar POST /lists/{listId}/items uma vez por item: insere todo o
        array items, na ordem enviada, na mesma transação — tudo ou nada, um item inválido ou
        duplicado (dentro do próprio payload ou já existente na lista) reverte a operação inteira,
        nenhum item fica inserido. Reaproveita o mesmo POST /lists/{listId}/items chamado uma vez por
        item: cada item é resolvido pelo mesmo caminho get-or-create idempotente usado por
        POST /contents/reference, sempre inserido na última posição livre (nenhum position é aceito
        aqui — para posição explícita, use POST /lists/{listId}/items avulso), e cai nas mesmas regras
        de item único e trava de tipo usadas por esse endpoint. Só aceita content (Conteudo) por item,
        igual a POST /users/me/lists/bulk — não é possível inserir childListId em massa; para itens de
        lista aninhada, use POST /lists/{listId}/items. items exige entre 1 e 100 entradas.
      parameters:
        - $ref: "#/components/parameters/listId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserListItemBulkCreation" }
      responses:
        "201":
          description: Itens adicionados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserListItem" }
        "400":
          description: >
            items ausente/vazio/maior que 100, algum item de content inválido, ou a lista já está
            travada como lista-de-listas (só aceita content).
        "403": { description: Cookie CSRF ausente ou inválido }
        "404":
          description: >
            Lista não encontrada (ou não pertence ao usuário autenticado), ou o
            tmdbId/seriesTmdbId de algum item não corresponde a nenhum título real no TMDB (só
            verificado na primeira vez que essa referência é criada — ver POST /contents/reference);
            reverte a inserção inteira, igual a qualquer outra falha do bulk.
        "409": { description: "Dois itens do payload apontam para o mesmo conteúdo, ou algum já está na lista" }
        "502":
          description: >
            TMDB indisponível ao verificar a existência de algum tmdbId/seriesTmdbId — só na
            primeira vez que essa referência é criada (ver POST /contents/reference).

  /lists/{listId}/items/{itemId}:
    patch:
      tags: [Lists]
      summary: Editar a posição e/ou a descrição de um item da lista
      description: >
        position e description são independentes e ambos opcionais — envie só o que quiser alterar.
        Se position for informado e diferente da posição atual, move o item para lá, deslocando +1 ou
        -1 os itens entre a posição antiga e a nova (mesmo algoritmo de reordenação de
        PATCH /users/me/watchlist/{type}/{watchlistEntryId}); deve estar entre 1 e o total de itens
        atuais dessa lista (não é possível "mover para o fim" além do que já existe; para isso, remova
        e insira de novo). Se position for igual à posição atual, não faz nada com a posição. Preserva
        o id/createdAt do item, ao contrário de remover e recriar. customPosterUrl só é aceito quando
        o item é de content — 400 se o item alvo for de lista aninhada.
      parameters:
        - $ref: "#/components/parameters/listId"
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                position: { type: integer, minimum: 1 }
                description: { type: string, maxLength: 400 }
                customPosterUrl: { type: string, format: uri, maxLength: 2048, pattern: '^https://image\.tmdb\.org/t/p/w342/.+$', nullable: true }
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserListItem" }
        "400":
          description: >
            position maior que o total de itens atuais da lista, itemId não é um UUID válido,
            description maior que 400 caracteres, ou customPosterUrl informado contra um item de
            lista aninhada.
        "403": { description: Cookie CSRF ausente ou inválido }
        "404": { description: "Lista não encontrada (ou não pertence ao usuário autenticado), ou item não encontrado" }
        "409": { description: Reordenação concorrente no mesmo item. Tente novamente. }
    delete:
      tags: [Lists]
      summary: Remover um item da lista
      description: Só o dono da lista pode remover; remove e desloca -1 as posições seguintes.
      parameters:
        - $ref: "#/components/parameters/listId"
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Removido }
        "403": { description: Cookie CSRF ausente ou inválido }
        "404": { description: "Lista não encontrada (ou não pertence ao usuário autenticado), ou item não encontrado" }

  /lists/{listId}/comments:
    get:
      tags: [Comments]
      summary: Listar comentários de uma lista
      parameters:
        - $ref: "#/components/parameters/listId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/Comment" }
        "401": { description: Não autenticado }
    post:
      tags: [Comments]
      summary: Comentar em uma lista
      parameters:
        - $ref: "#/components/parameters/listId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 280 }
                parentCommentId: { type: string, format: uuid, nullable: true }
                containsSpoiler: { type: boolean, default: false }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { description: "parentCommentId aponta para um comentário que não pertence a essa lista" }
        "401": { description: Não autenticado }
        "403": { description: "A lista é privada, ou o viewer não segue o dono com status aceito" }
        "404": { description: "Lista não encontrada, ou parentCommentId não encontrado" }

  /lists/{listId}/like:
    post:
      tags: [Likes]
      summary: Curtir uma lista
      description: >
        Qualquer lista visível, inclusive uma lista-de-listas, pode ser curtida. Segue a mesma regra de
        visibilidade de `GET /lists/{listId}` (dono, `PUBLIC`, ou `FOLLOWERS` com status aceito). A operação
        é idempotente: curtir novamente não cria outra curtida, e remover uma curtida inexistente continua
        sem erro; o `likesCount` da lista mantém o comportamento existente.
      parameters:
        - $ref: "#/components/parameters/listId"
      responses:
        "204": { description: Curtido }
        "403": { description: "A lista é privada, ou o viewer não segue o dono com status aceito" }
        "404": { description: Lista não encontrada }
    delete:
      tags: [Likes]
      summary: Remover curtida de uma lista
      parameters:
        - $ref: "#/components/parameters/listId"
      responses:
        "204": { description: Curtida removida }

  # ---------- DIARY / LOG ----------
  /users/{userId}/diary:
    get:
      tags: [Diary]
      summary: Histórico de conteúdos assistidos (diário)
      description: >
        Sem parâmetros, devolve o diário inteiro (todos os tipos), mais recente
        primeiro. `year` é um atalho pra `dateFrom=01/01`/`dateTo=31/12` do
        mesmo ano — usar `year` junto com `dateFrom`/`dateTo` é `400`.
      parameters:
        - $ref: "#/components/parameters/userId"
        - name: year
          in: query
          schema: { type: integer }
        - name: type
          in: query
          description: Filtra por tipo de conteúdo (MOVIE/SERIES/SEASON/EPISODE).
          schema: { type: string, enum: [MOVIE, SERIES, SEASON, EPISODE] }
        - name: dateFrom
          in: query
          description: Início do range de watchedDate (inclusivo). Não pode ser combinado com year.
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          description: Fim do range de watchedDate (inclusivo). Não pode ser combinado com year.
          schema: { type: string, format: date }
        - name: hasReview
          in: query
          description: "true filtra só entradas com comment preenchido (Reviews); false só as sem review (History)."
          schema: { type: boolean }
        - name: seriesTmdbId
          in: query
          description: Filters by normalized series identity; SERIES uses tmdbId and SEASON/EPISODE use seriesTmdbId.
          schema: { type: string }
        - name: score
          in: query
          description: Filters by exact score from 1 to 10; only entries with that score are returned.
          schema: { type: integer, minimum: 1, maximum: 10 }
        - $ref: "#/components/parameters/page"
        - name: size
          in: query
          description: Itens por página (máximo 1000). Assume 20 se omitido.
          schema: { type: integer, minimum: 1, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/DiaryEntry" }
        "400":
          description: >
            Número/tamanho de página inválido, year inválido, userId não é um
            UUID válido, year combinado com dateFrom/dateTo, score fora de 1 a 10,
            ou seriesTmdbId em branco.
        "403": { description: Perfil privado e quem pede não é seguidor aceito }
        "404": { description: Usuário não encontrado }

  /users/{userId}/diary/series:
    get:
      tags: [Diary]
      summary: Diary series options
      description: >
        Returns an unpaginated list of normalized series from SERIES, SEASON, and EPISODE
        diary entries. Rewatches count as additional entries and options are ordered by
        entriesCount descending, then title ascending, then seriesTmdbId ascending. Titles use the target user's preferred language; a TMDB
        not-found title is null and TMDB unavailability returns 502.
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiarySeriesOption" }
        "403": { description: Private profile and viewer is not an accepted follower }
        "404": { description: User not found }
        "502": { description: TMDB unavailable while resolving series titles }

  /users/{userId}/series-in-progress:
    get:
      tags: [Diary]
      summary: Séries que o usuário está assistindo mas ainda não terminou
      description: >
        Sem entidade própria — derivado de DiaryEntry/Content: uma série entra na lista quando
        há pelo menos uma DiaryEntry de EPISODE daquele seriesTmdbId e nenhuma DiaryEntry de
        SERIES correspondente nem DroppedEntry de SERIES. A resposta é uma página detalhada:
        content contém somente a página solicitada, enquanto aggregate e totalElements representam
        todas as séries elegíveis, inclusive as que ficaram fora da página. A ordenação é aplicada
        no banco antes da paginação; sortBy aceita LAST_WATCHED, LAST_RELEASED, REMAINING_EPISODES
        e REMAINING_RUNTIME, e direction aceita ASC ou DESC. O desempate final é seriesTmdbId ASC.
        Os snapshots compartilhados de series_progress_metadata e
        series_progress_season_metadata são usados sem chamada ao TMDB quando estão frescos no dia
        atual e com runtime verificado. Snapshot ausente ou stale é hidratado pelo TMDB; falha fria
        retorna 502, enquanto runtime desconhecido permanece null. Temporada 0/Specials, episódios
        futuros e episódios sem air_date válida não entram nos totais nem em seasonProgress.
      parameters:
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - name: sortBy
          in: query
          required: false
          description: "Critério global antes da paginação: LAST_WATCHED, LAST_RELEASED, REMAINING_EPISODES ou REMAINING_RUNTIME."
          schema: { type: string, enum: [LAST_WATCHED, LAST_RELEASED, REMAINING_EPISODES, REMAINING_RUNTIME], default: LAST_WATCHED }
        - name: direction
          in: query
          required: false
          description: "Direção do critério sortBy; aceita ASC ou DESC."
          schema: { type: string, enum: [ASC, DESC], default: DESC }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesInProgressPage" }
        "400": { description: Número/tamanho de página inválido, ou userId não é um UUID válido }
        "403": { description: Perfil privado e quem pede não é seguidor aceito }
        "404": { description: Usuário não encontrado }
        "502": { description: TMDB indisponível ao hidratar um snapshot ausente ou stale }

  /diary:
    post:
      tags: [Diary]
      summary: Registrar que assistiu a um conteúdo
      description: >
        Efeito colateral automático: se content é MOVIE, remove (se existirem) tanto a entrada desse
        filme na watchlist quanto a marcação de abandonado (DroppedEntry, type MOVIE) do usuário. Se
        content é EPISODE, SEASON ou SERIES, resolve a série (por tmdbId direto se SERIES, por
        seriesTmdbId se EPISODE/SEASON) e remove, se existirem, tanto a entrada dessa série na
        watchlist quanto a marcação de abandonada (DroppedEntry, type SERIES) do usuário — assistir
        de novo é tratado como "não abandonei mais". Em ambos os casos a remoção é best-effort/idempotente
        (não há nada para remover na maioria das chamadas) e não é desfeita se essa DiaryEntry for
        apagada depois — sair da watchlist/de dropped é definitivo, não é preciso adicionar de volta
        manualmente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiaryEntryCreation" }
      responses:
        "201":
          description: Registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiaryEntryCreationResult" }
        "400":
          description: >
            Combinação de campos de content inválida para o type informado, ou um campo
            server-derived (runtimeMinutes/genres/releaseYear/countries) informado pelo cliente (ver
            ContentRefCreation), watchedInTheater informado para content que não é MOVIE, ou
            watchedDate no futuro.
        "403": { description: Cookie CSRF ausente ou inválido }
        "404":
          description: >
            O tmdbId (MOVIE/SERIES) ou seriesTmdbId (SEASON/EPISODE) de content não corresponde
            a nenhum título real no TMDB — só verificado na primeira vez que essa referência é
            criada (ver POST /contents/reference). Pra EPISODE, também cobre o número do episódio
            específico não existir na temporada.
        "409":
          description: >
            O episódio/temporada logado tem uma flag de finale que conflita
            com outro Content já existente (ver isSeasonFinale/isSeriesFinale
            em ContentRefCreation) — só ocorre se a auto-completude de
            temporada/série disparar uma criação de Content em conflito —, ou
            esse watch já foi registrado por uma requisição concorrente idêntica.
        "429": { description: Muitas chamadas vindas desse usuário. Tente novamente após o período configurado. }
        "502":
          description: >
            TMDB indisponível ao verificar a existência do tmdbId/seriesTmdbId de content — só na
            primeira vez que essa referência é criada (ver POST /contents/reference), incluindo a
            chamada extra pra derivar runtimeMinutes de um EPISODE novo.

  /diary/bulk:
    post:
      tags: [Diary]
      summary: Registrar que assistiu a uma temporada ou série inteira
      description: >
        Mesmo efeito colateral de POST /diary sobre watchlist e dropped — como o bulk é sempre
        SEASON ou SERIES, a série correspondente é removida (se presente) da watchlist e da
        marcação de abandonada (DroppedEntry, type SERIES) do usuário. runtimeMinutes nunca é
        aceito do cliente pra nenhum dos dois tipos (ver ContentRefCreation) — pra SEASON, o
        backend deriva o runtime de cada episódio dos dados de temporada que já busca do TMDB pra
        outras validações (finaleEpisodeNumber, watchedDate vs. data de lançamento), sem nenhuma
        chamada extra; pra SERIES, deriva da mesma forma, uma temporada por vez, ao longo de todas
        as temporadas envolvidas. genres/releaseYear/countries do content são sempre derivados do
        TMDB pelo backend pra SERIES (rejeitados com 400 pra SEASON, que nunca os tem) — sempre uma
        checagem no banco antes, pra nunca chamar o TMDB mais de uma vez pela mesma série; falha ao
        buscar ou conflito com um valor já registrado são só ignorados (best-effort) quando a
        referência da série já existe, nunca derrubam o log das entradas de diário.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiaryEntryBulkCreation" }
      responses:
        "201":
          description: Registrado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiaryEntry" }
        "400":
          description: >
            Tipo de conteúdo não é SEASON ou SERIES, um campo server-derived
            (runtimeMinutes/genres/releaseYear/countries) foi informado no content (ver
            ContentRefCreation), os dados de finale são insuficientes/inválidos (incluindo um
            finaleEpisodeNumber/finaleSeasonNumber/entrada de seasonFinaleEpisodeNumbers explícito
            usado como fallback que excede a contagem real de episódios/temporadas que o TMDB
            reporta), a contagem de episódios pedida excede o teto flexível de 2000 e não pôde ser
            verificada contra o TMDB, watchedDate no futuro, ou watchedDate anterior à data de
            lançamento do último episódio efetivamente logado (checado contra o TMDB).
        "403": { description: Cookie CSRF ausente ou inválido }
        "404":
          description: >
            O seriesTmdbId de content não corresponde a nenhuma série real no TMDB — só
            verificado na primeira vez que um dado episódio daquela série é referenciado (cada
            EPISODE do bulk passa por essa checagem individualmente, mas como usa a mesma chamada
            cacheada por seriesTmdbId, só a primeira dispara uma requisição real ao TMDB).
        "409":
          description: >
            Conflito de flag de finale (mesma causa de POST /diary), ou um dos watches do lote já
            foi registrado por uma requisição concorrente idêntica.
        "429": { description: Muitas chamadas vindas desse usuário. Tente novamente após o período configurado. }
        "502":
          description: >
            TMDB indisponível após uma tentativa extra de retry — ao buscar o runtimeMinutes de uma
            das temporadas envolvidas (ambos os tipos), ao buscar a temporada pra derivar
            finaleEpisodeNumber/seasonFinaleEpisodeNumbers (o backend sempre tenta derivar do TMDB
            primeiro, mesmo com um valor explícito enviado — um valor explícito só é usado como
            fallback, e nesse caso não evita a busca à temporada), ao validar watchedDate (ambos os
            tipos), ou ao verificar a existência do seriesTmdbId pra um episódio novo (ambos os tipos,
            ver 404 acima). Exceção: a busca específica de finaleSeasonNumber (SERIES,
            getTvFullDetails) não gera 502 se o cliente enviou um finaleSeasonNumber explícito — nesse
            caso o valor explícito é aceito como fallback mesmo com essa chamada indisponível. Não
            inclui a derivação de genres/releaseYear/countries (SERIES) quando a referência da série
            já existe — essa é best-effort e nunca gera 502 nem qualquer outro erro; se a série
            ainda não tem Content local, a mesma verificação de existência do POST /contents/reference
            se aplica normalmente (404/502 podem ocorrer).

  /diary/{diaryEntryId}:
    patch:
      tags: [Diary]
      summary: Editar um registro do diário
      parameters:
        - $ref: "#/components/parameters/diaryEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiaryEntryUpdate" }
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiaryEntry" }
        "400": { description: "watchedInTheater informado para content que não é MOVIE, watchedDate no futuro, ou diaryEntryId não é um UUID válido" }
        "403": { description: Cookie CSRF ausente ou inválido }
        "404": { description: "Registro não encontrado, ou não pertence ao usuário autenticado" }
        "429": { description: Muitas chamadas vindas desse usuário. Tente novamente após o período configurado. }
    delete:
      tags: [Diary]
      summary: Remover um registro do diário
      parameters:
        - $ref: "#/components/parameters/diaryEntryId"
        - name: overrideProtectedEntries
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            Se `true`, remove também entradas com `autoGenerated = false` na cascata de deletes
            (entradas criadas ou editadas manualmente). Por padrão (`false`), apenas entradas
            com `autoGenerated = true` são removidas. Recomenda-se chamar `GET /diary/{diaryEntryId}/deletion-impact`
            primeiro para pré-visualizar o impacto.
      responses:
        "204": { description: Removido }
        "400": { description: diaryEntryId não é um UUID válido }
        "403": { description: Cookie CSRF ausente ou inválido }
        "404": { description: "Registro não encontrado, ou não pertence ao usuário autenticado" }
        "429": { description: Muitas chamadas vindas desse usuário. Tente novamente após o período configurado. }

  /diary/series/{seriesTmdbId}:
    delete:
      tags: [Diary]
      summary: Apagar todo o histórico de diário de uma série
      description: >
        Diferente de DELETE /diary/{diaryEntryId}, que só apaga a passada (watchNumber) da entrada
        alvo, este endpoint remove TODAS as DiaryEntry (EPISODE, SEASON e SERIES) do usuário
        autenticado para essa série, de qualquer watchNumber (todas as passadas/rewatches de uma
        vez). Não passa pela proteção de autoGenerated — como é um pedido direto e explícito de
        apagar tudo, não um efeito colateral de cascata, entradas manuais/editadas também são
        removidas, sem parâmetro de override. Idempotente: se não houver nenhuma entrada para essa
        série, devolve 204 do mesmo jeito.
      parameters:
        - name: seriesTmdbId
          in: path
          required: true
          description: tmdbId nativo do TMDB da série (não é um ID interno do Watchwise).
          schema: { type: string }
      responses:
        "204": { description: Removido (ou nada havia para remover) }
        "401": { description: Não autenticado }
        "403": { description: Cookie CSRF ausente ou inválido }
        "429": { description: Muitas chamadas vindas desse usuário. Tente novamente após o período configurado. }

  /diary/{diaryEntryId}/like:
    post:
      tags: [Likes]
      summary: Curtir um registro do diário
      parameters:
        - $ref: "#/components/parameters/diaryEntryId"
      responses:
        "204": { description: Curtido }
        "401": { description: Não autenticado }
        "403": { description: "O registro do diário é privado e o viewer não segue o dono com status aceito" }
        "404": { description: Registro do diário não encontrado }
    delete:
      tags: [Likes]
      summary: Remover curtida de um registro do diário
      parameters:
        - $ref: "#/components/parameters/diaryEntryId"
      responses:
        "204": { description: Curtida removida }
        "401": { description: Não autenticado }

  /diary/{diaryEntryId}/deletion-impact:
    get:
      tags: [Diary]
      summary: Pré-visualizar o impacto da exclusão de um registro do diário
      parameters:
        - $ref: "#/components/parameters/diaryEntryId"
        - name: overrideProtectedEntries
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            Mesmo parâmetro de `DELETE /diary/{diaryEntryId}`, e com o mesmo default (`false`) — a
            pré-visualização executa a mesma cascata de delete com o valor informado, então o
            resultado só corresponde ao delete real quando os dois são chamados com o mesmo valor.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionImpact" }
        "400": { description: diaryEntryId não é um UUID válido }
        "404": { description: "Registro não encontrado, ou não pertence ao usuário autenticado" }

  /diary/{diaryEntryId}/comments:
    get:
      tags: [Comments]
      summary: Listar comentários de um registro do diário
      parameters:
        - $ref: "#/components/parameters/diaryEntryId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/Comment" }
        "401": { description: Não autenticado }
    post:
      tags: [Comments]
      summary: Comentar em um registro do diário
      parameters:
        - $ref: "#/components/parameters/diaryEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 280 }
                parentCommentId: { type: string, format: uuid, nullable: true }
                containsSpoiler: { type: boolean, default: false }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { description: "parentCommentId aponta para um comentário que não pertence a esse registro do diário" }
        "401": { description: Não autenticado }
        "403": { description: "O registro do diário é privado e o viewer não segue o dono com status aceito" }
        "404": { description: "Registro do diário não encontrado, ou parentCommentId não encontrado" }

  # ---------- NOTIFICATIONS ----------
  /notifications:
    get:
      tags: [Notifications]
      summary: Listar notificações do usuário autenticado
      parameters:
        - name: isRead
          in: query
          schema: { type: boolean }
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/Notification" }

  /notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Marcar notificação como lida
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Atualizada }

  # ---------- SEARCH ----------
  /search:
    get:
      tags: [Search]
      summary: >
        Busca geral. Filmes, séries e pessoas são buscados ao vivo na
        API do TMDB (proxied); listas, usuários e templates de Picks são
        buscados no banco local por nome.
      description: >
        Exige autenticação, como qualquer outra rota fora da discover (ver Access policy no CLAUDE.md).
        Quando `type=PICKS_TEMPLATE`, retorna somente templates de Picks encontrados localmente por nome;
        essa busca não consulta o TMDB nem retorna Picks preenchidos. Com `type` omitido, o agregado padrão
        permanece sem templates.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 100 }
        - name: type
          in: query
          schema:
            type: string
            enum: [MOVIE, SERIES, PERSON, LIST, USER, PICKS_TEMPLATE]
        - name: page
          in: query
          description: Página 1-based. Assume 1 se omitida. Para buscas externas (type omitido, MOVIE, SERIES ou PERSON), o máximo é 500; buscas locais (LIST, USER e PICKS_TEMPLATE) não têm esse limite do TMDB.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          description: Mantido por compatibilidade. `contents`, `people`, `users` e `templates` preservam o tamanho geral da busca; `lists` usa página fixa de 10 itens e ignora `size`, podendo retornar menos na última página ou quando não há 10 resultados.
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400": { description: "q ausente/com menos de 3 caracteres, type inválido, página/tamanho inválido, ou página externa acima de 500" }
        "401": { description: Não autenticado }
        "429":
          description: Muitas requisições de busca vindas desse usuário. Tente novamente após o período configurado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "502": { description: TMDB indisponível durante uma busca externa }

  # ---------- TRENDING ----------
  /trending:
    get:
      tags: [Trending]
      summary: Listar filmes e series em alta no TMDB
      description: >
        Retorna as secoes de filmes e series em alta, usando o idioma preferido
        do usuario autenticado. A ordem de cada secao e a ordem recebida do TMDB;
        cada lista pode conter menos itens que `size` quando a resposta externa
        tiver menos resultados. O poster usa URL completa no tamanho w500.
      parameters:
        - name: timeWindow
          in: query
          required: true
          schema: { type: string, enum: [day, week] }
        - name: size
          in: query
          required: false
          schema: { type: integer, enum: [12, 21], default: 12 }
      responses:
        "200":
          description: Filmes e series em alta, separados por secao.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrendingResponse" }
        "400":
          description: timeWindow ausente ou invalido, ou size fora de 12 e 21.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Nao autenticado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429":
          description: Mais de 30 requisicoes do usuario em cinco minutos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "502":
          description: TMDB indisponivel ao carregar qualquer uma das secoes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  # ---------- GAMES ----------
  /games/today:
    get:
      tags: [Games]
      summary: Consultar os jogos do dia
      description: >
        Retorna as oito modalidades globais do dia GMT. A autenticação usa o cookie JWT
        `access_token`; esta leitura não exige CSRF. Enquanto uma modalidade estiver aberta,
        a resposta futura e as pistas ainda não liberadas são redigidas. Se o conjunto diário
        não estiver completo, a API retorna 503.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Estado dos oito jogos do dia.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyGameTodayResponseDTO" }
        "401":
          description: Autenticação ausente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Os desafios do dia ainda não estão disponíveis; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /games/{challengeDate}:
    get:
      tags: [Games]
      summary: Consultar os jogos de uma data passada
      description: >
        Retorna as oito modalidades da data GMT informada. Hoje e datas passadas podem ser consultados;
        datas futuras são rejeitadas. Um usuário sem resultado pode iniciar os jogos por meio da rota de
        tentativa da mesma data; resultados em andamento podem ser retomados.
      security:
        - cookieAuth: []
      parameters:
        - name: challengeDate
          in: path
          required: true
          description: Data GMT do conjunto diário.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Estado dos oito jogos da data informada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyGameTodayResponseDTO" }
        "400":
          description: Data futura ou inválida; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Autenticação ausente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Os desafios da data ainda não estão disponíveis; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /games/{gameType}/today:
    get:
      tags: [Games]
      summary: Consultar uma modalidade do dia
      description: >
        Retorna o estado individual da modalidade para a data GMT atual. A resposta inclui os detalhes
        das tentativas do dia quando existirem; enquanto o jogo estiver aberto, a resposta futura e as
        pistas ainda não liberadas permanecem redigidas. `majorRoles` controla a projeção da filmografia
        de modalidades de séries e assume true.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/dailyGameType"
        - $ref: "#/components/parameters/dailyGameMajorRoles"
      responses:
        "200":
          description: Estado da modalidade do dia.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyGameStateDTO" }
        "400":
          description: gameType inválido; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Autenticação ausente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Desafio da modalidade não disponível; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /games/{challengeDate}/{gameType}:
    get:
      tags: [Games]
      summary: Consultar uma modalidade de uma data
      description: >
        Retorna o estado individual da modalidade na data GMT informada. Datas futuras são rejeitadas;
        datas passadas podem ser iniciadas ou retomadas pelas rotas de tentativa. A resposta de uma data
        passada não inclui detalhes transitórios de tentativas. `majorRoles` assume true e controla a
        projeção da filmografia de modalidades de séries.
      security:
        - cookieAuth: []
      parameters:
        - name: challengeDate
          in: path
          required: true
          description: Data GMT do conjunto diário.
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/dailyGameType"
        - $ref: "#/components/parameters/dailyGameMajorRoles"
      responses:
        "200":
          description: Estado da modalidade na data informada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyGameStateDTO" }
        "400":
          description: Data futura, data inválida ou gameType inválido; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Autenticação ausente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Desafio da data/modalidade não disponível; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /games/{gameType}/search:
    get:
      tags: [Games]
      summary: Buscar candidatos para um jogo diário
      description: >
        Busca candidatos TMDB para filmes, séries ou pessoas conforme `gameType`. O texto `q`
        serve somente para encontrar candidatos; a tentativa posterior envia IDs, nunca o título
         digitado. `EPISODE_BY_FRAME` não aceita esta rota genérica: a seleção usa as três leituras
         hierárquicas específicas — busca de séries, temporadas da série e episódios da temporada.
         A autenticação usa o cookie JWT e a busca não exige CSRF.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/dailyGameType"
        - name: q
          in: query
          required: true
          description: Texto de busca, após trim, com no máximo 100 caracteres.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: "#/components/parameters/dailyGamePage"
        - $ref: "#/components/parameters/dailyGameSize"
      responses:
        "200":
          description: Candidatos paginados em um envelope PageResponseDTO.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyGameSearchPage" }
        "400":
          description: gameType, q, paginação inválidos ou uso da rota genérica para EPISODE_BY_FRAME; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Autenticação ausente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429":
          description: Limite de 30 buscas por usuário em 5 minutos excedido; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "502":
          description: TMDB indisponível após retry; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /games/EPISODE_BY_FRAME/search/series:
    get:
      tags: [Games]
      summary: Buscar séries para o jogo de episódio por frame
      description: Busca a série que será usada para localizar episódios por identidade composta. A autenticação usa o cookie JWT; esta leitura não exige CSRF.
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Texto de busca, após trim, com no máximo 100 caracteres.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: "#/components/parameters/dailyGamePage"
        - $ref: "#/components/parameters/dailyGameSize"
      responses:
        "200":
          description: Séries candidatas paginadas em um envelope PageResponseDTO.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyGameSearchPage" }
        "400":
          description: q ou paginação inválidos; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Autenticação ausente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429":
          description: Limite de buscas excedido; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "502":
          description: TMDB indisponível após retry; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /games/EPISODE_BY_FRAME/series/{seriesTmdbId}/seasons:
    get:
      tags: [Games]
      summary: Listar temporadas de uma série
      description: >
        Lista as temporadas regulares da série escolhida para a seleção hierárquica de episódios.
        Temporada 0 e outras temporadas com número não positivo são omitidas. Uma série válida sem
        temporadas regulares retorna uma lista vazia; uma série inexistente retorna 404. A autenticação
        usa o cookie JWT; esta leitura não exige CSRF e a resposta não contém imagens.
      security:
        - cookieAuth: []
      parameters:
        - name: seriesTmdbId
          in: path
          required: true
          description: ID TMDB positivo da série.
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
      responses:
        "200":
          description: Lista de opções de temporada sem imagens.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DailyGameSeasonOptionDTO" }
        "400":
          description: seriesTmdbId inválido; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Série inexistente no TMDB; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Autenticação ausente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429":
          description: Limite de buscas excedido; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "502":
          description: TMDB indisponível após retry; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /games/EPISODE_BY_FRAME/series/{seriesTmdbId}/seasons/{seasonNumber}/episodes:
    get:
      tags: [Games]
      summary: Listar episódios de uma temporada
      description: >
        Lista episódios de uma temporada regular já lançados até o dia GMT atual. A seleção é hierárquica:
        primeiro a série, depois suas temporadas e então os episódios. Uma temporada válida sem episódios
        lançados retorna uma lista vazia; uma temporada inexistente retorna 404. A identidade retornada é
        composta por `seriesTmdbId`, `seasonNumber` e `episodeNumber`; a autenticação usa o cookie JWT e
        esta leitura não exige CSRF. A resposta não contém imagens.
      security:
        - cookieAuth: []
      parameters:
        - name: seriesTmdbId
          in: path
          required: true
          description: ID TMDB positivo da série.
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
        - name: seasonNumber
          in: path
          required: true
          description: Número positivo da temporada regular escolhida.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Lista de opções de episódio sem imagens.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DailyGameEpisodeOptionDTO" }
        "400":
          description: seriesTmdbId ou seasonNumber inválidos; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Série ou temporada inexistente no TMDB; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Autenticação ausente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429":
          description: Limite de buscas excedido; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "502":
          description: TMDB indisponível após retry; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /games/{gameType}/attempt:
    post:
      tags: [Games]
      summary: Enviar uma tentativa de jogo diário
      description: >
        Valida a identidade TMDB enviada e registra uma tentativa para o desafio GMT atual. O cookie
        JWT e o cookie/header CSRF são obrigatórios. O corpo usa IDs: `tmdbId` para MOVIE/SERIES,
        `personTmdbId` para PERSON e a chave composta série/temporada/episódio para EPISODE. Enquanto
        o resultado estiver aberto, a resposta, as pistas futuras e os títulos de filmografia ainda não
        revelados permanecem redigidos. `majorRoles` assume true e controla a projeção da filmografia
        de modalidades de séries.
        shareOnCompletion é opcional: quando omitido, preserva a preferência persistida; quando
        habilitado, o resultado terminal é publicado uma única vez no feed, seja COMPLETED ou FAILED.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/dailyGameType"
        - $ref: "#/components/parameters/dailyGameMajorRoles"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyGameAttemptRequest" }
      responses:
        "200":
          description: Estado atualizado do jogo, com resposta somente quando o estado é terminal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyGameAttemptResponseDTO" }
        "400":
          description: Corpo inválido, campos incompatíveis, ID inválido ou alvo inexistente no TMDB; retorna ApiError ou ValidationApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Autenticação ausente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: Cookie/header CSRF ausente ou inválido; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: O jogo já está concluído ou falhou; não aceita outra tentativa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429":
          description: Limite de 20 tentativas por usuário em 5 minutos excedido; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "502":
          description: TMDB indisponível após retry; a tentativa não é consumida; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Desafio da modalidade não disponível para o dia GMT; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /games/{challengeDate}/{gameType}/attempt:
    post:
      tags: [Games]
      summary: Enviar uma tentativa para um jogo diário histórico
      description: >
        Registra uma tentativa para a data GMT informada. O usuário pode iniciar um jogo sem resultado,
        retomar um resultado IN_PROGRESS e não pode repetir um resultado COMPLETED ou FAILED. A data
        não pode estar no futuro. O cookie JWT e o cookie/header CSRF são obrigatórios. `majorRoles`
        assume true e controla a projeção da filmografia de modalidades de séries.
      security:
        - cookieAuth: []
      parameters:
        - name: challengeDate
          in: path
          required: true
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/dailyGameType"
        - $ref: "#/components/parameters/dailyGameMajorRoles"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyGameAttemptRequest" }
      responses:
        "200":
          description: Estado atualizado do jogo histórico.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyGameAttemptResponseDTO" }
        "400":
          description: Corpo inválido, data futura, campos incompatíveis ou candidato inexistente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Autenticação ausente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: Cookie/header CSRF ausente ou inválido; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: O jogo já foi concluído ou falhou; não aceita replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429":
          description: Limite de 20 tentativas por usuário em 5 minutos excedido; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "502":
          description: TMDB indisponível após retry; a tentativa não é consumida; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Desafio da data/modalidade não disponível; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /games/{gameType}/give-up:
    post:
      tags: [Games]
      summary: Desistir de uma modalidade do dia
      description: >
        Encerra a modalidade atual com status FAILED, score zero e sem consumir tentativa. O resultado
        terminal revela a resposta congelada; se já existir um resultado terminal, a operação é rejeitada.
        Se a preferência shareOnCompletion persistida estiver ligada, o resultado é publicado no feed uma
        única vez; caso contrário nada é publicado, e a preferência nunca é alterada por esta rota.
        O cookie JWT e o cookie/header CSRF são obrigatórios.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/dailyGameType"
      responses:
        "200":
          description: Resultado terminal FAILED com a resposta congelada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyGameAttemptResponseDTO" }
        "401":
          description: Autenticação ausente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: Cookie/header CSRF ausente ou inválido; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: A modalidade já foi concluída ou falhou; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429":
          description: Limite de 20 tentativas por usuário em 5 minutos excedido; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Desafio da modalidade não disponível; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /games/{challengeDate}/{gameType}/give-up:
    post:
      tags: [Games]
      summary: Desistir de uma modalidade histórica
      description: >
        Encerra a modalidade da data GMT informada com status FAILED, score zero e sem consumir tentativa.
        Datas futuras são rejeitadas. O resultado terminal revela a resposta congelada; o cookie JWT e o
        cookie/header CSRF são obrigatórios. Publica o resultado no feed apenas se a preferência
        shareOnCompletion persistida estiver ligada.
      security:
        - cookieAuth: []
      parameters:
        - name: challengeDate
          in: path
          required: true
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/dailyGameType"
      responses:
        "200":
          description: Resultado terminal FAILED com a resposta congelada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyGameAttemptResponseDTO" }
        "400":
          description: Data futura, data inválida ou gameType inválido; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Autenticação ausente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: Cookie/header CSRF ausente ou inválido; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: A modalidade já foi concluída ou falhou; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429":
          description: Limite de 20 tentativas por usuário em 5 minutos excedido; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Desafio da data/modalidade não disponível; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /games/history:
    get:
      tags: [Games]
      summary: Consultar histórico de jogos
      description: >
        Lista somente desafios anteriores ao dia GMT atual. A resposta congelada só é revelada para
        resultados `COMPLETED` ou `FAILED`; estados `NOT_PLAYED` e `IN_PROGRESS` permanecem redigidos.
        Cada data pode ser aberta em `/games/{challengeDate}` para iniciar ou retomar seus jogos. A autenticação usa o cookie JWT;
        esta leitura não exige CSRF.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/dailyGamePage"
        - $ref: "#/components/parameters/dailyGameSize"
      responses:
        "200":
          description: Histórico paginado em um envelope PageResponseDTO.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyGameHistoryPage" }
        "400":
          description: Paginação inválida; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Autenticação ausente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /games/{gameType}/history:
    get:
      tags: [Games]
      summary: Consultar histórico por modalidade
      description: Lista o histórico anterior ao dia GMT atual para uma modalidade. A resposta inclui respostas passadas, inclusive para `NOT_PLAYED`; a autenticação usa o cookie JWT e não exige CSRF.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/dailyGameType"
        - $ref: "#/components/parameters/dailyGamePage"
        - $ref: "#/components/parameters/dailyGameSize"
      responses:
        "200":
          description: Histórico paginado em um envelope PageResponseDTO.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyGameHistoryPage" }
        "400":
          description: gameType ou paginação inválidos; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Autenticação ausente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /games/rankings/general:
    get:
      tags: [Games]
      summary: Consultar ranking geral
      description: >
        Retorna os agregados acumulados de todas as modalidades. O desempate é por score acumulado
        decrescente e tentativas acumuladas crescentes; não há reset ou janela móvel. A autenticação usa
        o cookie JWT e esta leitura não exige CSRF.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/dailyGamePage"
        - $ref: "#/components/parameters/dailyGameSize"
      responses:
        "200":
          description: Ranking paginado em um envelope PageResponseDTO.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyGameRankingPage" }
        "400":
          description: Paginação inválida; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Autenticação ausente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /games/{gameType}/ranking:
    get:
      tags: [Games]
      summary: Consultar ranking por modalidade
      description: Retorna agregados acumulados de uma modalidade, ordenados por score decrescente e tentativas crescentes; a autenticação usa o cookie JWT e não exige CSRF.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/dailyGameType"
        - $ref: "#/components/parameters/dailyGamePage"
        - $ref: "#/components/parameters/dailyGameSize"
      responses:
        "200":
          description: Ranking paginado em um envelope PageResponseDTO.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyGameRankingPage" }
        "400":
          description: gameType ou paginação inválidos; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Autenticação ausente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  # ---------- FEED ----------
  /feed:
    get:
      tags: [Feed]
      summary: Feed de atividades de quem o usuário segue
      description: >
        Timeline com os eventos recentes de quem o usuário autenticado segue
        (Follower status ACCEPTED): registrou um DiaryEntry (assistiu um
        filme/episódio, completou uma temporada/série), abandonou um
        filme/série (DroppedEntry), atualizou o Top 5 de um tipo
        (Top5Entry), criou um Pick ou criou um Picks Template. Nenhuma
        entidade nova: os cinco tipos de evento são agregados em
        tempo de leitura (pull), não persistidos num "post" próprio. Ver
        business-rules.md § Feed para a decisão de arquitetura (pull vs
        push) e a paginação por cursor em vez de página numerada. Curtidas/
        comentarios existem para DIARY_ENTRY, DROPPED, PICK_CREATED e PICKS_TEMPLATE_CREATED
        (DIARY_ENTRY reaproveitando POST /diary/{id}/like e GET/POST
        /diary/{id}/comments via FeedItem.id). Para PICK_CREATED e
        PICKS_TEMPLATE_CREATED, o id aponta para o Pick ou Template e o
        cliente usa os endpoints sociais correspondentes. DROPPED usa os endpoints sociais de dropped entries; TOP5_UPDATE nao tem alvo de curtida/comentario. DiaryEntry com ignore =
        true (episódio/temporada auto-logado como degrau mecânico de um
        POST /diary/bulk de nível superior — ver DiaryEntry.ignore) nunca
        aparece aqui, evitando spam de um bulk log inteiro.
        Social previews: DIARY_ENTRY and DROPPED items expose commentsCount and up to
        three recentComments of their own target (Comment format, newest first);
        PICK_CREATED and PICKS_TEMPLATE_CREATED carry the same data inside
        pick.recentComments and picksTemplate.recentComments. Top 5 and daily-game
        events are not comment targets.
      parameters:
        - name: cursor
          in: query
          description: >
            Cursor opaco (base64) da última página lida, devolvido como
            nextCursor na resposta anterior. Omitido na primeira chamada.
          schema: { type: string }
        - name: size
          in: query
          description: Itens por página (máximo 50). Assume 20 se omitido.
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPageMeta"
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: "#/components/schemas/FeedItem" }
        "400": { description: "size <= 0, ou cursor malformado" }
        "401": { description: Não autenticado }

  /dropped/{droppedEntryId}/like:
    post:
      tags: [Likes]
      summary: Curtir uma entrada de conteúdo abandonado
      parameters:
        - name: droppedEntryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Curtido }
        "401": { description: Não autenticado }
        "403": { description: A entrada pertence a um perfil privado que o viewer não pode ver }
        "404": { description: Entrada de dropped não encontrada }
    delete:
      tags: [Likes]
      summary: Remover curtida de uma entrada de conteúdo abandonado
      parameters:
        - name: droppedEntryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Curtida removida }
        "401": { description: Não autenticado }

  /dropped/{droppedEntryId}/comments:
    get:
      tags: [Comments]
      summary: Listar comentários de uma entrada de conteúdo abandonado
      parameters:
        - name: droppedEntryId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
      responses:
        "200": { description: Página de comentários, content: { application/json: { schema: { $ref: "#/components/schemas/CommentPage" } } } }
        "401": { description: Não autenticado }
        "403": { description: A entrada pertence a um perfil privado que o viewer não pode ver }
        "404": { description: Entrada de dropped não encontrada }
    post:
      tags: [Comments]
      summary: Comentar em uma entrada de conteúdo abandonado
      parameters:
        - name: droppedEntryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentCreation" }
      responses:
        "201": { description: Comentário criado, content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } }
        "400": { description: parentCommentId aponta para outro alvo }
        "401": { description: Não autenticado }
        "403": { description: A entrada pertence a um perfil privado que o viewer não pode ver }
        "404": { description: Entrada de dropped ou comentário-pai não encontrado }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: >
        Token de acesso JWT entregue como cookie HttpOnly (access_token)
        no registro/login. Endpoints que alteram estado fora de /auth/**
        também exigem o cookie CSRF (XSRF-TOKEN) ecoado no header
        X-XSRF-TOKEN.

  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    contentId:
      name: contentId
      in: path
      required: true
      description: ID local da referência de conteúdo (ver /contents/reference)
      schema: { type: string, format: uuid }
    commentId:
      name: commentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    listId:
      name: listId
      in: path
      required: true
      schema: { type: string, format: uuid }
    diaryEntryId:
      name: diaryEntryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    top5Type:
      name: type
      in: path
      required: true
      description: Só MOVIE ou SERIES são válidos para Top 5.
      schema: { type: string, enum: [MOVIE, SERIES] }
    watchlistType:
      name: type
      in: path
      required: true
      description: Só MOVIE ou SERIES são válidos para a watchlist.
      schema: { type: string, enum: [MOVIE, SERIES] }
    watchlistTypeQuery:
      name: type
      in: query
      required: false
      description: Filtro opcional; só MOVIE ou SERIES são válidos para a watchlist.
      schema: { type: string, enum: [MOVIE, SERIES] }
    droppedType:
      name: type
      in: path
      required: true
      description: Só MOVIE ou SERIES são válidos para marcar como abandonado.
      schema: { type: string, enum: [MOVIE, SERIES] }
    personTmdbId:
      name: personTmdbId
      in: path
      required: true
      description: ID nativo do TMDB (não é um ID interno do Watchwise). Só dígitos, até 20 caracteres.
      schema: { type: string, pattern: "^\\d{1,20}$" }
    requesterId:
      name: requesterId
      in: path
      required: true
      description: ID do usuário que enviou a solicitação de seguir.
      schema: { type: string, format: uuid }
    page:
      name: page
      in: query
      description: Página 1-based. Assume 1 se omitida; 0 também é aceito como alias da primeira página.
      schema: { type: integer, minimum: 0, default: 1 }
    size:
      name: size
      in: query
      description: Itens por página (máximo 1000). Assume 20 se omitido.
      schema: { type: integer, minimum: 1, default: 20 }

    dailyGameType:
      name: gameType
      in: path
      required: true
      description: Modalidade do jogo diário.
      schema:
        $ref: "#/components/schemas/DailyGameType"
    dailyGamePage:
      name: page
      in: query
      description: Página 1-based; 0 também é aceito como alias da primeira página. Assume 1 se omitida.
      schema: { type: integer, minimum: 0, default: 1 }
    dailyGameSize:
      name: size
      in: query
      description: Itens por página; assume 20 se omitido e limita o tamanho efetivo a 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    dailyGameMajorRoles:
      name: majorRoles
      in: query
      required: false
      description: Em modalidades de filmografia de séries, filtra a projeção para papéis principais; padrão true. Em outras modalidades, não altera o resultado.
      schema: { type: boolean, default: true }

  schemas:
    ApiError:
      type: object
      description: Corpo padronizado retornado por erros da API.
      required: [timestamp, status, error, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }

    PageMeta:
      type: object
      description: >
        Pagination metadata shared by every paginated list endpoint's response envelope.
        page is 1-based, matching the page query parameter — not Spring's internal 0-based
        page index.
      properties:
        page: { type: integer, minimum: 1 }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        hasNext: { type: boolean }

    CursorPageMeta:
      type: object
      description: >
        Pagination envelope for cursor-paginated endpoints (currently just
        GET /feed). Deliberately not PageMeta: unlike offset pagination, a
        feed receives constant inserts, so an offset/page number would skip
        or duplicate items as new events land while the client scrolls (see
        business-rules.md § Feed). No totalElements/totalPages — a COUNT
        over the merged three-source query isn't worth paying for a number
        nobody needs to jump to a specific page of a feed.
      properties:
        size: { type: integer }
        nextCursor: { type: string, nullable: true, description: "Null when hasNext is false." }
        hasNext: { type: boolean }

    UserResponseDTO:
      description: Perfil completo, retornado apenas para o próprio usuário autenticado.
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            email: { type: string, format: email }
            description: { type: string, nullable: true }
            profilePicture: { type: string, format: uri }
            banner: { type: string, format: uri, nullable: true }
            isProfilePublic: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            preferredLanguage:
              type: string
              example: "en-US"
              description: >
                Idioma preferido pro proxy de detalhe do TMDB (GET
                /contents/{contentId}/details) — formato TMDB
                (ISO-639-1_ISO-3166-1). Default "en-US" pra conta nova.
            preferredRegion:
              type: string
              example: "US"
              description: >
                Região preferida (ISO 3166-1 alpha-2) usada só pra escolher
                a linha de watchProviders dentro da resposta já cacheada do
                TMDB — nunca é enviada como parâmetro pro TMDB. Default "US"
                pra conta nova.
        - $ref: "#/components/schemas/WatchTimeStats"
        - $ref: "#/components/schemas/FollowCounts"

    PublicUserDTO:
      type: object
      description: >
        Perfil público compacto de outro usuário — não inclui email nem
        estatísticas de tempo assistido. Usado sempre que um usuário é
        exibido dentro de uma lista paginada (seguidores, seguindo,
        solicitações pendentes, resultado de busca) — nunca combinado com
        WatchTimeStats para não gerar uma consulta de agregação por item
        da página (ver PublicUserProfileDTO para o perfil de um único
        usuário).
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        description: { type: string, nullable: true }
        profilePicture: { type: string, format: uri }
        isProfilePublic: { type: boolean }
        createdAt: { type: string, format: date-time }

    WatchTimeStats:
      type: object
      description: >
        Combinado via allOf em UserResponseDTO e PublicUserProfileDTO —
        nunca usado como schema autônomo. Calculado somando runtimeMinutes
        só de DiaryEntry do tipo MOVIE/EPISODE (ver ContentRefCreation) —
        entradas SEASON/SERIES são marcadores sintéticos de conclusão e
        não têm runtime próprio, então ficam de fora pra não contar tempo
        em dobro. Content sem runtimeMinutes/genres contribui 0 —
        undercount aceito, já que o backend nunca busca esse dado do TMDB
        sozinho.
      properties:
        totalMinutesWatchedMovies: { type: integer, description: "Soma acumulada (all-time) de runtimeMinutes de DiaryEntry MOVIE." }
        totalMinutesWatchedEpisodes: { type: integer, description: "Soma acumulada (all-time) de runtimeMinutes de DiaryEntry EPISODE." }
        minutesWatchedMoviesLast30Days: { type: integer, description: "Soma de runtimeMinutes de DiaryEntry MOVIE com watchedDate nos últimos 30 dias." }
        minutesWatchedEpisodesLast30Days: { type: integer, description: "Soma de runtimeMinutes de DiaryEntry EPISODE com watchedDate nos últimos 30 dias." }
        totalTheaterVisits: { type: integer, description: "COUNT de DiaryEntry (sempre MOVIE — ver DiaryEntry.watchedInTheater) com watchedInTheater=true, all-time." }
        genreCountsMovies:
          type: array
          description: >
            Quantidade de DiaryEntry de MOVIE por gênero (all-time, sem
            recorte de tempo), ordenado do maior pro menor. Cada rewatch
            soma de novo. Mesma semântica de AllTimeStats.genreCountsMovies.
          items:
            type: object
            properties:
              genre: { type: string }
              count: { type: integer }
        genreCountsSeries:
          type: array
          description: >
            Quantidade de SERIES distintas iniciadas por gênero (all-time,
            sem recorte de tempo, não precisa ter sido concluída),
            ordenado do maior pro menor. Um rewatch de uma série já
            iniciada não soma de novo. Gênero de um episódio é resolvido a
            partir do Content SERIES com o mesmo seriesTmdbId (episódio
            não carrega genres próprio). Mesma semântica de
            AllTimeStats.genreCountsSeries.
          items:
            type: object
            properties:
              genre: { type: string }
              count: { type: integer }

    PublicUserProfileDTO:
      description: >
        Perfil público completo de outro usuário, usado só em GET
        /users/{userId} (não em listas paginadas — ver PublicUserDTO).
      allOf:
        - $ref: "#/components/schemas/PublicUserDTO"
        - type: object
          properties:
            banner: { type: string, format: uri, nullable: true }
        - $ref: "#/components/schemas/WatchTimeStats"
        - $ref: "#/components/schemas/FollowCounts"

    FollowCounts:
      type: object
      description: >
        Combinado via allOf em UserResponseDTO e PublicUserProfileDTO —
        nunca usado como schema autônomo. Calculado a cada request
        (COUNT sobre Follower com status ACCEPTED), não desnormalizado.
      properties:
        followersCount: { type: integer, description: "Quantidade de Follower aceitos com followed = este usuário." }
        followingCount: { type: integer, description: "Quantidade de Follower aceitos com follower = este usuário." }

    PatchUserDTO:
      type: object
      properties:
        username: { type: string, minLength: 3, maxLength: 60 }
        email: { type: string, format: email, minLength: 11, maxLength: 60 }
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 255
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).+$'
          description: Deve conter ao menos uma letra maiúscula, uma minúscula e um dígito.
        description: { type: string, maxLength: 280 }
        profilePicture: { type: string, format: uri, maxLength: 2048 }
        banner: { type: string, format: uri, maxLength: 2048, nullable: true }
        isProfilePublic: { type: boolean }
        currentPassword:
          type: string
          format: password
          description: >
            Obrigatório apenas quando `password` ou `email` forem enviados
            com um valor diferente do atual — confirma a identidade do
            usuário antes de trocar um campo de autenticação.
        preferredLanguage:
          type: string
          pattern: "^[a-z]{2}-[A-Z]{2}$"
          example: "pt-BR"
          description: >
            Formato TMDB (ISO-639-1_ISO-3166-1), ex. en-US, pt-BR. Validado em duas camadas: o
            formato aqui, e cada metade contra os códigos ISO-639-1/ISO-3166-1 reais conhecidos
            pela JVM (`java.util.Locale`) — um valor com o formato certo mas inexistente (ex.
            "zz-ZZ") é rejeitado com 400, não aceito silenciosamente.
        preferredRegion:
          type: string
          pattern: "^[A-Z]{2}$"
          example: "BR"
          description: >
            ISO 3166-1 alpha-2. Mesma validação em duas camadas de preferredLanguage — um código
            com o formato certo mas inexistente é rejeitado com 400.

    UserPreviewDTO:
      type: object
      description: >
        Versão resumida do usuário para resultados de busca. Não inclui
        email, descrição nem outros dados restritos, por isso pode ser
        retornada mesmo para perfis privados.
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        profilePicture: { type: string, format: uri }
        isProfilePublic: { type: boolean }

    ContentRefCreation:
      type: object
      required: [type]
      description: >
        Identifica um conteúdo do TMDB. Para MOVIE e SERIES, o tmdbId
        (ID nativo do próprio filme/série) é obrigatório e basta
        sozinho para buscar detalhes no TMDB (`/movie/{tmdbId}`,
        `/tv/{tmdbId}`). SEASON e EPISODE não têm endpoint de busca
        direta por ID no TMDB — exigem a chave composta série +
        temporada (+ episódio) — por isso não usam tmdbId (o ID
        próprio de uma temporada/episódio no TMDB não serve pra buscar
        nada) e em vez disso exigem seriesTmdbId e seasonNumber
        (episodeNumber também, só em EPISODE):
        `/tv/{seriesTmdbId}/season/{seasonNumber}` e
        `/tv/{seriesTmdbId}/season/{seasonNumber}/episode/{episodeNumber}`.
      properties:
        tmdbId:
          type: string
          minLength: 1
          description: Obrigatório quando type é MOVIE ou SERIES; ausente em SEASON/EPISODE.
        type: { type: string, enum: [MOVIE, SERIES, SEASON, EPISODE] }
        seriesTmdbId:
          type: string
          minLength: 1
          description: Obrigatório quando type é SEASON ou EPISODE; ausente em MOVIE/SERIES.
        seasonNumber:
          type: integer
          minimum: 0
          description: >
            Obrigatório quando type é SEASON ou EPISODE; ausente em MOVIE/SERIES.
            Aceita 0 (temporada "Specials" do TMDB); negativo é rejeitado com 400.
        episodeNumber:
          type: integer
          minimum: 1
          description: Obrigatório quando type é EPISODE; ausente nos demais. Valores menores que 1 são rejeitados com 400.
        isSeasonFinale:
          type: boolean
          nullable: true
          description: >
            Only accepted when type is EPISODE. True if this is the last episode of its season.
            On POST /diary and POST /diary/bulk, this value is only a fallback used when TMDB
            has no aired-episode data for the season yet — whenever TMDB does have that data,
            the server derives this itself and overrides whatever is sent here. POST
            /contents/reference honors the value as sent.
        isSeriesFinale:
          type: boolean
          nullable: true
          description: >
            Accepted when type is EPISODE (describing the season this episode belongs to) or
            SEASON. True if this is the last season of the series. Same server-derivation
            override on POST /diary and POST /diary/bulk as isSeasonFinale above.
        runtimeMinutes:
          type: integer
          minimum: 1
          maximum: 1200
          nullable: true
          readOnly: true
          description: >
            Server-derived from TMDB, never accepted from the client — sending a non-null value returns 400
            for every type (MOVIE, SERIES, SEASON, EPISODE). Only meaningful for MOVIE and EPISODE (a
            SEASON/SERIES has no single runtime of its own): for a new MOVIE it's read from the same TMDB
            call already made to verify the tmdbId exists; for a new EPISODE (outside a /diary/bulk SERIES
            or SEASON request, which already derive it from TMDB themselves) the backend makes one extra
            TMDB call per episode, cached afterward, which also verifies that specific episode number exists.
            If TMDB has no runtime for it, this content simply contributes 0 to any watch-time aggregation.
        genres:
          type: array
          items: { type: string }
          nullable: true
          readOnly: true
          description: >
            Server-derived from TMDB, never accepted from the client — sending a non-null value returns 400
            for every type. Only meaningful for MOVIE/SERIES (a SEASON/EPISODE has no genres of its own in
            TMDB — episode-level watch-time-by-genre aggregation resolves genres from the SERIES-type Content
            sharing the same seriesTmdbId). Genre names from TMDB, not IDs. Derived once per content (from the
            same TMDB call already made to verify the tmdbId exists, for a new reference) and reused by
            everyone who references it afterward; if TMDB has no genres for it, this content simply
            contributes nothing to genreCounts.
        releaseYear:
          type: integer
          minimum: 1870
          maximum: 2100
          nullable: true
          readOnly: true
          description: >
            Server-derived from TMDB, never accepted from the client — sending a non-null value returns 400
            for every type. Only meaningful for MOVIE/SERIES (a SEASON/EPISODE has no release year of its own
            in TMDB — episode-level aggregation by decade resolves releaseYear from the SERIES-type Content
            sharing the same seriesTmdbId). Derived once per content and reused by everyone who references it
            afterward.
        countries:
          type: array
          items: { type: string }
          nullable: true
          readOnly: true
          description: >
            Server-derived from TMDB, never accepted from the client — sending a non-null value returns 400
            for every type. Only meaningful for MOVIE/SERIES (a SEASON/EPISODE has no production countries of
            its own in TMDB — episode-level aggregation by country resolves countries from the SERIES-type
            Content sharing the same seriesTmdbId). ISO 3166-1 alpha-2 country codes from TMDB's
            production_countries. Derived once per content and reused by everyone who references it afterward.

    ContentRef:
      allOf:
        - $ref: "#/components/schemas/ContentRefCreation"
        - type: object
          properties:
            id: { type: string, format: uuid, description: "ID local, usado nas demais rotas" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            totalRuntimeMinutes:
              type: integer
              nullable: true
              readOnly: true
              description: >
                Only returned when available for a SERIES. Persisted sum of the known runtimes of regular
                episodes; null before the series aggregate is initialized and for MOVIE, SEASON, and EPISODE.
                Reference reads do not call TMDB and never use runtimeMinutes (the series average) as a fallback.

    Top5Entry:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [MOVIE, SERIES] }
        content: { $ref: "#/components/schemas/ContentRef" }
        position: { type: integer, minimum: 1, maximum: 5 }
        customPosterUrl: { type: string, format: uri, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Top5EntryPatch:
      type: object
      description: >
        The only editable field on an existing Top 5 entry — there is still no "move" operation,
        matching insertEntry's existing insert/remove-only model. null means "leave unchanged".
      properties:
        customPosterUrl: { type: string, format: uri, maxLength: 2048, pattern: '^https://image\.tmdb\.org/t/p/w342/.+$', nullable: true }

    FeedItem:
      type: object
      description: >
        One feed event (GET /feed). Not a stored entity — derived at read
        time from DiaryEntry, DroppedEntry, Top5Entry, or a shared terminal daily-game result (see eventType).
        Fields not applicable to a given eventType are null. PICK_CREATED
        includes both a PickPreview and the related PicksTemplatePreview;
        PICKS_TEMPLATE_CREATED includes only the template preview.
        DAILY_GAME_RESULT is visible only for ACCEPTED followers, uses immutable sharedAt for global
        keyset ordering, and deliberately has no likes or comments.
      properties:
        eventType: { type: string, enum: [DIARY_ENTRY, DROPPED, TOP5_UPDATE, PICK_CREATED, PICKS_TEMPLATE_CREATED, DAILY_GAME_RESULT] }
        id:
          type: string
          format: uuid
          description: >
            Id of the underlying DiaryEntry/DroppedEntry/Top5Entry/Pick/PicksTemplate row. For
            eventType=DIARY_ENTRY, usable as diaryEntryId in
            POST /diary/{id}/like and GET/POST /diary/{id}/comments.
            For PICK_CREATED and PICKS_TEMPLATE_CREATED, it is the target id
            for the existing Pick or Picks Template social endpoints.
            DROPPED uses the dropped-entry social endpoints below; TOP5_UPDATE has no like/comment target.
            For DAILY_GAME_RESULT, id is the published UserDailyGameResult id and has no social target.
        user: { $ref: "#/components/schemas/UserPreviewDTO" }
        content:
          allOf:
            - $ref: "#/components/schemas/ContentRef"
          nullable: true
          description: Null when eventType is TOP5_UPDATE or DAILY_GAME_RESULT.
        top5Type:
          type: string
          enum: [MOVIE, SERIES]
          nullable: true
          description: Only set when eventType is TOP5_UPDATE.
        top5:
          type: array
          items: { $ref: "#/components/schemas/Top5Entry" }
          nullable: true
          description: Current ordered Top 5 preview. Only set when eventType is TOP5_UPDATE; it is not a historical snapshot of the change.
        score: { type: integer, nullable: true, description: "Only set when eventType is DIARY_ENTRY." }
        comment: { type: string, nullable: true, description: "Set when eventType is DIARY_ENTRY or DROPPED." }
        likesCount: { type: integer, nullable: true, description: "Set when eventType is DIARY_ENTRY or DROPPED." }
        likedByMe: { type: boolean, nullable: true, description: "Set when eventType is DIARY_ENTRY or DROPPED." }
        commentsCount:
          type: integer
          nullable: true
          description: Total comments on the DiaryEntry or DroppedEntry. Only set when eventType is DIARY_ENTRY or DROPPED; 0 when it has none.
        recentComments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
          nullable: true
          description: >
            Up to three most recent comments of this DiaryEntry or DroppedEntry (createdAt desc, id desc),
            with their own likesCount and likedByMe. Only set when eventType is DIARY_ENTRY or DROPPED;
            an empty array when it has no comments.
        watchedWith:
          type: array
          items: { $ref: "#/components/schemas/UserPreviewDTO" }
          nullable: true
          description: Same as DiaryEntry.watchedWith. Only set when eventType is DIARY_ENTRY.
        pick:
          allOf: [{ $ref: "#/components/schemas/PickPreview" }]
          nullable: true
          description: Only set when eventType is PICK_CREATED.
        picksTemplate:
          allOf: [{ $ref: "#/components/schemas/PicksTemplatePreview" }]
          nullable: true
          description: Set for PICK_CREATED and PICKS_TEMPLATE_CREATED.
        dailyGameResult:
          allOf: [{ $ref: "#/components/schemas/DailyGameResultPreviewDTO" }]
          nullable: true
          description: Only set when eventType is DAILY_GAME_RESULT; this event has no likes or comments.
        createdAt: { type: string, format: date-time }

    WatchlistEntry:
      type: object
      description: Same shape as Top5Entry, but with no upper bound on position — there is no 5-item cap.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [MOVIE, SERIES] }
        content: { $ref: "#/components/schemas/ContentRef" }
        position: { type: integer, minimum: 1 }
        releaseDate:
          type: string
          format: date
          nullable: true
          description: Data contextual ao dono da watchlist; nula quando o TMDB não fornece uma data válida.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DroppedEntry:
      type: object
      description: >
        Marks that the user stopped watching a MOVIE or SERIES partway through. Independent of
        DiaryEntry — does not affect and is not affected by any existing diary history for that
        content. Originally scoped to SERIES only (DroppedSeriesEntry); widened to include MOVIE on
        2026-08-18.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [MOVIE, SERIES] }
        content: { $ref: "#/components/schemas/ContentRef" }
        comment: { type: string, nullable: true, description: "Review text, when supplied while dropping the content." }
        likesCount: { type: integer, description: "Desnormalized count of likes on this dropped entry." }
        likedByMe: { type: boolean, description: "Whether the authenticated viewer liked this dropped entry." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ContentReviewSource:
      type: string
      enum: [DIARY, DROPPED]

    ContentReview:
      type: object
      description: >
        DROPPED events expose likesCount/likedByMe and use the dropped-entry like and comment endpoints.
        Review text attached either to a DiaryEntry or to a DroppedEntry. `source` identifies the
        target id used by the corresponding social endpoints. Dropped reviews never have a score or
        diary-only watch metadata.
      properties:
        id: { type: string, format: uuid }
        source: { $ref: "#/components/schemas/ContentReviewSource" }
        userId: { type: string, format: uuid }
        content: { $ref: "#/components/schemas/ContentRef" }
        comment: { type: string, nullable: true }
        score: { type: integer, nullable: true, description: Only populated for DIARY reviews. }
        watchedDate: { type: string, format: date, nullable: true }
        watchNumber: { type: integer, nullable: true }
        watchedInTheater: { type: boolean, nullable: true }
        customPosterUrl: { type: string, format: uri, nullable: true }
        autoGenerated: { type: boolean, nullable: true }
        ignore: { type: boolean, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        likesCount: { type: integer }
        likedByMe: { type: boolean }
        watchedWith:
          type: array
          items: { $ref: "#/components/schemas/UserPreviewDTO" }

    Summary:
      type: object
      description: >
        Resposta de GET /users/{userId}/summary, inteiramente escopada pelo type pedido
        (MOVIE ou SERIES) — ver descrição do endpoint.
      properties:
        watchTime:
          type: object
          properties:
            totalMinutesWatched: { type: integer }
            minutesWatchedLast30Days: { type: integer }
        genreCounts:
          type: array
          description: >
            Do type pedido. MOVIE: quantidade de DiaryEntry por gênero
            (rewatch soma). SERIES: quantidade de séries distintas
            iniciadas por gênero (rewatch não soma de novo) — ver
            WatchTimeStats.genreCountsMovies/genreCountsSeries.
          items:
            type: object
            properties:
              genre: { type: string }
              count: { type: integer }
        ratingsDistribution:
          type: array
          description: Histograma de score (1-10) das DiaryEntry com nota, do type pedido.
          items:
            type: object
            properties:
              score: { type: integer }
              count: { type: integer }
        recentEpisodes:
          type: array
          description: Últimos 4 episódios assistidos. Sempre vazio quando type=MOVIE.
          items: { $ref: "#/components/schemas/DiaryEntry" }
        recentReviews:
          type: array
          description: Últimas 5 DiaryEntry com comment preenchido, do type pedido.
          items: { $ref: "#/components/schemas/DiaryEntry" }
        recentActivity:
          type: array
          description: >
            Últimos 6 eventos (concluído ou abandonado) do type pedido, mesclados de DiaryEntry
            (nível MOVIE/SERIES) e DroppedEntry e ordenados por data mais recente.
          items:
            type: object
            properties:
              content: { $ref: "#/components/schemas/ContentRef" }
              status: { type: string, enum: [COMPLETED, DROPPED] }
              comment: { type: string, nullable: true }
              activityDate: { type: string, format: date-time }

    MonthInReview:
      type: object
      description: Resposta de GET /users/{userId}/summary/month, escopada pelo type e month pedidos.
      properties:
        recentWatched: { type: array, items: { $ref: "#/components/schemas/DiaryEntry" }, description: "Até 6 títulos do tipo pedido (MOVIE ou SERIES), mais recentes primeiro; episódios e temporadas não aparecem." }
        topRated: { type: array, items: { $ref: "#/components/schemas/DiaryEntry" }, description: "Até 6, melhor nota primeiro; quem está no Top5 do usuário aparece primeiro dentro do grupo." }
        bottomRated: { type: array, items: { $ref: "#/components/schemas/DiaryEntry" }, description: "Até 6, pior nota primeiro em ordem estritamente crescente de score." }
        ratingsDistribution:
          type: array
          items: { type: object, properties: { score: { type: integer }, count: { type: integer } } }
        watchCount: { type: integer }
        minutesWatched: { type: integer }
        firstWatched:
          allOf:
            - $ref: "#/components/schemas/DiaryEntry"
          nullable: true
          description: Primeiro registro assistido no mês, incluindo o conteúdo e watchedDate.
        lastWatched:
          allOf:
            - $ref: "#/components/schemas/DiaryEntry"
          nullable: true
          description: Último registro assistido no mês, incluindo o conteúdo e watchedDate.
        minutesPerDay:
          type: array
          items: { type: object, properties: { watchedDate: { type: string, format: date }, minutesWatched: { type: integer } } }
        watchCountByDayOfWeek:
          type: array
          description: "dayOfWeek segue ISO-8601 (1=segunda ... 7=domingo)."
          items: { type: object, properties: { dayOfWeek: { type: integer, minimum: 1, maximum: 7 }, count: { type: integer } } }
        genreCounts:
          type: array
          description: >
            Do type pedido, escopado ao mês. MOVIE: quantidade de
            DiaryEntry por gênero no mês (rewatch soma). SERIES:
            quantidade de séries distintas com pelo menos uma DiaryEntry
            no mês, por gênero (rewatch de uma série já contada no mês
            não soma de novo).
          items: { type: object, properties: { genre: { type: string }, count: { type: integer } } }
        topSeriesByWatchTime:
          type: array
          description: Top 3 séries por tempo assistido no mês. Só preenchido quando type=SERIES.
          items: { type: object, properties: { seriesTmdbId: { type: string }, totalMinutesWatched: { type: integer } } }
        topLongestMovies:
          type: array
          description: Top 3 filmes mais longos assistidos no mês. Só preenchido quando type=MOVIE.
          items: { $ref: "#/components/schemas/ContentRef" }
        topWatchCompanions:
          type: array
          description: >
            Top 3 pessoas que o usuário assistiu com (WatchCompanion), por quantidade de tags no
            mês, escopado pelo type pedido (mesma regra de EPISODE-para-SERIES do resto da
            resposta). Cada rewatch marcado conta separadamente.
          items:
            type: object
            properties:
              companion: { $ref: "#/components/schemas/UserPreviewDTO" }
              watchCount: { type: integer }

    YearInReview:
      type: object
      description: Resposta de GET /users/{userId}/summary/year, escopada pelo type e year pedidos.
      properties:
        ratingsDistribution:
          type: array
          items: { type: object, properties: { score: { type: integer }, count: { type: integer } } }
        watchCount: { type: integer }
        minutesWatched: { type: integer }
        averageMinutesPerMonth: { type: number }
        averageMinutesPerWeek: { type: number }
        averageMinutesPerDay: { type: number }
        watchCountByMonth:
          type: array
          items: { type: object, properties: { month: { type: integer, minimum: 1, maximum: 12 }, count: { type: integer } } }
        watchCountByDayOfWeek:
          type: array
          items: { type: object, properties: { dayOfWeek: { type: integer, minimum: 1, maximum: 7 }, count: { type: integer } } }
        firstWatched:
          allOf:
            - $ref: "#/components/schemas/DiaryEntry"
          nullable: true
          description: Primeiro registro assistido no ano, incluindo o conteúdo e watchedDate.
        lastWatched:
          allOf:
            - $ref: "#/components/schemas/DiaryEntry"
          nullable: true
          description: Último registro assistido no ano, incluindo o conteúdo e watchedDate.
        longestWatched:
          type: array
          description: >
            Até 10, duração total desc. Pra MOVIE, é o runtimeMinutes do próprio filme; pra SERIES, é a
            soma do runtimeMinutes dos episódios assistidos no ano daquela série (seriesTmdbId).
          items:
            type: object
            properties:
              type: { type: string, enum: [MOVIE, SERIES] }
              tmdbId: { type: string, nullable: true }
              seriesTmdbId: { type: string, nullable: true }
              totalMinutesWatched: { type: integer }
        genreCounts:
          type: array
          description: Mesma regra de MonthInReview.genreCounts, escopado pro ano pedido.
          items: { type: object, properties: { genre: { type: string }, count: { type: integer } } }
        topRated: { type: array, items: { $ref: "#/components/schemas/DiaryEntry" }, description: "Até 10, mesma regra de promoção do Top5 de MonthInReview." }
        bottomRated: { type: array, items: { $ref: "#/components/schemas/DiaryEntry" }, description: "Até 10, pior nota primeiro em ordem estritamente crescente de score." }
        topWatchCompanions:
          type: array
          description: Mesma regra de MonthInReview.topWatchCompanions, escopado pro ano pedido.
          items:
            type: object
            properties:
              companion: { $ref: "#/components/schemas/UserPreviewDTO" }
              watchCount: { type: integer }

    AllTimeStats:
      type: object
      description: Resposta de GET /users/{userId}/summary/all-time. Sem type — combina MOVIE e SERIES.
      properties:
        totalMoviesWatched: { type: integer }
        totalEpisodesWatched: { type: integer }
        totalMinutesWatchedMovies: { type: integer, description: "Soma de runtimeMinutes de DiaryEntry MOVIE, all-time." }
        totalMinutesWatchedEpisodes: { type: integer, description: "Soma de runtimeMinutes de DiaryEntry EPISODE, all-time." }
        totalTheaterVisits: { type: integer, description: "COUNT de DiaryEntry com watchedInTheater=true, all-time — ver WatchTimeStats." }
        averageMinutesPerMonth: { type: number }
        averageMinutesPerWeek: { type: number }
        averageMinutesPerDay: { type: number }
        watchCountByYearMovies:
          type: array
          items: { type: object, properties: { year: { type: integer }, count: { type: integer } } }
        watchCountByYearEpisodes:
          type: array
          items: { type: object, properties: { year: { type: integer }, count: { type: integer } } }
        watchCountByDecade:
          type: array
          description: Combina MOVIE e SERIES por título distinto. Vazio se releaseYear nunca foi informado.
          items: { type: object, properties: { decade: { type: integer }, count: { type: integer } } }
        watchCountByCountry:
          type: array
          description: Combina MOVIE e SERIES por título distinto. Vazio se countries nunca foi informado.
          items: { type: object, properties: { country: { type: string }, count: { type: integer } } }
        mostLoggedContent:
          type: array
          description: Top 10 MOVIE/SERIES por quantidade de DiaryEntry (rewatches contam), all-time.
          items:
            type: object
            properties:
              content: { $ref: "#/components/schemas/ContentRef" }
              count: { type: integer }
        genreCountsMovies:
          type: array
          description: Mesma regra de WatchTimeStats.genreCountsMovies, sem recorte de tempo.
          items: { type: object, properties: { genre: { type: string }, count: { type: integer } } }
        genreCountsSeries:
          type: array
          description: Mesma regra de WatchTimeStats.genreCountsSeries, sem recorte de tempo.
          items: { type: object, properties: { genre: { type: string }, count: { type: integer } } }
        topRated: { type: array, items: { $ref: "#/components/schemas/DiaryEntry" }, description: "Top 10 combinando MOVIE e SERIES, mesma regra de promoção do Top5." }
        bottomRated: { type: array, items: { $ref: "#/components/schemas/DiaryEntry" }, description: "Até 10, pior nota primeiro em ordem estritamente crescente de score." }
        topWatchCompanions:
          type: array
          description: >
            Mesma regra de MonthInReview.topWatchCompanions, sem escopo de type nem de data —
            combina MOVIE e SERIES (via EPISODE), all-time.
          items:
            type: object
            properties:
              companion: { $ref: "#/components/schemas/UserPreviewDTO" }
              watchCount: { type: integer }

    EpisodeRatingsGrid:
      type: object
      description: Resposta de GET /users/{userId}/series/{seriesTmdbId}/episode-ratings.
      properties:
        seriesTmdbId: { type: string }
        customPosterUrl:
          type: string
          format: uri
          nullable: true
          pattern: '^https://image\.tmdb\.org/t/p/w342/.+$'
          description: Poster customizado da serie no contexto do usuario consultado; null usa o poster do TMDB.
        episodes:
          type: array
          items:
            type: object
            properties:
              seasonNumber: { type: integer }
              episodeNumber: { type: integer }
              score: { type: integer, nullable: true }

    EpisodeRatingsMap:
      type: object
      description: Resposta de GET /users/{userId}/episode-ratings-map.
      properties:
        series:
          type: array
          items: { $ref: "#/components/schemas/EpisodeRatingsMapItem" }

    EpisodeRatingsMapItem:
      type: object
      properties:
        seriesTmdbId: { type: string }
        watchedEpisodeCount: { type: integer, format: int64 }
        totalEpisodeCount: { type: integer, nullable: true }
        customPosterUrl:
          type: string
          format: uri
          nullable: true
          pattern: '^https://image\.tmdb\.org/t/p/w342/.+$'
          description: Poster customizado da serie no contexto do usuario consultado; null usa o poster do TMDB.

    ContentStats:
      type: object
      description: >
        Resposta de GET /contents/{contentId}/stats e GET /contents/stats. Agregação sobre
        DiaryEntry/Comment cruzando todos os usuários — averageScore/playsCount/reviewsCount
        somam só DiaryEntry de usuários com perfil público (isProfilePublic = true); um contentId
        sem nenhuma interação ainda devolve averageScore null e os três contadores em 0, nunca 404.
      properties:
        contentId: { type: string, format: uuid }
        averageScore: { type: number, nullable: true, description: "Média de score entre as DiaryEntry de perfil público desse conteúdo. null quando nenhuma tem score." }
        playsCount: { type: integer, description: "COUNT(DiaryEntry) de perfil público — inclui rewatch (watchNumber > 1)." }
        reviewsCount: { type: integer, description: "COUNT(DiaryEntry) de perfil público com comment preenchido, mesma semântica de hasReview." }
        commentsCount: { type: integer, description: "COUNT(Comment) desse conteúdo — Comment não tem visibilidade própria, sempre contado." }

    ContentDetailsDTO:
      type: object
      description: >
        Resposta de GET /contents/{contentId}/details e GET /contents/details — dados do TMDB
        resolvidos e cacheados pelo backend (nunca chamado direto pelo cliente). Campos são
        condicionais por type, mesmo padrão de MonthInReview/YearInReview: seasons só em SERIES,
        episodes só em SEASON, guestStars em EPISODE e SEASON (nunca em SERIES — ver campo
        guestStars), creators em SERIES e SEASON. cast em SEASON vem
        do aggregate_credits próprio daquela temporada (TMDB expõe isso por temporada, com
        episodeCount já reescopado — ver CastMember.episodeCount), sem chamada TMDB extra; cast em
        EPISODE reaproveita o elenco regular da SERIES do mesmo seriesTmdbId (episódio não tem
        aggregate_credits próprio no TMDB), watchProviders em EPISODE é sempre vazio (TMDB não tem
        esse dado por episódio). O agregado de runtime de SERIES reutiliza os valores persistidos
        quando o baseline está completo, recente e com a contagem reportada de episódios regulares
        inalterada. Quando precisa reconciliar, o backend busca as temporadas regulares em paralelo e
        reaproveita essas respostas ao montar seasons/recentEpisodes. Mesmo com baseline reutilizado,
        detalhes ainda pode buscar temporadas para seasons/recentEpisodes; em série terminal, essa
        carga exclusiva dos detalhes fica limitada às duas temporadas mais recentes.
        budget/revenue só existem em MOVIE (0 do TMDB vira null); productionCompanies/crew/videos
        existem em MOVIE/SERIES e são herdados por SEASON/EPISODE da SERIES do mesmo seriesTmdbId;
        crew é filtrado por uma lista fixa de jobs (ver seção Content de business-rules.md).
      properties:
        contentId: { type: string, format: uuid }
        type: { type: string, enum: [MOVIE, SERIES, SEASON, EPISODE] }
        title:
          type: string
          nullable: true
          description: >
            Resolvido nessa ordem: título traduzido pro preferredLanguage do usuário → título
            alternativo do TMDB pra preferredRegion do usuário (só MOVIE/SERIES) → título original.
            SEASON/EPISODE não têm essa cadeia de fallback (TMDB não tem alternative_titles pra
            esses tipos) — fica nulo/genérico se o idioma escolhido não tiver tradução.
        overview: { type: string, nullable: true }
        posterPath: { type: string, nullable: true, description: "Path relativo do TMDB (ex. /abc123.jpg) — cliente monta a URL final com o base de imagem do TMDB. Em EPISODE é o still_path (frame do episódio), TMDB não tem pôster próprio de episódio." }
        customPosterUrl:
          type: string
          format: uri
          nullable: true
          pattern: '^https://image\.tmdb\.org/t/p/w342/.+$'
          description: >
            Override canonico do poster para o usuario resolvido por posterUserId; null significa
            que o cliente deve usar posterPath do TMDB. Sem posterUserId, o usuario resolvido e o viewer autenticado.
        backdropPath: { type: string, nullable: true, description: "null em SEASON/EPISODE — TMDB não tem backdrop próprio pra esses tipos." }
        releaseDate: { type: string, format: date, nullable: true }
        runtimeMinutes:
          type: integer
          nullable: true
          description: >
            Duração própria (MOVIE/EPISODE), média persistida ou recalculada dos episódios regulares
            conhecidos de SERIES (temporadas exceto a 0), ou média de episódio só daquela temporada
            (SEASON, a partir dos episódios já buscados em GET /tv/{id}/season/{n}, sem chamada
            extra). Em SERIES, é o totalRuntimeMinutes dividido por runtimeMinutesEpisodeCount e
            arredondado ao inteiro mais próximo. null se nenhum episódio no escopo tem runtime
            conhecido.
        totalRuntimeMinutes:
          type: integer
          nullable: true
          description: >
            Em SERIES, soma persistida ou recalculada do runtime conhecido de todos os episódios
            regulares de todas as temporadas exceto a 0; em SEASON, soma só dos episódios daquela
            temporada, sem chamada extra. Episódios sem runtime conhecido ficam fora da soma e do
            denominador da média. null se nenhum episódio no escopo tem runtime conhecido.
        numberOfSeasons: { type: integer, nullable: true, description: "Só preenchido em SERIES — number_of_seasons do TMDB, sem chamada extra (já vem no corpo base de GET /tv/{id}). Inclui a temporada 0 (Specials) se ela existir, ao contrário de totalRuntimeMinutes/recentEpisodes." }
        numberOfEpisodes:
          type: integer
          nullable: true
          description: >
            Em SERIES é passthrough de number_of_episodes do TMDB, sem chamada extra — inclui a
            temporada 0 (Specials) se existir, mesma ressalva de numberOfSeasons. Em SEASON é a
            contagem de episodes[] daquela temporada (tamanho da lista já buscada em GET
            /tv/{id}/season/{n}, sem chamada extra) — sempre inclui episódio ainda não exibido,
            diferente de seasons[].airedEpisodeCount.
        genres:
          type: array
          items: { type: string }
          description: Nomes de gênero do TMDB. Em SEASON/EPISODE, resolvido via a SERIES do mesmo seriesTmdbId.
        countries:
          type: array
          items: { type: string }
          description: Códigos ISO 3166-1 alpha-2. Mesma resolução via SERIES em SEASON/EPISODE.
        cast:
          type: array
          items: { $ref: "#/components/schemas/CastMember" }
          description: >
            Elenco regular. MOVIE usa credits; SERIES usa aggregate_credits da própria série;
            SEASON usa aggregate_credits da própria temporada (episodeCount escopado a essa
            temporada); EPISODE reaproveita aggregate_credits da SERIES (episodeCount escopado à
            série inteira, TMDB não tem aggregate_credits por episódio).
        guestStars:
          type: array
          items: { $ref: "#/components/schemas/CastMember" }
          description: >
            Preenchido em EPISODE (guest_stars do próprio episódio) e em SEASON (guest_stars de
            todos os episódios daquela temporada, já embutidos na resposta de GET
            /tv/{id}/season/{n} — sem chamada TMDB extra — agregados por pessoa: mesmo id em mais
            de um episódio aparece uma vez só, com episodeCount contando em quantos episódios
            daquela temporada apareceu e character/profilePath da primeira aparição). Sempre vazio
            em SERIES — TMDB só expõe guest_stars por episódio, agregar pra série inteira exigiria
            uma chamada extra por episódio (N+1), fora do orçamento de 1 chamada por temporada
            deste endpoint.
        creators:
          type: array
          items: { type: object, properties: { name: { type: string }, profilePath: { type: string, nullable: true } } }
          description: >
            Preenchido em SERIES e em SEASON (reaproveita created_by da SERIES do mesmo
            seriesTmdbId, já buscada nesse mesmo request pra genres/countries — sem chamada TMDB
            extra). TMDB não tem creators por temporada.
        watchProviders:
          type: array
          description: >
            Já filtrado pra preferredRegion do usuário autenticado — o TMDB devolve todas as
            regiões numa única resposta cacheada (não é parâmetro de chamada), a seleção é feita
            pelo backend na montagem da resposta. Vazio se a região do usuário não tiver provider
            cadastrado no TMDB, ou sempre em EPISODE (TMDB não tem esse dado por episódio).
          items:
            type: object
            properties:
              providerName: { type: string }
              logoPath: { type: string, nullable: true }
              type: { type: string, enum: [flatrate, rent, buy] }
        seasons:
          type: array
          description: Só preenchido em SERIES — vem de graça no corpo base de GET /tv/{id} do TMDB, sem chamada extra.
          items:
            type: object
            properties:
              seasonNumber: { type: integer }
              name: { type: string }
              posterPath: { type: string, nullable: true }
              airDate: { type: string, format: date, nullable: true }
              episodeCount:
                type: integer
                nullable: true
                description: >
                  Total de episódios que o TMDB tem cadastrado pra essa temporada — inclui episódios
                  agendados/ainda não exibidos numa temporada em exibição. Não usar isso pra decidir
                  quantos episódios marcar como assistidos em POST /diary/bulk; usar
                  airedEpisodeCount.
              airedEpisodeCount:
                type: integer
                nullable: true
                description: >
                  Quantos episódios dessa temporada já foram ao ar (airDate <= hoje) — calculado
                  pelo backend a partir dos mesmos dados de episódio já buscados pra
                  totalRuntimeMinutes/recentEpisodes, sem chamada TMDB extra. É o número certo pra
                  montar finaleEpisodeNumber/seasonFinaleEpisodeNumbers de POST /diary/bulk sem
                  incluir episódios futuros. null quando os detalhes daquela temporada não puderam
                  ser buscados no TMDB (falha pontual) — nesse caso não assuma 0, trate como
                  desconhecido.
        episodes:
          type: array
          description: Só preenchido em SEASON — vem de graça no corpo base de GET /tv/{id}/season/{n} do TMDB, sem chamada extra.
          items: { $ref: "#/components/schemas/EpisodeSummary" }
        recentEpisodes:
          type: array
          description: >
            Só preenchido em SERIES — até os 3 episódios mais recentes já lançados (airDate <= hoje),
            entre todas as temporadas, ordenados do mais recente pro mais antigo. Episódio futuro
            (ainda não foi ao ar) nunca aparece aqui. Busca as mesmas respostas de temporada usadas
            em totalRuntimeMinutes, sem chamada TMDB extra além dessas.
          items: { $ref: "#/components/schemas/EpisodeSummary" }
        budget:
          type: integer
          format: int64
          nullable: true
          description: >
            Só preenchido em MOVIE — orçamento em dólares americanos, do TMDB. TMDB usa 0 pra "não
            informado", tratado como null pelo backend (não um orçamento real de $0). Sempre null em
            SERIES/SEASON/EPISODE — o endpoint /tv/{id} do TMDB não tem esse campo.
        revenue:
          type: integer
          format: int64
          nullable: true
          description: Mesma regra de budget (0 do TMDB vira null), também só preenchido em MOVIE.
        productionCompanies:
          type: array
          description: >
            Em MOVIE/SERIES vem do próprio corpo base do TMDB, sem chamada extra. Em SEASON/EPISODE,
            herdado da SERIES do mesmo seriesTmdbId (mesmo padrão de genres/countries/creators).
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              logoPath: { type: string, nullable: true }
              originCountry: { type: string, nullable: true }
        crew:
          type: array
          description: >
            Equipe técnica filtrada por uma lista fixa de jobs (Director, Screenplay, Executive
            Producer, Production Manager, First Assistant Director, Director of Photography,
            Supervising Art Director) — pessoas com nenhum job dessa lista não aparecem. MOVIE usa
            credits.crew; SERIES usa aggregate_credits.crew da própria série; SEASON/EPISODE herdam
            o aggregate_credits.crew da SERIES do mesmo seriesTmdbId. Um registro por pessoa — jobs
            agrupados numa lista quando a mesma pessoa tem mais de um job que bate no filtro.
          items:
            type: object
            properties:
              id: { type: integer, description: "TMDB person id." }
              name: { type: string }
              profilePath: { type: string, nullable: true }
              jobs: { type: array, items: { type: string } }
        videos:
          type: array
          description: >
            Vídeos que o TMDB retorna, filtrados a site=YouTube (outros sites como Vimeo são
            descartados) — sem filtro por type/official além disso, o cliente decide o que exibir
            entre trailers/teasers/clipes etc. MOVIE/SERIES usam o próprio videos.results;
            SEASON/EPISODE herdam o da SERIES do mesmo seriesTmdbId (TMDB não tem vídeos por
            temporada/episódio).
          items:
            type: object
            properties:
              key:
                type: string
                description: "Identificador do vídeo no YouTube, usado para montar url."
              name: { type: string }
              site: { type: string, description: "Sempre YouTube — outros sites são filtrados no backend." }
              type: { type: string, description: "Ex. Trailer, Teaser, Clip, Featurette, Behind the Scenes, Bloopers." }
              official: { type: boolean }
              language: { type: string, nullable: true, description: "iso_639_1 do TMDB." }
              publishedAt: { type: string, format: date-time, nullable: true }
              url:
                type: string
                description: "URL de reprodução pronta, montada pelo backend a partir de key (https://www.youtube.com/watch?v={key})."

    EpisodeSummary:
      type: object
      properties:
        seasonNumber: { type: integer }
        episodeNumber: { type: integer }
        name: { type: string }
        airDate: { type: string, format: date, nullable: true }
        runtime: { type: integer, nullable: true }
        stillPath: { type: string, nullable: true }

    CastMember:
      type: object
      properties:
        id: { type: integer, description: "TMDB person id." }
        name: { type: string }
        character: { type: string, nullable: true }
        profilePath: { type: string, nullable: true }
        episodeCount:
          type: integer
          nullable: true
          description: >
            Quantidade de episódios em que essa pessoa aparece. Escopo varia por tela: na tela de
            Série (cast de ContentDetailsDTO com type=SERIES) é o total na série inteira; na tela
            de Temporada (type=SEASON) é só nessa temporada (TMDB expõe aggregate_credits por
            temporada também, com episode_count já reescopado — nenhuma chamada TMDB extra além da
            já feita pra buscar a temporada). Em MOVIE e nos guestStars de EPISODE, sempre null
            (filme não tem conceito de episódio; guest star já é específico daquele episódio). No
            cast reaproveitado por EPISODE (elenco regular da SERIES), é o total na série inteira,
            mesma fonte da tela de Série. Nos guestStars de SEASON, é calculado pelo backend (não
            vem do TMDB) contando em quantos episódios daquela temporada o guest star apareceu, ao
            agregar os guest_stars de cada episódio de episodes[] da temporada.

    HomeSummary:
      type: object
      description: Resposta de GET /users/{userId}/summary/home.
      properties:
        totalMinutesWatchedMovies: { type: integer, description: "Soma de runtimeMinutes de DiaryEntry MOVIE, all-time." }
        totalMinutesWatchedEpisodes: { type: integer, description: "Soma de runtimeMinutes de DiaryEntry EPISODE, all-time." }
        totalMoviesWatched: { type: integer }
        totalEpisodesWatched: { type: integer }
        nextEpisodes:
          type: array
          items: { $ref: "#/components/schemas/SeriesInProgressPreview" }
          description: "Até 6, mesma fonte/ordenação de GET /users/{userId}/series-in-progress. 'Próximo episódio' é maxEpisodeNumber+1 dentro de maxSeasonNumber, calculado pelo cliente."
        watchCountByDayLast30Days:
          type: array
          description: Contagem de DiaryEntry (MOVIE+EPISODE) por dia, janela rolante dos últimos 30 dias corridos — não mês calendário.
          items: { type: object, properties: { watchedDate: { type: string, format: date }, count: { type: integer } } }
        genreCountsMoviesLast30Days:
          type: array
          description: Mesma regra de MonthInReview.genreCounts pra MOVIE, mas em janela rolante de 30 dias.
          items: { type: object, properties: { genre: { type: string }, count: { type: integer } } }
        genreCountsSeriesLast30Days:
          type: array
          description: Mesma regra de MonthInReview.genreCounts pra SERIES, mas em janela rolante de 30 dias.
          items: { type: object, properties: { genre: { type: string }, count: { type: integer } } }
        recentlyWatched:
          type: array
          description: Até 4, mescla DiaryEntry de MOVIE e EPISODE (exclui SEASON/SERIES sintéticos) ordenado por createdAt desc.
          items: { $ref: "#/components/schemas/DiaryEntry" }

    CommentCreation:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 280 }
        parentCommentId: { type: string, format: uuid, nullable: true }
        containsSpoiler: { type: boolean, default: false }

    CommentPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            content:
              type: array
              items: { $ref: "#/components/schemas/Comment" }

    Comment:
      type: object
      description: >
        Exactly one of contentId, listId, diaryEntryId, pickId, picksTemplateId is present per comment — the
        resource it was posted on. parentCommentId is independent of that and, when
        present, points to the comment this one replies to (same target as the parent).
        Deleted in cascade whenever its content/list/diary target is deleted, whenever
        its author's account is deleted (no "[deleted user]" placeholder — the comment
        itself is gone, along with the entire reply subtree below it, even replies from
        other users), or whenever its parent comment is deleted.
      properties:
        id: { type: string, format: uuid }
        user: { $ref: "#/components/schemas/PublicUserDTO" }
        contentId: { type: string, format: uuid, nullable: true }
        listId: { type: string, format: uuid, nullable: true }
        diaryEntryId: { type: string, format: uuid, nullable: true }
        droppedEntryId: { type: string, format: uuid, nullable: true }
        pickId: { type: string, format: uuid, nullable: true }
        picksTemplateId: { type: string, format: uuid, nullable: true }
        parentCommentId: { type: string, format: uuid, nullable: true }
        text: { type: string, minLength: 1, maxLength: 280 }
        containsSpoiler: { type: boolean, default: false }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        likesCount: { type: integer, description: "Contador desnormalizado de curtidas (Like com comentario_id apontando pra este comentário), mantido em conjunto com o insert/delete de Like — não é uma COUNT ao vivo por requisição." }
        likedByMe: { type: boolean, description: "Se o usuário autenticado que fez a requisição curtiu este comentário. Resolvido em lote (uma query indexada por user_id + IN dos ids da página), não uma checagem por comentário." }

    UserContentPosterRequest:
      type: object
      required: [customPosterUrl]
      properties:
        customPosterUrl:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          pattern: '^https://image\.tmdb\.org/t/p/w342/.+$'

    UserContentPosterResponse:
      type: object
      required: [contentId, customPosterUrl, updatedAt]
      properties:
        contentId: { type: string, format: uuid }
        customPosterUrl:
          type: string
          format: uri
          pattern: '^https://image\.tmdb\.org/t/p/w342/.+$'
        updatedAt: { type: string, format: date-time }

    UserListCreation:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 400 }
        visibility:
          type: string
          enum: [PUBLIC, FOLLOWERS, PRIVATE]
          default: PUBLIC
          description: >
            PUBLIC: qualquer usuário autenticado vê a lista, mesmo sem seguir o dono e mesmo que o
            perfil do dono seja privado. FOLLOWERS: só o dono e quem o segue com status aceito.
            PRIVATE: só o dono.

    UserListPatch:
      type: object
      description: >
        Todos os campos opcionais — omitir ou mandar null em qualquer um significa "não alterar
        esse campo". name, se enviado, não pode ser vazio/só-espaço.
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 400 }
        visibility:
          type: string
          enum: [PUBLIC, FOLLOWERS, PRIVATE]
        rank:
          type: integer
          minimum: 1
          description: >
            Reordena a lista entre as demais do mesmo dono. Não pode passar da quantidade de listas
            já rankeadas do dono (400) — ver descrição completa em PATCH /lists/{listId}.

    UserList:
      allOf:
        - $ref: "#/components/schemas/UserListCreation"
        - type: object
          description: >
            Sem o dono embutido: todo endpoint que retorna esse schema já tem o dono implícito no
            contexto da chamada (userId no path, ou o usuário autenticado em /users/me/lists e
            /lists/{listId}) — diferente de um resultado de busca que lista listas de vários
            usuários diferentes, onde o dono precisaria vir explícito.
          properties:
            id: { type: string, format: uuid }
            watchedPercentage:
              type: number
              format: float
              description: >
                Percentual da lista inteira calculado no escopo do usuário autenticado que fez a
                requisição, não no escopo do dono. O denominador contém todos os itens de content e
                ignora itens de lista aninhada. O numerador contém somente itens com contentState.watchStatus
                igual a WATCHED; para SERIES e SEASON, isso exige que todos os episódios já lançados
                estejam assistidos, sem exigir episódios futuros. Itens com estado UNKNOWN permanecem
                no denominador, mas não entram no numerador. 0.0 quando a lista não tem item de content.
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            previewItems:
              type: array
              maxItems: 5
              items: { $ref: "#/components/schemas/ContentRef" }
              description: >
                Os até 5 primeiros itens de conteúdo da lista, ordenados por position. Vazio quando a
                lista ainda não tem itens, ou quando ela está travada como lista-de-listas (nesse caso
                ver nestedListsCount) — uma UserList nunca mistura content e lista aninhada no mesmo
                item (ver UserListItem).
            nestedListsCount:
              type: integer
              description: >
                Quantidade de listas aninhadas na lista, só maior que 0 quando ela está travada como
                lista-de-listas (nesse caso previewItems vem sempre vazio). Não há preview das listas
                aninhadas em si aqui — para isso, use GET /lists/{listId}, que devolve os itens completos.
            likesCount: { type: integer, description: "Contador desnormalizado de curtidas (Like com lista_id apontando pra esta lista), mantido em conjunto com o insert/delete de Like — não é uma COUNT ao vivo por requisição." }
            likedByMe: { type: boolean, description: "Se o usuário autenticado que fez a requisição curtiu esta lista. Resolvido em lote (uma query indexada por user_id + IN dos ids da página) em GET /users/{userId}/lists, e por uma checagem individual (mesma query, um único id) nas demais respostas." }
            itemsCount: { type: integer, description: "Quantidade total de itens da lista (content + lista aninhada somados). Em UserListDetailed, é a contagem da lista completa e não apenas items.length, que contém somente a página atual; em GET /users/{userId}/lists é uma COUNT em lote (mesmo padrão de nestedListsCount/watchedPercentage)." }
            commentsCount: { type: integer, description: "Quantidade de comentários (Comment com list_id apontando pra esta lista). Não é desnormalizado como likesCount — é uma COUNT calculada na mesma leva de queries que os outros contadores desta resposta." }
            totalRuntimeMinutes: { type: integer, description: "Soma de runtimeMinutes dos itens MOVIE/EPISODE e exclusivamente de totalRuntimeMinutes persistido dos itens SERIES — a média runtimeMinutes da série nunca é usada como total. Itens de lista aninhada ficam de fora da soma; Content sem o runtime aplicável contribui 0. A leitura usa somente os valores locais persistidos e não chama o TMDB." }
            containsContent:
              type: boolean
              nullable: true
              description: >
                Se esse content já está na lista. Só resolvido (true/false) quando a requisição
                passa o parâmetro contentId (ver GET /users/{userId}/lists); null em qualquer outra
                resposta que usa este schema (POST/PATCH /users/me/lists, GET /users/me/liked-lists),
                onde não há um content de referência pra comparar.
            itemScope:
              type: string
              nullable: true
              enum: [MOVIE_OR_SERIES, SEASON, EPISODE, LIST, MIXED]
              description: >
                Grupo de tipo de conteúdo ao qual esta lista está travada no momento, inferido dos itens
                de conteúdo já presentes (ver UserListItem). Null quando a lista ainda não tem nenhum
                item de conteúdo e aceita qualquer tipo. MIXED indica uma lista anterior a essa
                restrição que já mistura mais de um grupo — nesse caso ela não aceita mais nenhum item
                de conteúdo novo.
            rank:
              type: integer
              nullable: true
              description: >
                Posição manual entre as demais listas do mesmo dono (1 a N). null numa lista que
                ainda não foi rankeada — cai no fim quando ordenado por rank. Atribuído
                automaticamente (N+1) na criação; reordenado via PATCH /lists/{listId}.

    UserListBulkCreation:
      allOf:
        - $ref: "#/components/schemas/UserListCreation"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              minItems: 1
              maxItems: 100
              items: { $ref: "#/components/schemas/ContentRefCreation" }

    UserListItemBulkCreation:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ContentRefCreation" }

    UserListPreview:
      type: object
      description: Versão enxuta de UserList usada para representar uma lista aninhada dentro de UserListItem.childList, sem embutir os próprios itens.
      properties:
        id: { type: string, format: uuid }
        user: { $ref: "#/components/schemas/UserPreviewDTO" }
        name: { type: string }
        visibility: { type: string, enum: [PUBLIC, FOLLOWERS, PRIVATE] }

    UserListDetailed:
      allOf:
        - $ref: "#/components/schemas/UserListCreation"
        - type: object
          properties:
            id: { type: string, format: uuid }
            watchedPercentage:
              type: number
              format: float
              description: >
                Percentual da lista inteira, antes dos filtros opcionais de type e genre, calculado
                no escopo do viewer autenticado. O denominador contém todos os itens de content e
                ignora itens de lista aninhada. O numerador contém somente itens completamente assistidos:
                MOVIE/EPISODE com registro direto de assistência e SERIES/SEASON com todos os episódios
                já lançados assistidos. Episódios futuros não impedem WATCHED; UNKNOWN não entra no
                numerador. 0.0 quando a lista não tem item de content.
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            likesCount: { type: integer }
            likedByMe: { type: boolean }
            itemsCount:
              type: integer
              format: int64
              description: Quantidade total de itens da lista completa, sem aplicar os filtros type/genre e sem ser reduzida à página atual.
            commentsCount: { type: integer }
            totalRuntimeMinutes: { type: integer, description: "Soma de runtimeMinutes dos itens MOVIE/EPISODE e exclusivamente de totalRuntimeMinutes persistido dos itens SERIES; itens de lista aninhada ficam de fora. A leitura usa somente valores locais persistidos." }
            itemScope:
              type: string
              nullable: true
              enum: [MOVIE_OR_SERIES, SEASON, EPISODE, LIST, MIXED]
            rank:
              type: integer
              nullable: true
            items:
              type: array
              description: >
                Em GET /lists/{listId}, itens da página atual depois da aplicação dos filtros
                type/genre e da ordenação. Em POST /users/me/lists/bulk, é o conjunto completo de
                itens criados, na ordem enviada.
              items: { $ref: "#/components/schemas/UserListItem" }
            itemsPage:
              type: integer
              description: Número da página retornada, com semântica 1-based.
            itemsSize:
              type: integer
              description: >
                Em GET /lists/{listId}, tamanho efetivo da página, após a aplicação do limite do
                escopo. Em POST /users/me/lists/bulk, é igual à quantidade de itens criados.
            itemsTotalElements:
              type: integer
              format: int64
              description: >
                Em GET /lists/{listId}, quantidade de itens da coleção filtrada, antes do recorte
                da página. Em POST /users/me/lists/bulk, é igual à quantidade de itens criados.
            itemsTotalPages:
              type: integer
              description: >
                Em GET /lists/{listId}, quantidade total de páginas da coleção filtrada; 0 quando
                não há itens filtrados. Em POST /users/me/lists/bulk, é 0 quando o conjunto criado
                está vazio e 1 caso contrário.
            itemsHasNext:
              type: boolean
              description: >
                Em GET /lists/{listId}, indica se existe outra página para a coleção filtrada. Em
                POST /users/me/lists/bulk, é sempre false.

    UserListProgress:
      type: object
      description: >
        Progresso dos itens de uma lista no escopo do viewer autenticado. O payload não inclui contentState:
        MOVIE e EPISODE expõem somente os agregados da lista; SERIES e SEASON recebem progresso detalhado.
      required: [id, name, visibility, totalItems, watchedItems, watchedPercentage, items]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        visibility: { type: string, enum: [PUBLIC, FOLLOWERS, PRIVATE] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        likesCount: { type: integer }
        likedByMe: { type: boolean }
        itemsCount: { type: integer }
        commentsCount: { type: integer }
        totalRuntimeMinutes: { type: integer }
        rank: { type: integer, nullable: true }
        itemScope:
          type: string
          nullable: true
          enum: [MOVIE_OR_SERIES, SEASON, EPISODE, LIST, MIXED]
        totalItems:
          type: integer
          format: int64
          description: Quantidade de itens de conteúdo da lista.
        watchedItems:
          type: integer
          format: int64
          description: Quantidade de itens completamente assistidos pelo viewer.
        watchedPercentage:
          type: number
          format: double
          description: watchedItems/totalItems; 0 quando não há itens de conteúdo.
        items:
          type: array
          items: { $ref: "#/components/schemas/UserListProgressItem" }

    UserListProgressItem:
      type: object
      description: >
        Item de conteúdo na posição original da lista. Não possui contentState. seriesProgress só é preenchido
        para SERIES; seasonProgress só é preenchido para SEASON.
      required: [id, content, position]
      properties:
        id: { type: string, format: uuid }
        content: { $ref: "#/components/schemas/ContentRef" }
        position: { type: integer }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        customPosterUrl: { type: string, format: uri, nullable: true }
        seriesProgress:
          allOf:
            - $ref: "#/components/schemas/SeriesInProgress"
          nullable: true
          description: Preenchido somente quando content.type = SERIES; inclui séries 0%, parciais e 100%.
        seasonProgress:
          allOf:
            - $ref: "#/components/schemas/UserListSeasonProgress"
          nullable: true
          description: Preenchido somente quando content.type = SEASON.

    UserListSeasonProgress:
      type: object
      properties:
        seasonNumber: { type: integer }
        watchedEpisodeCount: { type: integer, format: int64 }
        totalEpisodeCount: { type: integer, nullable: true }
        watchedPercentage: { type: number, format: double, nullable: true }
        watchedRuntimeMinutes: { type: integer, format: int64, nullable: true }
        remainingEpisodeCount: { type: integer, format: int64, nullable: true }
        remainingRuntimeMinutes: { type: integer, format: int64, nullable: true }

    UserListItem:
      type: object
      description: >
        content e childList são mutuamente exclusivos — exatamente um deles vem preenchido por item,
        nunca os dois. Sem score: a nota de um conteúdo é sempre a de DiaryEntry, não uma por item de
        lista.
      properties:
        id: { type: string, format: uuid }
        content:
          allOf:
            - $ref: "#/components/schemas/ContentRef"
          nullable: true
        childList:
          allOf:
            - $ref: "#/components/schemas/UserListPreview"
          nullable: true
        position: { type: integer }
        description: { type: string, nullable: true }
        customPosterUrl: { type: string, format: uri, maxLength: 2048, pattern: '^https://image\.tmdb\.org/t/p/w342/.+$', nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        contentState:
          allOf:
            - $ref: "#/components/schemas/ContentState"
          nullable: true
          description: >
            Estado calculado para o viewer autenticado quando o item contém content. É null quando
            o item contém childList, inclusive quando a lista aninhada não é visível ao viewer.
        episodeAverageRating:
          type: number
          format: double
          nullable: true
          description: >
            Média das notas de episódios dadas pelo dono da lista para o item SERIES, SEASON ou
            EPISODE. Só é preenchida quando o viewer pode ver as notas do perfil do dono (é o dono,
            o perfil é público ou o viewer é seguidor aceito); caso contrário é null. MOVIE, lista
            aninhada e item sem notas também retornam null.
        globalEpisodeAverageRating:
          type: number
          format: double
          nullable: true
          description: >
            Média das notas de episódios dadas por usuários com perfil público, no escopo do item
            SERIES, SEASON ou EPISODE. MOVIE, lista aninhada e item sem notas públicas retornam null.
        contentAverageRating:
          type: number
          format: double
          nullable: true
          description: >
            Média das notas dadas diretamente ao próprio Content por usuários com perfil público.
            Aplica-se a MOVIE, SERIES, SEASON e EPISODE; lista aninhada e item sem notas públicas
            retornam null.

    WatchStatus:
      type: string
      enum: [WATCHED, PARTIALLY_WATCHED, UNWATCHED, UNKNOWN]
      description: Estado de assistência resolvido no escopo do viewer. UNKNOWN indica que a agenda agregada não é completa o bastante para determinar a assistência.

    ReleaseStatus:
      type: string
      enum: [RELEASED, UPCOMING, UNKNOWN]
      description: Estado de lançamento derivado da data de lançamento disponível e da data atual do backend.

    ContentProductionStatus:
      type: string
      enum: [PRE_RELEASE, IN_PROGRESS, FINISHED, CANCELLED, UNKNOWN]
      description: Status de produção normalizado a partir do status externo do TMDB.

    ContentState:
      type: object
      required: [watchStatus, releaseStatus, productionStatus, watchedEpisodeCount, releasedEpisodeCount]
      description: >
        Estado calculado sob demanda para um item de content no escopo do viewer. Não é um snapshot
        persistido. Para MOVIE e EPISODE, os contadores de episódios são null. Para EPISODE,
        productionStatus também é null. Para SERIES e SEASON, uma agenda incompleta produz
        watchStatus UNKNOWN e mantém os dois contadores null.
      properties:
        watchStatus: { $ref: "#/components/schemas/WatchStatus" }
        releaseStatus: { $ref: "#/components/schemas/ReleaseStatus" }
        productionStatus:
          allOf:
            - $ref: "#/components/schemas/ContentProductionStatus"
          nullable: true
        watchedEpisodeCount:
          type: integer
          minimum: 0
          nullable: true
          description: Para SERIES e SEASON, quantidade distinta de episódios já lançados que o viewer assistiu.
        releasedEpisodeCount:
          type: integer
          minimum: 0
          nullable: true
          description: Para SERIES e SEASON, quantidade distinta de episódios regulares cuja data de lançamento já chegou.

    DiaryEntryCreation:
      type: object
      required: [content]
      description: >
        Logging, rating and reviewing a content are a single action — there is no separate
        rating/review resource. score and comment are optional per entry, so a user can log
        a watch without rating or reviewing it. A user's "current" rating for a content is
        the score of their most recently created diary entry for it, not an average — a
        rewatch with a different score simply supersedes the previous one.
      properties:
        content: { $ref: "#/components/schemas/ContentRefCreation" }
        comment: { type: string, nullable: true }
        score: { type: integer, minimum: 1, maximum: 10, nullable: true }
        watchedDate:
          type: string
          format: date
          nullable: true
          description: >
            Rejected with 400 if in the future. Should also not predate the content's release date
            (TMDB data, not stored locally) — this second rule is not validated server-side here (a
            single-entry write never calls TMDB), so it stays a client-side responsibility. See
            DiaryEntryBulkCreation.watchedDate for the SEASON/SERIES bulk path, which does validate
            it, since that path already calls TMDB anyway.
        isRewatch:
          type: boolean
          nullable: true
          default: false
          description: >
            Only affects the first log of a content, where it pushes watchNumber from 1 to 2
            ("I had already watched this before logging it in the app"). On every later log of
            the same content it is ignored, because MAX(watchNumber) + 1 is already >= 2. Not stored.
        watchedInTheater:
          type: boolean
          nullable: true
          description: Only allowed for content of type MOVIE — a non-null value for any other type returns 400.
        customPosterUrl: { type: string, format: uri, maxLength: 2048, pattern: '^https://image\.tmdb\.org/t/p/w342/.+$', nullable: true }
        watchedWith:
          type: array
          items: { type: string, format: uuid }
          maxItems: 20
          nullable: true
          description: >
            User ids of who this content was watched with. Each id must be a user the caller
            follows (Follower status ACCEPTED) — 400 otherwise — and cannot include the caller's
            own id. See DiaryEntry.watchedWith and business-rules.md § DiaryEntry.

    DiaryEntryBulkCreation:
      type: object
      required: [content]
      description: >
        Bulk logging of a complete season or series. Only supports SEASON and SERIES content types.
        Episodes are first filtered by an effective cutoff (watchedDate when supplied, otherwise
        today) — any episode whose TMDB air date is after that cutoff is excluded from the request
        entirely, never persisted. Among the remaining eligible episodes, the request resumes the
        lowest watchNumber pass that is not yet complete for all of them (filling only the missing
        episodes at that pass), or starts a fresh complete pass (one past the highest existing pass)
        when every existing pass is already complete — matching single-entry re-log semantics only in
        that outcome, not in general. finaleEpisodeNumber/finaleSeasonNumber/seasonFinaleEpisodeNumbers
        are all optional. Resolution order (see each field's own description below): an existing
        finale Content already known in the database wins only when it was actually released by the
        effective cutoff (or TMDB has no parseable air date for it at all) — a later real finale whose
        air date is still after the cutoff is left untouched, and the latest episode/season eligible by
        the cutoff is instead treated as a request-local historical boundary for this call only,
        without overwriting the real finale's stored metadata. Outside that historical case, the
        server tries to derive the value itself from TMDB first, and an explicit client value is used
        only as a fallback for when TMDB can't answer (an announced-but-unreleased season/series, or
        TMDB partially unavailable) — a client-supplied value never overrides a TMDB-derived one, even
        when they differ. When the fallback value is actually used, it's validated against the real
        episode/season count TMDB otherwise reports for that season/series (independent of air date)
        and rejected with 400 if it exceeds it — this closes a gap where an explicit value used to be
        trusted with no upper bound of its own. A season/series whose derivation would land on 0 (TMDB
        has no episode/season aired yet) AND has no explicit fallback value supplied still fails with
        400, same message as before this field became optional. Soft cap of 2000 episodes per
        request (summed across every season for SERIES) — a request above that is rejected with 400
        unless it matches TMDB's own reported episode count for the season/series (episodes()
        array length for a SEASON request, number_of_episodes for a SERIES request), in which case
        it is allowed through with no further cap, since a real, TMDB-verified show (e.g. a
        long-running soap opera) can genuinely exceed 2000 episodes. This only matters when
        finaleEpisodeNumber/seasonFinaleEpisodeNumbers are supplied explicitly above what TMDB's
        own aired-episode count would have derived — the server-derived case is always backed by
        real TMDB data already. runtimeMinutes is never accepted from the client in content (see
        ContentRefCreation) — for both SEASON and SERIES requests the server derives it from TMDB
        itself, one season at a time, from the same TmdbSeasonFullDetails call already made for
        finaleEpisodeNumber derivation and the watchedDate-vs-release-date check below, so this
        never costs an extra TMDB call beyond what the request already pays. Unlike every other
        runtimeMinutes-carrying call (single-entry POST /diary, POST /contents/reference), a
        divergent already-registered runtimeMinutes value on an episode is NOT rejected with 409
        here — it's overwritten with the TMDB-sourced value, since it's backend-derived rather than
        client-supplied. If TMDB is unavailable while fetching a season's own details, the whole
        request fails with 502 rather than logging with a guess, regardless of whether an explicit
        finaleEpisodeNumber/seasonFinaleEpisodeNumbers value was supplied for that season. The one
        narrow exception is finaleSeasonNumber's own TMDB lookup on a SERIES request (getTvFullDetails,
        used to find the series' latest aired season): if that specific call is unavailable but the
        client supplied an explicit finaleSeasonNumber, the request proceeds trusting it (with no upper
        bound to validate against, since no real season count is available) instead of failing —
        preserves resilience for a client that already knows the value, even though every other TMDB
        dependency in this same request (season details, runtimeMinutes) still fails hard with 502 if
        genuinely unavailable. content.genres/releaseYear/countries are never accepted from the
        client either (see ContentRefCreation) — rejected with 400 for a SEASON request (a season
        has no genre/year/country of its own in TMDB); for a SERIES request the server derives all
        three from TMDB itself, once per series (checking whether the shared SERIES Content already
        has them set before bothering to call TMDB at all, so this never costs more than one real
        TMDB call per series, ever, across every user). Unlike runtimeMinutes derivation, this is
        best-effort once the SERIES Content already exists: TMDB unavailable or a conflict against
        an already-registered value is silently skipped rather than surfaced as 502/409 — this
        metadata is an enrichment, never a reason to block logging the actual watch. The first time
        a given series' Content is created, the usual POST /contents/reference existence check
        still applies (404/502 possible), same as any other new MOVIE/SERIES reference.
      properties:
        content: { $ref: "#/components/schemas/ContentRefCreation" }
        watchedDate:
          type: string
          format: date
          nullable: true
          description: >
            Applied to all episodes logged in this bulk request. Rejected with 400 if in the
            future. Also acts as the effective cutoff for which episodes are eligible for this
            bulk call (see the schema-level description above) — when TMDB has parseable air
            dates for the season/series but none of them fall on or before this date (or today,
            when this field is omitted), the request is rejected with 400 ("No episodes in season
            X have been released by <cutoff>") rather than persisting nothing silently or logging
            future content.
        finaleEpisodeNumber:
          type: integer
          minimum: 1
          maximum: 2000
          nullable: true
          description: >
            SEASON only. If no existing finale episode Content exists (or it exists but was not yet
            released by the effective cutoff, see the schema-level description above), the server
            first tries to derive this from TMDB's season details as the count of episodes whose air
            date is not after the effective cutoff — the same rule underlying
            ContentDetailsDTO.seasons[].airedEpisodeCount when the cutoff is today, but stricter when
            watchedDate is in the past (never from seasons[].episodeCount, TMDB's total episode
            count, which can include unreleased episodes for a season still airing) —
            when TMDB can answer, this derived value is used and any value supplied here is ignored.
            An explicit value here is only used as a fallback when TMDB has no aired episode yet, and
            in that case it's validated against the season's real episode count as known by TMDB
            (episodes().size(), independent of air date) — a value exceeding it is rejected with 400.
            Values below 1 are also rejected with 400.
        finaleSeasonNumber:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: >
            SERIES only. If no existing finale season Content exists (or it exists but was not yet
            released by the effective cutoff, see the schema-level description above), the server
            first tries to derive this from TMDB's series details as the highest season number
            (excluding season 0/specials) whose air date is not after the effective cutoff — when TMDB
            can answer, this derived value
            is used and any value supplied here is ignored. An explicit value here is only used as a
            fallback when TMDB has no aired season yet (or its own lookup is unavailable — see the
            resilience note above), and in that case, if TMDB's real season count is known, it's
            validated against it (a value exceeding it is rejected with 400). Values below 1 are also
            rejected with 400.
        seasonFinaleEpisodeNumbers:
          type: object
          additionalProperties: { type: integer, minimum: 1, maximum: 2000 }
          nullable: true
          description: >
            SERIES only. Maps a season number (as a string key) to that season's finale episode
            number, for any season in the 1..finaleSeasonNumber range that has no known finale
            episode Content yet — e.g. `{"1": 10, "2": 8}`. A season already known in the database
            (isSeasonFinale = true on one of its episodes) ignores its entry here, if present; a
            season missing from this map (and with no known finale Content) is resolved from TMDB the
            same way finaleEpisodeNumber is for a SEASON bulk request — TMDB's own derivation takes
            priority, and an entry here is only used, and validated, as the same kind of fallback. A
            value below 1 is rejected with 400.
        watchedWith:
          type: array
          items: { type: string, format: uuid }
          maxItems: 20
          nullable: true
          description: >
            Same validation as DiaryEntryCreation.watchedWith, applied identically to every
            episode created by this bulk request — not per-episode. See DiaryEntry.watchedWith.

    DiaryEntryUpdate:
      type: object
      description: >
        Partial update for a diary entry. content is immutable after creation — a diary
        entry always refers to the content it was created for, so it isn't a field here;
        only comment, score, watchedDate, watchedInTheater and customPosterUrl
        can change. A null field means "leave unchanged".
      properties:
        comment: { type: string, nullable: true }
        score: { type: integer, minimum: 1, maximum: 10, nullable: true }
        watchedDate:
          type: string
          format: date
          nullable: true
          description: >
            Rejected with 400 if in the future. Should also not predate the content's release date
            (TMDB data, not stored locally) — this second rule is not validated server-side here (a
            single-entry write never calls TMDB), so it stays a client-side responsibility. See
            DiaryEntryBulkCreation.watchedDate for the SEASON/SERIES bulk path, which does validate
            it, since that path already calls TMDB anyway.
        watchedInTheater:
          type: boolean
          nullable: true
          description: Only allowed for content of type MOVIE — a non-null value for any other type returns 400.
        customPosterUrl: { type: string, format: uri, maxLength: 2048, pattern: '^https://image\.tmdb\.org/t/p/w342/.+$', nullable: true }
        watchedWith:
          type: array
          items: { type: string, format: uuid }
          maxItems: 20
          nullable: true
          description: >
            Same validation as DiaryEntryCreation.watchedWith. Null means "leave unchanged"; any
            list (including an empty one) replaces the current companions entirely.

    DiaryEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        content: { $ref: "#/components/schemas/ContentRef" }
        comment: { type: string, nullable: true }
        score: { type: integer, nullable: true }
        watchedDate: { type: string, format: date, nullable: true }
        watchNumber:
          type: integer
          description: How many times the user has logged this content (1 = first watch). Calculated server-side, never accepted on write.
        watchedInTheater: { type: boolean, nullable: true }
        customPosterUrl: { type: string, format: uri, nullable: true }
        autoGenerated:
          type: boolean
          description: True when this entry was created automatically because the user finished every episode of the season (or every season of the series), not by direct user action.
        ignore:
          type: boolean
          description: >
            True when this entry only exists as a mechanical stepping-stone toward a higher-level
            content type the user actually requested (an episode auto-logged while bulk-logging its
            season/series, or a season auto-completed while bulk-logging its series) — orthogonal to
            autoGenerated, which protects against cascade deletion, not feed visibility. GET /feed
            excludes entries with ignore = true; every other diary listing (GET /users/{id}/diary,
            episode-ratings, etc.) still shows them. Editing an entry (PATCH /diary/{id}) resets
            ignore to false, same as autoGenerated. See business-rules.md § DiaryEntry.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        likesCount: { type: integer, description: "Contador desnormalizado de curtidas (Like com log_id apontando pra este registro), mantido em conjunto com o insert/delete de Like — não é uma COUNT ao vivo por requisição." }
        likedByMe: { type: boolean, description: "Se o usuário autenticado que fez a requisição curtiu este registro de diário. Resolvido em lote (uma query indexada por user_id + IN dos ids da página) em GET /users/{id}/diary, e por uma checagem individual (mesma query, um único id) em PATCH /diary/{id}; sempre false em POST /diary e /diary/bulk (registro recém-criado)." }
        watchedWith:
          type: array
          items: { $ref: "#/components/schemas/UserPreviewDTO" }
          description: >
            Who this specific entry (this watchNumber pass) was watched with — never carries over
            to a rewatch. Empty for a directly-logged entry with no companions. For an
            auto-generated season/series completion entry, populated only when every one of its
            direct children (episodes for a season, seasons for a series) was watched with the
            exact same set of people (computed once, when the completion entry is created — never
            revisited later). No confirmation/notification flow: the tagged user is never asked
            and never sees the tag anywhere on their own profile/diary. See business-rules.md §
            DiaryEntry.

    DiarySeriesOption:
      type: object
      required: [seriesTmdbId, entriesCount]
      description: >
        A normalized diary series option. entriesCount includes SERIES, SEASON, and EPISODE
        rows and counts rewatches. The endpoint returns these options unpaginated, ordered
        by entriesCount descending, then title ascending, then seriesTmdbId ascending.
      properties:
        seriesTmdbId: { type: string }
        title: { type: string, nullable: true }
        entriesCount: { type: integer, format: int64, minimum: 1 }

    SeriesInProgress:
      type: object
      description: Progresso de uma série que o usuário começou mas ainda não completou.
      properties:
        seriesTmdbId: { type: string }
        maxSeasonNumber: { type: integer, description: Maior número de temporada com pelo menos um episódio assistido. }
        maxEpisodeNumber: { type: integer, description: Maior número de episódio assistido dentro de maxSeasonNumber. }
        lastWatchedDate: { type: string, format: date, description: Data (watchedDate, ou a data de criação do registro quando watchedDate não foi informado) do episódio mais recente assistido dessa série. }
        watchedEpisodeCount: { type: integer, description: "Quantidade de pares distintos seasonNumber+episodeNumber assistidos em temporadas regulares (seasonNumber > 0); rewatches do mesmo episódio e episódios da temporada 0 não aumentam a contagem." }
        totalEpisodeCount: { type: integer, nullable: true, description: "Soma dos episódios lançados das temporadas regulares do TMDB (seasonNumber > 0), com air_date válida até hoje; episódios futuros, sem data e da temporada 0 não entram; null quando não houver total lançado positivo." }
        watchedPercentage: { type: number, format: double, nullable: true, description: "min(100, watchedEpisodeCount * 100 / totalEpisodeCount); null quando não houver total lançado positivo informado pelo TMDB." }
        lastWatchedSeasonNumber: { type: integer, nullable: true }
        lastWatchedEpisodeNumber: { type: integer, nullable: true }
        watchedRuntimeMinutes: { type: integer, format: int64, nullable: true }
        totalReleasedEpisodeCount: { type: integer, nullable: true }
        totalKnownRuntime: { type: integer, nullable: true }
        lastReleasedEpisodeDate: { type: string, format: date, nullable: true }
        remainingEpisodeCount: { type: integer, format: int64, nullable: true }
        remainingRuntimeMinutes: { type: integer, format: int64, nullable: true }
        customPosterUrl:
          type: string
          format: uri
          nullable: true
          pattern: '^https://image\.tmdb\.org/t/p/w342/.+$'
          description: Poster customizado da serie no contexto do usuario consultado; null usa o poster do TMDB.
        seasonProgress:
          type: array
          description: "Progresso de cada temporada regular (seasonNumber > 0) com pelo menos um episódio lançado; a temporada 0 (Specials) nunca é incluída."
          items:
            type: object
            properties:
              seasonNumber: { type: integer, description: Número positivo da temporada. }
              watchedEpisodeCount: { type: integer, description: Episódios distintos assistidos pelo usuário nessa temporada. }
              totalEpisodeCount: { type: integer, description: Episódios da temporada com air_date válida até hoje. }
              watchedPercentage: { type: number, format: double, description: "min(100, watchedEpisodeCount * 100 / totalEpisodeCount)." }
              watchedRuntimeMinutes: { type: integer, format: int64, nullable: true }
              remainingEpisodeCount: { type: integer, format: int64, nullable: true }
              remainingRuntimeMinutes: { type: integer, format: int64, nullable: true }

    SeriesInProgressAggregate:
      type: object
      properties:
        totalSeriesCount: { type: integer, format: int64 }
        watchedEpisodeCount: { type: integer, format: int64 }
        totalReleasedEpisodeCount: { type: integer, format: int64 }
        remainingEpisodeCount: { type: integer, format: int64 }
        remainingRuntimeMinutes: { type: integer, format: int64, nullable: true }

    SeriesInProgressPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/SeriesInProgress" }
        page: { type: integer, description: Page number, 1-based. }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        hasNext: { type: boolean }
        aggregate: { $ref: "#/components/schemas/SeriesInProgressAggregate" }

    SeriesInProgressPreview:
      type: object
      description: Prévia de uma série em andamento usada por `summary/home`; não inclui o detalhamento por temporada.
      properties:
        seriesTmdbId: { type: string }
        maxSeasonNumber: { type: integer }
        maxEpisodeNumber: { type: integer }
        lastWatchedDate: { type: string, format: date }
        watchedEpisodeCount: { type: integer }
        totalEpisodeCount: { type: integer, nullable: true }
        watchedPercentage: { type: number, format: double, nullable: true }

    DiaryEntryCreationResult:
      type: object
      description: >
        Response envelope for POST /diary. Logging a single episode can cascade into
        auto-completing its season and/or series (see DiaryEntry.autoGenerated) — this
        envelope surfaces those auto-generated entries alongside the entry that was
        directly logged, so a client can tell from a single log call whether it also
        completed a season/series without a follow-up request.
      properties:
        entry: { $ref: "#/components/schemas/DiaryEntry" }
        completedSeason:
          allOf: [{ $ref: "#/components/schemas/DiaryEntry" }]
          nullable: true
          description: The auto-generated season entry, present only when logging this episode completed its season.
        completedSeries:
          allOf: [{ $ref: "#/components/schemas/DiaryEntry" }]
          nullable: true
          description: The auto-generated series entry, present only when logging this episode/season completed its series.

    DeletionImpactItem:
      type: object
      description: A diary entry that would be deleted if the queried entry is deleted (dry-run computation, no data actually deleted).
      properties:
        id: { type: string, format: uuid, description: "Id of the diary entry that would be deleted." }
        type: { type: string, enum: [MOVIE, SERIES, SEASON, EPISODE] }
        watchedDate: { type: string, format: date, nullable: true }
        watchNumber: { type: integer }
        autoGenerated:
          type: boolean
          description: >
            True when this entry was created automatically by the completion cascade. This — not hasReview —
            is the protection flag: an entry with autoGenerated = false is only removed when
            overrideProtectedEntries is true.
        hasReview:
          type: boolean
          description: >
            True when this entry has a comment or a score. It is a severity hint for the client (how much
            user-authored content is at stake), not the protection flag — a bare PATCH sets
            autoGenerated = false without adding a comment or score.

    DeletionImpact:
      type: object
      description: >
        Deletion-impact preview for a diary entry. Calling DELETE on this entry would trigger cascade deletions
        of season and series completion entries that depend on the entry being watched. This endpoint is a dry-run —
        it really runs the same delete path inside a transaction that is always rolled back, so the list matches
        exactly what a DELETE with the same overrideProtectedEntries value would remove, without persisting anything.
      properties:
        wouldDelete:
          type: array
          items: { $ref: "#/components/schemas/DeletionImpactItem" }
          description: >
            Diary entries that would be deleted as a cascade effect, in the order they would be deleted.
            The queried entry itself is always deleted and is not repeated in this list.

    Notification:
      type: object
      description: >
        Notificacoes do sistema usam content como referencia do conteudo afetado.
        Notificacoes sociais de curtida ou comentario deixam content nulo e usam
        targetType e targetId para identificar o alvo da interacao.
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [RELEASE, ANNOUNCED_DATE, CANCELLED, RENEWED, NEW_EPISODE, FOLLOWED_PERSON_NEW_CREDIT, LIKE_RECEIVED, COMMENT_RECEIVED]
        message: { type: string }
        content:
          allOf:
            - $ref: "#/components/schemas/ContentRef"
          nullable: true
          description: Nulo em notificacoes sociais; preenchido nas notificacoes do sistema.
        personTmdbId: { type: string, nullable: true, description: "Presente apenas quando type = FOLLOWED_PERSON_NEW_CREDIT." }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        latestActor:
          allOf:
            - $ref: "#/components/schemas/UserPreviewDTO"
          nullable: true
          description: Ultimo usuario que realizou a interacao; preenchido em notificacoes sociais.
        targetType:
          type: string
          nullable: true
          enum: [COMMENT, DIARY_ENTRY, DROPPED_ENTRY, USER_LIST, PICK, PICKS_TEMPLATE]
          description: Tipo do alvo da interacao; nulo em notificacoes do sistema.
        targetId:
          type: string
          format: uuid
          nullable: true
          description: ID do alvo da interacao; nulo em notificacoes do sistema.
        interactionCount:
          type: integer
          nullable: true
          minimum: 1
          description: Quantidade de interacoes agregadas enquanto a notificacao social permanece ativa.

    SearchResult:
      type: object
      properties:
        contents:
          type: array
          description: Resultado ao vivo do TMDB, com filmes e séries misturados.
          items: { $ref: "#/components/schemas/SearchContentDTO" }
        people:
          type: array
          description: Resultado ao vivo do TMDB
          items: { $ref: "#/components/schemas/SearchPersonDTO" }
        lists:
          type: array
          items: { $ref: "#/components/schemas/SearchUserListDTO" }
        users:
          type: array
          items: { $ref: "#/components/schemas/UserPreviewDTO" }
        templates:
          type: array
          description: Templates de Picks buscados localmente por nome; preenchido somente quando type = PICKS_TEMPLATE e nunca contendo Picks preenchidos.
          items: { $ref: "#/components/schemas/PicksTemplatePreview" }

    SearchContentDTO:
      type: object
      properties:
        tmdbId: { type: string }
        type: { type: string, enum: [MOVIE, SERIES] }
        title: { type: string }
        posterUrl:
          type: string
          format: uri
          nullable: true
          description: URL completa da imagem do poster no TMDB, usando o tamanho w500; null quando o TMDB não fornece poster_path.
        year: { type: integer, nullable: true }

    TrendingResponse:
      type: object
      required: [movies, series]
      description: >
        Agregado de filmes e series em alta. Cada array preserva a ordem do TMDB
        e pode ter menos itens que o tamanho solicitado.
      properties:
        movies:
          type: array
          items: { $ref: "#/components/schemas/SearchContentDTO" }
        series:
          type: array
          items: { $ref: "#/components/schemas/SearchContentDTO" }

    SearchPersonDTO:
      type: object
      properties:
        tmdbId: { type: string }
        name: { type: string }
        photo:
          type: string
          format: uri
          nullable: true
          description: URL completa da foto no TMDB, usando o tamanho w185; null quando o TMDB não fornece profile_path.

    PersonResponseDTO:
      type: object
      required: [person, progress, credits]
      properties:
        person: { $ref: "#/components/schemas/PersonDetailsDTO" }
        progress: { $ref: "#/components/schemas/PersonProgressDTO" }
        credits:
          type: object
          required: [content, page, size, totalElements, totalPages, hasNext]
          properties:
            content:
              type: array
              items: { $ref: "#/components/schemas/PersonCreditDTO" }
            page:
              type: integer
              description: 1-based response page; request page=0 is normalized to 1.
            size: { type: integer }
            totalElements: { type: integer, format: int64 }
            totalPages: { type: integer }
            hasNext: { type: boolean }

    PersonDetailsDTO:
      type: object
      properties:
        tmdbId: { type: string }
        name: { type: string, nullable: true }
        biography: { type: string, nullable: true }
        birthday: { type: string, nullable: true, description: Date in the format returned by TMDB. }
        deathday: { type: string, nullable: true, description: Date in the format returned by TMDB. }
        placeOfBirth: { type: string, nullable: true }
        gender: { type: string, nullable: true, description: Textual value returned by TMDB. }
        profileUrl: { type: string, format: uri, nullable: true }
        knownForDepartment: { type: string, nullable: true }
        alsoKnownAs:
          type: array
          items: { type: string }
        isFollowing: { type: boolean }

    PersonProgressDTO:
      type: object
      required: [totalCredits, watchedCredits, watchedPercentage]
      properties:
        totalCredits:
          type: integer
          description: Distinct MOVIE/SERIES credits from the complete normalized filmography, before filtering and pagination.
        watchedCredits:
          type: integer
          description: Distinct filmography credits watched by the authenticated viewer.
        watchedPercentage:
          type: number
          format: double
          description: watchedCredits/totalCredits for the complete filmography; 0 when there are no credits.

    PersonCreditDTO:
      type: object
      required: [tmdbId, type, characters, jobs, participation, isWatched, isInList]
      properties:
        tmdbId: { type: string }
        type: { type: string, enum: [MOVIE, SERIES] }
        title: { type: string, nullable: true }
        posterUrl: { type: string, format: uri, nullable: true }
        releaseDate: { type: string, format: date, nullable: true }
        characters:
          type: array
          items: { type: string }
          description: Cast characters merged for this movie or series.
        jobs:
          type: array
          items: { type: string }
          description: Crew jobs merged for this movie or series.
        participation: { type: string, enum: [ALL, CAST, CREW] }
        isWatched:
          type: boolean
          description: True when the viewer has a DiaryEntry for the movie or for the series, season, or episode.
        isInList:
          type: boolean
          description: True when the viewer has a direct MOVIE or SERIES UserListItem, including through child-list containment; season and episode list items do not count.

    SearchUserListDTO:
      type: object
      properties:
        id: { type: string, format: uuid }
        user: { $ref: "#/components/schemas/UserPreviewDTO" }
        name: { type: string }
        previewItems:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/ContentRef" }
        nestedListsCount:
          type: integer
          description: Quantidade de listas aninhadas; quando for maior que zero, previewItems vem vazio.

    CalendarResponse:
      type: object
      required: [month, region, events]
      properties:
        month: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        region: { type: string, pattern: '^[A-Z]{2}$' }
        events:
          type: array
          items: { $ref: "#/components/schemas/CalendarEvent" }

    CalendarEvent:
      oneOf:
        - $ref: "#/components/schemas/CalendarMovieEvent"
        - $ref: "#/components/schemas/CalendarEpisodeEvent"
        - $ref: "#/components/schemas/CalendarSeasonEvent"
        - $ref: "#/components/schemas/CalendarSeriesEvent"
      discriminator:
        propertyName: eventType
        mapping:
          MOVIE: "#/components/schemas/CalendarMovieEvent"
          EPISODE: "#/components/schemas/CalendarEpisodeEvent"
          SEASON: "#/components/schemas/CalendarSeasonEvent"
          SERIES: "#/components/schemas/CalendarSeriesEvent"

    CalendarEventCommon:
      type: object
      required: [date, releaseStatus, watchStatus, sources]
      properties:
        date: { type: string, format: date }
        releaseStatus: { type: string, enum: [RELEASED, UPCOMING] }
        watchStatus: { type: string, enum: [WATCHED, UNWATCHED, PARTIALLY_WATCHED] }
        sources:
          type: array
          uniqueItems: true
          items: { type: string, enum: [IN_PROGRESS, WATCHLIST] }

    CalendarMovieEvent:
      allOf:
        - $ref: "#/components/schemas/CalendarEventCommon"
        - type: object
          required: [eventType, content]
          properties:
            eventType: { type: string, enum: [MOVIE] }
            content: { $ref: "#/components/schemas/CalendarMovieContent" }

    CalendarEpisodeEvent:
      allOf:
        - $ref: "#/components/schemas/CalendarEventCommon"
        - type: object
          required: [eventType, content]
          properties:
            eventType: { type: string, enum: [EPISODE] }
            content: { $ref: "#/components/schemas/CalendarEpisodeContent" }

    CalendarSeasonEvent:
      allOf:
        - $ref: "#/components/schemas/CalendarEventCommon"
        - type: object
          required: [eventType, content]
          properties:
            eventType: { type: string, enum: [SEASON] }
            content: { $ref: "#/components/schemas/CalendarSeasonContent" }

    CalendarSeriesEvent:
      allOf:
        - $ref: "#/components/schemas/CalendarEventCommon"
        - type: object
          required: [eventType, content]
          properties:
            eventType: { type: string, enum: [SERIES] }
            content: { $ref: "#/components/schemas/CalendarSeriesContent" }

    CalendarMovieContent:
      type: object
      additionalProperties: false
      required: [tmdbId, title]
      properties:
        tmdbId: { type: string }
        title: { type: string }
        posterPath: { type: string, nullable: true }

    CalendarEpisodeContent:
      type: object
      additionalProperties: false
      required: [seriesTmdbId, seasonNumber, episodeNumber, title, seriesTitle]
      properties:
        seriesTmdbId: { type: string }
        seasonNumber: { type: integer, minimum: 1 }
        episodeNumber: { type: integer, minimum: 1 }
        title: { type: string }
        seriesTitle: { type: string }
        posterPath: { type: string, nullable: true }
        stillPath: { type: string, nullable: true }

    CalendarSeasonContent:
      type: object
      additionalProperties: false
      required: [seriesTmdbId, seasonNumber, episodeCount, title]
      properties:
        seriesTmdbId: { type: string }
        seasonNumber: { type: integer, minimum: 1 }
        episodeCount: { type: integer, minimum: 0 }
        title: { type: string }
        posterPath: { type: string, nullable: true }

    CalendarSeriesContent:
      type: object
      additionalProperties: false
      required: [seriesTmdbId, episodeCount, title]
      properties:
        seriesTmdbId: { type: string }
        episodeCount: { type: integer, minimum: 0 }
        title: { type: string }
        posterPath: { type: string, nullable: true }

    PicksTemplateCreation:
      type: object
      required: [name, categories]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, nullable: true }
        coverImage: { type: string, format: uri, maxLength: 2048, nullable: true }
        instructions: { type: string, nullable: true }
        eligibilityStartDate: { type: string, format: date, nullable: true }
        eligibilityEndDate: { type: string, format: date, nullable: true }
        categories:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PicksTemplateCategoryCreation" }
      description: As datas devem ser ambas ausentes ou ambas presentes em ordem crescente; o período é global para todas as categorias de conteúdo e é ignorado por PERSON.

    PicksTemplatePatch:
      type: object
      properties:
        name: { type: string, maxLength: 120, nullable: true }
        description: { type: string, nullable: true }
        coverImage: { type: string, format: uri, maxLength: 2048, nullable: true }
        instructions: { type: string, nullable: true }
        eligibilityStartDate: { type: string, format: date, nullable: true }
        eligibilityEndDate: { type: string, format: date, nullable: true }
        clearEligibilityPeriod: { type: boolean, nullable: true }
      description: clearEligibilityPeriod=true exige as duas datas ausentes; sem essa flag, uma alteração de período exige as duas datas ordenadas.

    PicksTemplatePreview:
      type: object
      properties:
        id: { type: string, format: uuid }
        creator: { $ref: "#/components/schemas/UserPreviewDTO", nullable: true }
        origin: { type: string, enum: [OFFICIAL, COMMUNITY] }
        name: { type: string }
        description: { type: string, nullable: true }
        coverImage: { type: string, format: uri, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        picksCount: { type: integer, format: int64, description: Picks visíveis para o viewer atual. }
        categoriesCount: { type: integer, format: int64 }
        categoryNames:
          type: array
          items: { type: string }
        likesCount: { type: integer }
        commentsCount: { type: integer, format: int64 }
        recentComments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
          description: >
            Up to three most recent comments of this template (createdAt desc, id desc). Populated only
            inside GET /feed items; an empty array everywhere else.
        isLikedByViewer: { type: boolean }
        myPicksCount: { type: integer, format: int64 }
        latestMyPickId: { type: string, format: uuid, nullable: true }

    PicksTemplate:
      allOf:
        - $ref: "#/components/schemas/PicksTemplatePreview"
        - type: object
          properties:
            creator:
              allOf: [{ $ref: "#/components/schemas/UserPreviewDTO" }]
              nullable: true
              description: Nulo quando o creator foi desvinculado depois que o template recebeu Picks.
            instructions: { type: string, nullable: true }
            eligibilityStartDate: { type: string, format: date, nullable: true }
            eligibilityEndDate: { type: string, format: date, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            categories:
              type: array
              items: { $ref: "#/components/schemas/PicksTemplateCategory" }

    PicksTemplateCategoryCreation:
      type: object
      required: [name, group, displayOrder, allowedType, optionMode]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, nullable: true }
        group: { type: string, enum: [PRIMARY, SECONDARY] }
        displayOrder: { type: integer, minimum: 1 }
        allowedType: { type: string, enum: [MOVIE, SERIES, EPISODE, PERSON] }
        optionMode: { type: string, enum: [OPEN, FIXED] }
        options:
          type: array
          items: { $ref: "#/components/schemas/PicksTemplateOptionCreation" }
      description: OPEN não aceita opções fixas; FIXED pode ter zero opções e continua distinto de OPEN.

    PicksTemplateCategoryPatch:
      type: object
      properties:
        name: { type: string, maxLength: 120, nullable: true }
        description: { type: string, nullable: true }
        group: { type: string, enum: [PRIMARY, SECONDARY], nullable: true }
        displayOrder: { type: integer, minimum: 1, nullable: true }
        allowedType: { type: string, enum: [MOVIE, SERIES, EPISODE, PERSON], nullable: true }
        optionMode: { type: string, enum: [OPEN, FIXED], nullable: true }

    PicksTemplateCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        group: { type: string, enum: [PRIMARY, SECONDARY] }
        displayOrder: { type: integer }
        allowedType: { type: string, enum: [MOVIE, SERIES, EPISODE, PERSON] }
        optionMode: { type: string, enum: [OPEN, FIXED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        options:
          type: array
          items: { $ref: "#/components/schemas/PicksTemplateOption" }

    PicksTemplateOptionCreation:
      type: object
      required: [target]
      properties:
        target: { $ref: "#/components/schemas/PickTarget" }

    PicksTemplateOption:
      type: object
      properties:
        id: { type: string, format: uuid }
        target: { $ref: "#/components/schemas/PickOptionSearch" }
        createdAt: { type: string, format: date-time }

    PickContentTarget:
      type: object
      properties:
        type: { type: string, enum: [MOVIE, SERIES, EPISODE] }
        tmdbId: { type: string, nullable: true }
        seriesTmdbId: { type: string, nullable: true }
        seasonNumber: { type: integer, minimum: 0, nullable: true }
        episodeNumber: { type: integer, minimum: 1, nullable: true }
      description: type identifica somente conteúdo MOVIE, SERIES ou EPISODE; PERSON é representado por personTmdbId em PickTarget e SEASON não é aceito como alvo de Picks.

    PickTarget:
      type: object
      properties:
        content: { $ref: "#/components/schemas/PickContentTarget" }
        personTmdbId: { type: string, pattern: '^[0-9]+$', nullable: true }
        contextContent: { $ref: "#/components/schemas/PickContentTarget" }
      description: O alvo é exatamente um conteúdo ou uma pessoa. contextContent só pode acompanhar uma pessoa.

    PickOptionSearch:
      type: object
      properties:
        id: { type: string, format: uuid, nullable: true }
        content:
          allOf: [{ $ref: "#/components/schemas/ContentRef" }]
          nullable: true
        personTmdbId: { type: string, nullable: true }
        contextContent:
          allOf: [{ $ref: "#/components/schemas/ContentRef" }]
          nullable: true

    PickSelectionCreation:
      type: object
      required: [categoryId, target]
      properties:
        categoryId: { type: string, format: uuid }
        target: { $ref: "#/components/schemas/PickTarget" }

    PickCreation:
      type: object
      required: [selections]
      properties:
        visibility: { type: string, enum: [PUBLIC, FOLLOWERS, PRIVATE], nullable: true, default: PUBLIC }
        selections:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PickSelectionCreation" }
      description: Não pode ser vazio e não pode repetir categoryId. Não há unicidade entre usuário e template.

    PickPatch:
      type: object
      properties:
        visibility: { type: string, enum: [PUBLIC, FOLLOWERS, PRIVATE], nullable: true }

    PickSelection:
      type: object
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        target: { $ref: "#/components/schemas/PickOptionSearch" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        isValid: { type: boolean, description: Revalidado na leitura contra estrutura e TMDB atuais. }

    Pick:
      type: object
      properties:
        id: { type: string, format: uuid }
        picksTemplate: { $ref: "#/components/schemas/PicksTemplatePreview" }
        userId: { type: string, format: uuid }
        visibility: { type: string, enum: [PUBLIC, FOLLOWERS, PRIVATE] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        progress: { type: string, enum: [EMPTY, PARTIAL, COMPLETE] }
        likesCount: { type: integer }
        commentsCount: { type: integer, format: int64 }
        isLikedByViewer: { type: boolean }
        selections:
          type: array
          items: { $ref: "#/components/schemas/PickSelection" }

    PicksTemplatePreviewPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            content:
              type: array
              items: { $ref: "#/components/schemas/PicksTemplatePreview" }

    PickOptionSearchPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            content:
              type: array
              items: { $ref: "#/components/schemas/PickOptionSearch" }

    PickAnsweredCategoryPreview:
      type: object
      properties:
        categoryId: { type: string, format: uuid }
        name: { type: string }
        group: { type: string, enum: [PRIMARY, SECONDARY] }
        displayOrder: { type: integer }
        target: { $ref: "#/components/schemas/PickOptionSearch" }
        isValid: { type: boolean, description: Structural preview validation; full Pick reads revalidate current TMDB state. }

    PickPreview:
      type: object
      properties:
        id: { type: string, format: uuid }
        user: { $ref: "#/components/schemas/UserPreviewDTO" }
        visibility: { type: string, enum: [PUBLIC, FOLLOWERS, PRIVATE] }
        createdAt: { type: string, format: date-time }
        likesCount: { type: integer }
        commentsCount: { type: integer, format: int64 }
        recentComments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
          description: >
            Up to three most recent comments of this Pick (createdAt desc, id desc). Populated only
            inside GET /feed items; an empty array everywhere else.
        isLikedByViewer: { type: boolean }
        answeredCategories:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/PickAnsweredCategoryPreview" }

    PickPreviewPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            content:
              type: array
              items: { $ref: "#/components/schemas/PickPreview" }

    PickPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            content:
              type: array
              items: { $ref: "#/components/schemas/Pick" }

    DailyGameType:
      type: string
      description: >
        Modalidade diária. MOVIE_BY_POSTER, SERIES_BY_POSTER e PERSON_BY_FACE têm 6 tentativas;
        EPISODE_BY_FRAME tem 6 tentativas; MOVIE_BY_INFO, SERIES_BY_INFO, ACTOR_BY_MOVIE_FILMOGRAPHY e
        ACTOR_BY_SERIES_FILMOGRAPHY têm 10.
      enum:
        - MOVIE_BY_POSTER
        - SERIES_BY_POSTER
        - PERSON_BY_FACE
        - EPISODE_BY_FRAME
        - MOVIE_BY_INFO
        - SERIES_BY_INFO
        - ACTOR_BY_MOVIE_FILMOGRAPHY
        - ACTOR_BY_SERIES_FILMOGRAPHY

    DailyGameTargetKind:
      type: string
      enum: [MOVIE, SERIES, PERSON, EPISODE]

    DailyGameViewStatus:
      type: string
      description: NOT_PLAYED existe na visão do dia e no histórico quando não há resultado do usuário.
      enum: [NOT_PLAYED, IN_PROGRESS, COMPLETED, FAILED]

    DailyGameAttemptRequest:
      type: object
      description: >
        Identidade do candidato escolhido. Envie somente o campo ou conjunto de campos compatível com o
        alvo da modalidade: tmdbId para MOVIE/SERIES, personTmdbId para PERSON e
        seriesTmdbId + seasonNumber + episodeNumber para EPISODE. IDs são numéricos positivos.
      properties:
        tmdbId: { type: string, nullable: true, pattern: '^[1-9][0-9]*$' }
        personTmdbId: { type: string, nullable: true, pattern: '^[1-9][0-9]*$' }
        seriesTmdbId: { type: string, nullable: true, pattern: '^[1-9][0-9]*$' }
        seasonNumber: { type: integer, nullable: true, minimum: 1 }
        episodeNumber: { type: integer, nullable: true, minimum: 1 }
        shareOnCompletion:
          type: boolean
          nullable: true
          description: Toggle persistido enquanto o jogo está aberto; omitido preserva a preferência anterior.

    DailyGameHintDTO:
      type: object
      properties:
        position: { type: integer, minimum: 1 }
        hintType: { type: string }
        hintValue: { type: string }

    DailyGameAnswerDTO:
      type: object
      description: >
        Resposta congelada. tmdbId é usado por MOVIE/SERIES, personTmdbId por PERSON e
        seriesTmdbId + seasonNumber + episodeNumber por EPISODE; os demais campos ficam nulos conforme o alvo.
        O objeto só é revelado em respostas terminais. `imageUrl` permanece nulo para os jogos de
        filmografia de atores, inclusive em estados terminais. Para EPISODE, seriesName, seriesPosterUrl e
        seriesYear descrevem a série de origem congelada no desafio.
      properties:
        targetKind: { $ref: "#/components/schemas/DailyGameTargetKind" }
        tmdbId: { type: string, nullable: true }
        personTmdbId: { type: string, nullable: true }
        seriesTmdbId: { type: string, nullable: true }
        seasonNumber: { type: integer, nullable: true }
        episodeNumber: { type: integer, nullable: true }
        title: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true, format: uri }
        seriesName: { type: string, nullable: true }
        seriesPosterUrl: { type: string, nullable: true, format: uri }
        seriesYear: { type: integer, nullable: true }

    DailyGameResultPreviewDTO:
      type: object
      description: >
        Preview congelado de um resultado terminal publicado no feed. O answer vem do snapshot do
        desafio e não dispara chamadas ao TMDB durante a leitura do feed.
      properties:
        challengeDate: { type: string, format: date }
        gameType: { $ref: "#/components/schemas/DailyGameType" }
        targetKind: { $ref: "#/components/schemas/DailyGameTargetKind" }
        maxAttempts: { type: integer }
        status: { $ref: "#/components/schemas/DailyGameViewStatus" }
        attemptsUsed: { type: integer }
        score: { type: integer }
        answer: { $ref: "#/components/schemas/DailyGameAnswerDTO" }

    DailyGameStateDTO:
      type: object
      description: >
        Estado de uma modalidade em GET /games/today ou GET /games/{challengeDate}. Enquanto o jogo estiver
        aberto, answer é redigido e imageUrls não é liberado. Em MOVIE_BY_INFO, SERIES_BY_INFO, ACTOR_BY_MOVIE_FILMOGRAPHY
        e ACTOR_BY_SERIES_FILMOGRAPHY, imageUrl é null e visibleImageUrls é um array vazio enquanto o jogo
        estiver aberto; em um estado terminal, answer pode revelar a imagem congelada. Nos jogos de filmografia
        de atores, a foto do ator permanece omitida enquanto aberto e é liberada no estado terminal.
        Os jogos de informação
        também não expõem hints. As comparações são entregues em attempts[].infoFeedback
        quando attempts está disponível. visibleImageUrls contém a imagem atual e as imagens já exibidas,
        na ordem do jogo, nas modalidades que as expõem. O estado NOT_PLAYED não cria resultado persistido.
        `attempts` e `filmography` são projetados nas leituras do dia; leituras históricas não expõem detalhes
        transitórios de tentativas.
      properties:
        gameType: { $ref: "#/components/schemas/DailyGameType" }
        targetKind: { $ref: "#/components/schemas/DailyGameTargetKind" }
        maxAttempts: { type: integer }
        attemptsUsed: { type: integer }
        attemptsRemaining: { type: integer }
        status: { $ref: "#/components/schemas/DailyGameViewStatus" }
        imageUrl: { type: string, nullable: true, format: uri }
        visibleImageUrls:
          type: array
          items: { type: string, format: uri }
        imageUrls:
          type: array
          nullable: true
          description: Todas as imagens; preenchido somente para vitória COMPLETED do próprio usuário.
          items: { type: string, format: uri }
        hints:
          type: array
          description: Vazio em MOVIE_BY_INFO e SERIES_BY_INFO, inclusive quando existem pistas legadas persistidas.
          items: { $ref: "#/components/schemas/DailyGameHintDTO" }
        score: { type: integer }
        completedAt: { type: string, format: date-time, nullable: true }
        answer: { $ref: "#/components/schemas/DailyGameAnswerDTO", nullable: true }
        attempts:
          type: array
          nullable: true
          description: Tentativas decodificadas do resultado do dia; nulo em leituras históricas ou quando não há detalhes disponíveis.
          items: { $ref: "#/components/schemas/DailyGameAttemptDTO" }
        filmography:
          allOf: [{ $ref: "#/components/schemas/DailyGameFilmographyStateDTO" }]
          nullable: true
        shareOnCompletion: { type: boolean, description: Preferência atual de compartilhar quando o resultado se tornar terminal. }
        sharedToFeed: { type: boolean, description: True quando o resultado terminal já foi publicado permanentemente no feed. }

    DailyGameTodayResponseDTO:
      type: object
      properties:
        date: { type: string, format: date }
        games:
          type: array
          minItems: 8
          maxItems: 8
          items: { $ref: "#/components/schemas/DailyGameStateDTO" }

    DailyGameAttemptResponseDTO:
      type: object
      description: >
        Mesmo estado de jogo devolvido após uma tentativa. Uma tentativa inválida não é consumida.
        Em MOVIE_BY_INFO, SERIES_BY_INFO, ACTOR_BY_MOVIE_FILMOGRAPHY e ACTOR_BY_SERIES_FILMOGRAPHY, um jogo aberto retorna
        imageUrl null e visibleImageUrls vazio; quando o resultado se torna terminal, answer pode revelar a
        imagem congelada somente nas modalidades que possuem imagem de resposta. Nos jogos de filmografia de
        atores, a foto do ator permanece omitida enquanto aberto e é liberada no estado terminal. Os jogos MOVIE_BY_INFO e SERIES_BY_INFO retornam hints vazio,
        e as comparações de
        informação são entregues em attempts[].infoFeedback e currentAttempt.infoFeedback. visibleImageUrls
        mantém as posições já mostradas nas modalidades que as expõem. `attempts` contém os detalhes tipados
        das tentativas do dia. Em EPISODE_BY_FRAME, `imageUrls` só aparece após uma vitória exata.
      properties:
        gameType: { $ref: "#/components/schemas/DailyGameType" }
        targetKind: { $ref: "#/components/schemas/DailyGameTargetKind" }
        maxAttempts: { type: integer }
        attemptsUsed: { type: integer }
        attemptsRemaining: { type: integer }
        status: { $ref: "#/components/schemas/DailyGameViewStatus" }
        imageUrl: { type: string, nullable: true, format: uri }
        visibleImageUrls:
          type: array
          items: { type: string, format: uri }
        imageUrls:
          type: array
          nullable: true
          items: { type: string, format: uri }
        hints:
          type: array
          description: Vazio em MOVIE_BY_INFO e SERIES_BY_INFO, inclusive quando existem pistas legadas persistidas.
          items: { $ref: "#/components/schemas/DailyGameHintDTO" }
        score: { type: integer }
        completedAt: { type: string, format: date-time, nullable: true }
        answer: { $ref: "#/components/schemas/DailyGameAnswerDTO", nullable: true }
        attempts:
          type: array
          nullable: true
          description: Detalhes tipados das tentativas do dia; não é histórico de datas passadas.
          items: { $ref: "#/components/schemas/DailyGameAttemptDTO" }
        currentAttempt:
          allOf: [{ $ref: "#/components/schemas/DailyGameAttemptDTO" }]
          nullable: true
          description: Tentativa submetida nesta requisição; também disponível ao jogar um desafio histórico.
        filmography:
          allOf: [{ $ref: "#/components/schemas/DailyGameFilmographyStateDTO" }]
          nullable: true
        guessFeedback: { $ref: "#/components/schemas/DailyGameGuessFeedbackDTO", nullable: true }
        shareOnCompletion: { type: boolean, description: Preferência atual de compartilhar quando o resultado se tornar terminal. }
        sharedToFeed: { type: boolean, description: True quando o resultado terminal já foi publicado permanentemente no feed. }

    DailyGameHistoryDTO:
      type: object
      description: >
        Estado de um desafio anterior ao dia GMT atual. answer só é revelado para status COMPLETED ou FAILED;
        permanece nulo para NOT_PLAYED e IN_PROGRESS, permitindo jogar a data sem vazamento da resposta.
      properties:
        challengeDate: { type: string, format: date }
        gameType: { $ref: "#/components/schemas/DailyGameType" }
        targetKind: { $ref: "#/components/schemas/DailyGameTargetKind" }
        maxAttempts: { type: integer }
        status: { $ref: "#/components/schemas/DailyGameViewStatus" }
        attemptsUsed: { type: integer }
        score: { type: integer }
        completedAt: { type: string, format: date-time, nullable: true }
        answer: { $ref: "#/components/schemas/DailyGameAnswerDTO" }
        sharedToFeed: { type: boolean, description: True quando o resultado terminal foi publicado permanentemente no feed. }

    DailyGameAttemptDTO:
      type: object
      description: Detalhes tipados de uma tentativa do dia, preservados somente enquanto o desafio pertence à data GMT atual.
      properties:
        attemptNumber: { type: integer, minimum: 1 }
        candidate: { $ref: "#/components/schemas/DailyGameCandidateDTO" }
        episodeFeedback: { $ref: "#/components/schemas/DailyGameGuessFeedbackDTO", nullable: true }
        infoFeedback: { $ref: "#/components/schemas/DailyGameInfoFeedbackDTO", nullable: true }
        filmographyFeedback: { $ref: "#/components/schemas/DailyGameFilmographyFeedbackDTO", nullable: true }

    DailyGameCandidateDTO:
      type: object
      description: Identidade e metadados do candidato validados no TMDB e armazenados nos detalhes transitórios atuais; os metadados permitem renderizar tentativas recarregadas.
      properties:
        targetKind: { $ref: "#/components/schemas/DailyGameTargetKind" }
        tmdbId: { type: string, nullable: true }
        personTmdbId: { type: string, nullable: true }
        seriesTmdbId: { type: string, nullable: true }
        seasonNumber: { type: integer, nullable: true }
        episodeNumber: { type: integer, nullable: true }
        title: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true, format: uri }
        date: { type: string, format: date, nullable: true }

    DailyGameComparisonStatus:
      type: string
      enum: [MATCH, PARTIAL, NO_MATCH, NO_DATA]

    DailyGameComparisonDirection:
      type: string
      enum: [SECRET_HIGHER, SECRET_LOWER]

    DailyGameComparisonCellDTO:
      type: object
      description: >
        Comparação de um campo do jogo de informação. `NO_DATA` indica que o snapshot secreto ou o
        candidato não possui o dado; `displayValue` mostra apenas o valor do candidato.
      properties:
        status: { $ref: "#/components/schemas/DailyGameComparisonStatus" }
        direction: { $ref: "#/components/schemas/DailyGameComparisonDirection", nullable: true }
        displayValue: { nullable: true }
        matchedValues:
          type: array
          items: { type: string }
        matchCount: { type: integer, nullable: true }

    DailyGameInfoFeedbackDTO:
      type: object
      description: >
        Feedback do candidato nos jogos MOVIE_BY_INFO e SERIES_BY_INFO. Listas exigem igualdade para
        MATCH e sobreposição não vazia para PARTIAL; elenco só atinge MATCH com pelo menos três nomes
        coincidentes. Campos escalares exigem igualdade. Ano é PARTIAL quando difere por um; receita é
        MATCH até 10% e PARTIAL até 30% de diferença; temporadas exigem igualdade exata. O elenco do
        candidato é limitado aos dez primeiros nomes recebidos do TMDB, preservando a ordem. NO_DATA
        significa que o snapshot secreto ou o candidato não tem dado comparável.
      properties:
        platforms: { $ref: "#/components/schemas/DailyGameComparisonCellDTO" }
        genres: { $ref: "#/components/schemas/DailyGameComparisonCellDTO" }
        year: { $ref: "#/components/schemas/DailyGameComparisonCellDTO" }
        certification: { $ref: "#/components/schemas/DailyGameComparisonCellDTO" }
        directorOrCreators: { $ref: "#/components/schemas/DailyGameComparisonCellDTO" }
        cast: { $ref: "#/components/schemas/DailyGameComparisonCellDTO" }
        productionCompanies: { $ref: "#/components/schemas/DailyGameComparisonCellDTO" }
        revenueOrSeasons: { $ref: "#/components/schemas/DailyGameComparisonCellDTO" }

    DailyGameActorGuessDTO:
      type: object
      properties:
        personTmdbId: { type: string }
        name: { type: string }

    DailyGameFilmographyEntryDTO:
      type: object
      description: >
        Obra da filmografia congelada, ordenada por ano decrescente. Enquanto o jogo está aberto, o título
        permanece nulo quando a obra não foi revelada pela interseção. A entrada expõe somente título, ano,
        gêneros e episodeCount para séries; imagens das obras não são retornadas, e period/character ficam nulos.
      properties:
        workId: { type: string }
        title: { type: string, nullable: true }
        revealed: { type: boolean }
        highlighted: { type: boolean }
        year: { type: integer, nullable: true }
        genres:
          type: array
          items: { type: string }
        posterUrl: { type: string, nullable: true, format: uri, description: "Sempre nulo nos jogos de filmografia; mantido por compatibilidade de contrato." }
        episodeCount: { type: integer, nullable: true }
        period: { type: string, nullable: true, description: "Sempre nulo na projeção dos jogos de filmografia." }
        character: { type: string, nullable: true, description: "Sempre nulo na projeção dos jogos de filmografia." }

    DailyGameFilmographyFeedbackDTO:
      type: object
      description: Feedback da interseção entre o ator escolhido e o ator secreto; as duas listas de chaves permitem reprojectar Major roles sem nova consulta.
      properties:
        guessedActor: { $ref: "#/components/schemas/DailyGameActorGuessDTO", nullable: true }
        sharedMajorRoleWorkKeys:
          type: array
          items: { type: string }
        sharedAllRoleWorkKeys:
          type: array
          items: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/DailyGameFilmographyEntryDTO" }

    DailyGameFilmographyStateDTO:
      type: object
      properties:
        majorRoles: { type: boolean }
        guessedActors:
          type: array
          items: { $ref: "#/components/schemas/DailyGameActorGuessDTO" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/DailyGameFilmographyEntryDTO" }

    DailyGameGuessFeedbackDTO:
      type: object
      description: Feedback da última tentativa. Também é preservado no attempt_details do desafio da
        data GMT atual e removido na limpeza pós-meia-noite; não vira histórico permanente.
      properties:
        seriesCorrect: { type: boolean }
        seasonCorrect: { type: boolean }
        episodeCorrect: { type: boolean }
        exactMatch: { type: boolean, description: True somente quando série, temporada e episódio coincidem. }

    DailyGameSearchResultDTO:
      type: object
      description: >
        Candidato TMDB para seleção. Episódios são identificados por seriesTmdbId, seasonNumber e
        episodeNumber; tmdbId e personTmdbId ficam nulos conforme o tipo do alvo.
      properties:
        targetKind: { $ref: "#/components/schemas/DailyGameTargetKind" }
        tmdbId: { type: string, nullable: true }
        personTmdbId: { type: string, nullable: true }
        seriesTmdbId: { type: string, nullable: true }
        seasonNumber: { type: integer, nullable: true }
        episodeNumber: { type: integer, nullable: true }
        title: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true, format: uri }
        date: { type: string, format: date, nullable: true }

    DailyGameSeasonOptionDTO:
      type: object
      properties:
        seasonNumber: { type: integer, minimum: 1 }
        name: { type: string }
        episodeCount: { type: integer, nullable: true }

    DailyGameEpisodeOptionDTO:
      type: object
      properties:
        seriesTmdbId: { type: string }
        seasonNumber: { type: integer, minimum: 1 }
        episodeNumber: { type: integer, minimum: 1 }
        name: { type: string }
        airDate: { type: string, format: date, nullable: true }

    DailyGameRankingEntryDTO:
      type: object
      description: Agregado acumulado dos resultados terminais do usuário.
      properties:
        rank: { type: integer, format: int64 }
        userId: { type: string, format: uuid }
        username: { type: string }
        profilePicture: { type: string, nullable: true }
        score: { type: integer, format: int64 }
        gamesPlayed: { type: integer, format: int64, description: Quantidade de resultados terminais do usuário no escopo do ranking. }

    DailyGameSearchPage:
      type: object
      description: PageResponseDTO<DailyGameSearchResultDTO>; page é 1-based na resposta.
      required: [content, page, size, totalElements, totalPages, hasNext]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/DailyGameSearchResultDTO" }
        page: { type: integer, minimum: 1 }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        hasNext: { type: boolean }

    DailyGameHistoryPage:
      type: object
      description: PageResponseDTO<DailyGameHistoryDTO>; page é 1-based na resposta.
      required: [content, page, size, totalElements, totalPages, hasNext]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/DailyGameHistoryDTO" }
        page: { type: integer, minimum: 1 }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        hasNext: { type: boolean }

    DailyGameRankingPage:
      type: object
      description: PageResponseDTO<DailyGameRankingEntryDTO>; page é 1-based na resposta.
      required: [content, page, size, totalElements, totalPages, hasNext]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/DailyGameRankingEntryDTO" }
        page: { type: integer, minimum: 1 }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        hasNext: { type: boolean }
