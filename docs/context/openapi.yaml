        "403":
          description: Cookie CSRF ausente ou inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404": { description: Pick não encontrado ou não pertence ao usuário }

  /picks/{pickId}/comments:
    parameters:
      - { name: pickId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Comments]
      summary: Listar comentários de um Pick
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Página de comentários, content: { application/json: { schema: { $ref: "#/components/schemas/CommentPage" } } } }
        "401": { description: Não autenticado }
        "403": { description: Pick privado para o viewer }
        "404": { description: Pick não encontrado }
    post:
