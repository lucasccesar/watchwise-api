        Retorna as oito modalidades da data GMT informada. Hoje e datas passadas podem ser consultados;
        datas futuras são rejeitadas. Um usuário sem resultado pode iniciar os jogos por meio da rota de
        tentativa da mesma data; resultados em andamento podem ser retomados.
