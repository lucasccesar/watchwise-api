          required: true
          description: Data GMT do conjunto diário.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Estado dos oito jogos da data informada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyGameTodayResponseDTO" }
        "400":
          description: Data futura ou inválida; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Autenticação ausente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Os desafios da data ainda não estão disponíveis; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

