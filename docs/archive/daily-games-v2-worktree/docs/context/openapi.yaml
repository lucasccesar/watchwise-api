      responses:
        "200":
          description: Estado da modalidade do dia.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyGameStateDTO" }
        "400":
          description: gameType inválido; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Autenticação ausente; retorna ApiError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Desafio da modalidade não disponível; retorna ApiError.
