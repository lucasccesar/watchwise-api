spring.application.name=watchwise-demo-api
spring.profiles.active=dev
server.servlet.context-path=/api/v1

spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

app.http.max-json-body-bytes=2097152
app.tmdb.details-cache-maximum-size=10000
app.auth.email-confirmation.token-ttl-minutes=30
app.auth.registration.max-pending-attempts-per-email=3
app.auth.registration.cleanup.cron=0 */15 * * * *

app.report.cleanup.cron=0 0 2 * * *
app.import.cleanup.cron=0 */15 * * * *

logging.pattern.console= %green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
