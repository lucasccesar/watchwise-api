spring.application.name=watchwise-demo-api
spring.profiles.default=dev
server.servlet.context-path=/api/v1

spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

app.cache.memory.mode=${WATCHWISE_CACHE_MODE:entries}
app.cache.memory.max-estimated-bytes=${WATCHWISE_CACHE_MAX_ESTIMATED_BYTES:}
app.cache.memory.media-max-estimated-bytes=${WATCHWISE_CACHE_MEDIA_MAX_ESTIMATED_BYTES:52428800}

app.http.max-json-body-bytes=2097152
app.tmdb.details-cache-maximum-size=10000
app.auth.email-confirmation.token-ttl-minutes=30
app.auth.registration.max-pending-attempts-per-email=3
app.auth.registration.cleanup.cron=0 */15 * * * *
app.auth.password-reset.token-ttl-minutes=30
app.rate-limit.password-reset.max-requests=5
app.rate-limit.password-reset.window-minutes=15
app.rate-limit.password-reset-email.max-requests=5
app.rate-limit.password-reset-email.window-minutes=15
app.email.resend.enabled=${RESEND_EMAIL_ENABLED:false}
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.resend.from=${RESEND_FROM_EMAIL:}

app.report.cleanup.cron=0 0 2 * * *
app.import.cleanup.cron=0 */15 * * * *

logging.pattern.console= %green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
