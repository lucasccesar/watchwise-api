server.port=${PORT:8080}
server.forward-headers-strategy=native
spring.docker.compose.enabled=false
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
spring.datasource.hikari.data-source-properties.sslmode=require
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

app.cache.memory.mode=${WATCHWISE_CACHE_MODE:weighted}
app.cache.memory.max-estimated-bytes=${WATCHWISE_CACHE_MAX_ESTIMATED_BYTES:}
app.cache.memory.media-max-estimated-bytes=${WATCHWISE_CACHE_MEDIA_MAX_ESTIMATED_BYTES:52428800}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
app.jwt.refresh-expiration-days=7
app.cookies.secure=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}

app.rate-limit.login.max-attempts=5
app.rate-limit.login.window-minutes=15
app.rate-limit.login.block-minutes=15
app.rate-limit.login-ip.max-requests=20
app.rate-limit.login-ip.window-minutes=15
app.rate-limit.register.max-requests=10
app.rate-limit.register.window-minutes=15
app.rate-limit.oauth.max-requests=10
app.rate-limit.oauth.window-minutes=15
app.rate-limit.refresh.max-requests=30
app.rate-limit.refresh.window-minutes=15
app.rate-limit.delete-account.max-attempts=5
app.rate-limit.delete-account.window-minutes=15
app.rate-limit.delete-account.block-minutes=15
app.rate-limit.patch-account.max-attempts=5
app.rate-limit.patch-account.window-minutes=15
app.rate-limit.patch-account.block-minutes=15
app.rate-limit.profile-scan.max-requests=30
app.rate-limit.profile-scan.window-minutes=5
app.rate-limit.search.max-requests=30
app.rate-limit.search.window-minutes=5
app.rate-limit.trending.max-requests=30
app.rate-limit.trending.window-minutes=5
app.rate-limit.daily-game-search.max-requests=30
app.rate-limit.daily-game-search.window-minutes=5
app.rate-limit.daily-game-attempt.max-requests=20
app.rate-limit.daily-game-attempt.window-minutes=5
app.rate-limit.pick-create.max-requests=2
app.rate-limit.pick-create.window-minutes=1
app.rate-limit.follow-action.max-requests=20
app.rate-limit.follow-action.window-minutes=5
app.rate-limit.follow-people-action.max-requests=20
app.rate-limit.follow-people-action.window-minutes=5
app.rate-limit.content-reference.max-requests=60
app.rate-limit.content-reference.window-minutes=5
app.rate-limit.diary-action.max-requests=60
app.rate-limit.diary-action.window-minutes=5
app.rate-limit.diary-bulk-action.max-requests=10
app.rate-limit.diary-bulk-action.window-minutes=15
app.rate-limit.dropped-action.max-requests=20
app.rate-limit.dropped-action.window-minutes=5
app.rate-limit.watchlist-action.max-requests=20
app.rate-limit.watchlist-action.window-minutes=5
app.rate-limit.top5-action.max-requests=20
app.rate-limit.top5-action.window-minutes=5
app.rate-limit.cleanup.cron=0 0 * * * *

app.watchlist.view.max-materialized-sort-candidates=${WATCHLIST_VIEW_MAX_MATERIALIZED_SORT_CANDIDATES:1000}
app.notification.cleanup.cron=0 30 3 * * *
app.refresh-token-cleanup.cron=0 0 3 * * *

app.tmdb.base-url=https://api.themoviedb.org/3
app.tmdb.api-key=${APP_TMDB_API_KEY}
app.tmdb.timeout-ms=5000
app.tmdb.details-cache-ttl-hours=24
app.tmdb.person-aggregate-cache-max-size=10000
app.tmdb.calendar-schedule-cache-ttl-hours=24
app.tmdb.calendar-schedule-cache-maximum-size=10000
app.tmdb.search-cache-ttl-minutes=10
app.tmdb.search-cache-max-size=10000
app.tmdb.discovery-cache-ttl-minutes=10
app.tmdb.discovery-cache-max-size=10000
app.tmdb.trending-cache-ttl-minutes=10
app.tmdb.trending-cache-max-size=10000
app.tmdb.tv-content-ratings-cache-ttl-minutes=60
app.tmdb.tv-content-ratings-cache-max-size=10000

app.daily-games.generation.cron=0 */10 * * * *
app.daily-games.attempt-details-cleanup.cron=0 5 0 * * *
app.daily-games.rating-region=BR
app.daily-games.generation-max-candidates=100
app.daily-games.search-cache-ttl-minutes=10
app.daily-games.search-cache-max-size=10000
app.daily-games.filmography-series-detail-max-lookups=50
app.content.runtime-aggregate-refresh-hours=168
app.content-tracking.cron=0 0 4 * * *
app.followed-person-tracking.cron=0 0 5 * * MON
app.calendar-schedule-refresh.cron=0 30 4 * * *
app.content-release-date-snapshot-refresh.cron=0 0 */6 * * *

app.email.resend.enabled=${RESEND_EMAIL_ENABLED:true}
app.email.resend.api-key=${RESEND_API_KEY}
app.email.resend.from=${RESEND_FROM_EMAIL}

app.import.storage.backend=${WATCHWISE_IMPORT_STORAGE_BACKEND:r2}
app.import.storage-directory=${WATCHWISE_IMPORT_STORAGE_DIRECTORY:}
app.import.r2.endpoint=${WATCHWISE_R2_ENDPOINT:}
app.import.r2.bucket=${WATCHWISE_R2_BUCKET:}
app.import.r2.access-key-id=${WATCHWISE_R2_ACCESS_KEY_ID:}
app.import.r2.secret-access-key=${WATCHWISE_R2_SECRET_ACCESS_KEY:}
app.import.r2.region=auto
app.import.r2.connection-timeout-ms=${WATCHWISE_R2_CONNECTION_TIMEOUT_MS:3000}
app.import.r2.socket-timeout-ms=${WATCHWISE_R2_SOCKET_TIMEOUT_MS:5000}
app.import.r2.attempt-timeout-ms=${WATCHWISE_R2_ATTEMPT_TIMEOUT_MS:10000}
app.import.r2.operation-timeout-ms=${WATCHWISE_R2_OPERATION_TIMEOUT_MS:20000}
app.import.r2.max-attempts=${WATCHWISE_R2_MAX_ATTEMPTS:2}
app.import.temporary-directory=${WATCHWISE_IMPORT_TEMPORARY_DIRECTORY:${java.io.tmpdir}/watchwise-import-work}
app.import.staging-directory=${WATCHWISE_IMPORT_STAGING_DIRECTORY:}
app.import.max-concurrent-uploads-per-process=${WATCHWISE_IMPORT_MAX_CONCURRENT_UPLOADS:2}
app.import.max-concurrent-artifact-reads-per-process=${WATCHWISE_IMPORT_MAX_CONCURRENT_ARTIFACT_READS:2}
app.import.worker.fixed-delay-ms=${IMPORT_WORKER_FIXED_DELAY_MS:5000}
app.import.worker.enabled=${IMPORT_WORKER_ENABLED:true}
app.import.cleanup.enabled=${IMPORT_CLEANUP_ENABLED:true}
