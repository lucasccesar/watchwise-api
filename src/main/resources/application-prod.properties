# Only enable if the app runs behind a trusted reverse proxy/load balancer on
# a private network — activates Tomcat's RemoteIpValve, which rewrites
# getRemoteAddr() from X-Forwarded-For but only trusts it when the immediate
# TCP peer matches server.tomcat.remoteip.internal-proxies (Tomcat's default
# covers standard private ranges). Without this, every IP-keyed rate limit
# (AttemptLockout, RequestThrottler) sees the proxy's IP for all clients.
# If the real proxy sits outside the default internal-proxy ranges, also set
# server.tomcat.remoteip.internal-proxies to match before relying on this.
#server.forward-headers-strategy=native

