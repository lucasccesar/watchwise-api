<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Episódio por frame · Jogos</title><link rel="stylesheet" href="games.css"></head>
<body><main class="shell">
  <header class="topbar"><a class="brand" href="index.html">← Jogos Diários</a><div id="session-panel" class="session hidden"><span>Conectado como <strong id="session-username"></strong></span><button id="logout-button" class="secondary" type="button">Sair</button></div></header>
  <div id="unauthenticated-panel" class="subtle">Verificando sessão…</div><div id="game-error" class="error" role="alert"></div>
  <section id="game-panel" class="hidden"><div class="hero"><p class="eyebrow">EPISODE_BY_FRAME</p><h1 id="game-title">Episódio por frame</h1><p id="game-date">Desafio de hoje</p><p class="subtle">O desafio só é gerado quando o episódio tem pelo menos seis frames distintos.</p></div>
    <div class="game-layout"><div class="game-main"><section class="panel"><div class="panel-heading"><div id="game-status"></div><button id="reload-button" class="secondary" type="button">Atualizar</button></div><div class="stats"><div class="stat"><strong id="attempts">0 / 0</strong><span>Tentativas</span></div><div class="stat"><strong id="attempts-remaining">0</strong><span>Restantes</span></div><div class="stat"><strong id="score">0</strong><span>Pontos</span></div></div><div id="game-image" class="image-stage"><div class="loading">Carregando frames…</div></div><div id="visible-images" class="image-grid hidden"></div></section><section id="guess-feedback" class="panel hidden"></section><section id="answer-panel" class="answer-card hidden"></section><section class="panel"><div class="panel-heading"><h2>Pistas</h2></div><div id="hints" class="hint-list"></div></section><section class="panel"><div class="panel-heading"><h2>Tentativas</h2></div><div id="attempts-log" class="attempt-list"></div></section></div>
    <aside class="game-sidebar"><section class="panel"><div class="panel-heading"><h2>Escolher episódio</h2></div><form id="series-search-form" class="inline-form"><label>Série<input id="series-query" placeholder="The Last of Us" autocomplete="off"></label><button id="series-search-submit" type="submit">Buscar</button></form><div id="series-results" class="search-results"></div><p id="selected-series" class="selected-candidate"></p><div class="form-grid" style="margin-top:.8rem"><label>Temporada<select id="season-select" disabled><option>Selecione uma série</option></select></label><label>Episódio<select id="episode-select" disabled><option>Selecione uma temporada</option></select></label></div><p id="selected-episode" class="selected-candidate"></p></section><section class="panel"><label class="check"><input id="share-on-completion" type="checkbox"> Compartilhar resultado terminal no feed</label><div class="inline-form" style="margin-top:.8rem"><button id="submit-button" type="button">Enviar palpite</button><button id="give-up-button" class="danger" type="button">Desistir</button></div></section></aside></div>
  </section>
</main><script src="games.js"></script><script>GameTestUi.start({ page: "game", gameType: "EPISODE_BY_FRAME", title: "Episódio por frame", targetKind: "EPISODE", mode: "episode" });</script></body></html>
