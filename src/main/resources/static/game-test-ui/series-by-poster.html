<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Série por pôster · Jogos</title><link rel="stylesheet" href="games.css"></head>
<body><main class="shell">
  <header class="topbar"><a class="brand" href="index.html">← Jogos Diários</a><div id="session-panel" class="session hidden"><span>Conectado como <strong id="session-username"></strong></span><button id="logout-button" class="secondary" type="button">Sair</button></div></header>
  <div id="unauthenticated-panel" class="subtle">Verificando sessão…</div><div id="game-error" class="error" role="alert"></div>
  <section id="game-panel" class="hidden"><div class="hero"><p class="eyebrow">SERIES_BY_POSTER</p><h1 id="game-title">Série por pôster</h1><p id="game-date">Desafio de hoje</p></div>
    <div class="game-layout"><div class="game-main"><section class="panel"><div class="panel-heading"><div id="game-status"></div><button id="reload-button" class="secondary" type="button">Atualizar</button></div><div class="stats"><div class="stat"><strong id="attempts">0 / 0</strong><span>Tentativas</span></div><div class="stat"><strong id="attempts-remaining">0</strong><span>Restantes</span></div><div class="stat"><strong id="score">0</strong><span>Pontos</span></div></div><div id="game-image" class="image-stage"><div class="loading">Carregando imagem…</div></div><div id="visible-images" class="image-grid hidden"></div></section><section id="answer-panel" class="answer-card hidden"></section><section class="panel"><div class="panel-heading"><h2>Pistas</h2></div><div id="hints" class="hint-list"></div></section><section class="panel"><div class="panel-heading"><h2>Tentativas</h2></div><div id="attempts-log" class="attempt-list"></div></section></div>
    <aside class="game-sidebar"><section class="panel"><div class="panel-heading"><h2>Pesquisar série</h2></div><form id="search-form" class="inline-form"><label>Nome<input id="search-query" placeholder="Breaking Bad" autocomplete="off"></label><button id="search-submit" type="submit">Buscar</button></form><div id="search-results" class="search-results"></div><p id="selected-candidate" class="selected-candidate"></p></section><section class="panel"><label class="check"><input id="share-on-completion" type="checkbox"> Compartilhar resultado terminal no feed</label><div class="inline-form" style="margin-top:.8rem"><button id="submit-button" type="button">Enviar palpite</button><button id="give-up-button" class="danger" type="button">Desistir</button></div></section></aside></div>
  </section>
</main><script src="games.js"></script><script>GameTestUi.start({ page: "game", gameType: "SERIES_BY_POSTER", title: "Série por pôster", targetKind: "SERIES", mode: "candidate" });</script></body></html>
